<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urutan Peristiwa Recount</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>
.wrap{padding:14px 16px;display:grid;gap:12px}
.intro{font-size:14px;color:var(--muted)}
.psg{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:14.5px;line-height:1.6}
.psg b{font-family:var(--display)}
.psg table{border-collapse:collapse;margin:8px 0}.psg td,.psg th{border:1px solid var(--line-2);padding:4px 12px;text-align:center}
.items{display:grid;gap:8px;padding:0;list-style:none}
.it{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;display:grid;gap:8px;background:var(--surface)}
.it.ok{border-color:var(--ok);background:var(--ok-soft)}
.it.no{border-color:var(--bad);background:var(--bad-soft)}
.it .tx{font-size:14.5px}
.it .why{font-size:13px;color:var(--muted)}
.it .seg button{font-size:12.5px;padding:6px 6px;white-space:normal;flex:1 1 30%;min-width:0}
.it .tx{overflow-wrap:anywhere}
.ord{display:flex;gap:10px;align-items:center}
.ord .n{font-family:var(--display);font-weight:800;min-width:22px;text-align:center}
.ord .tx{flex:1}
.ord .mv{display:flex;flex-direction:column;gap:4px}
.ord .mv button{width:32px;height:28px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:800}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="seg" id="sets"><button>Recount pribadi</button><button>Recount faktual</button></div>
  <p class="intro" id="intro"></p>
  <div class="psg" id="psg" hidden></div>
  <ul class="items" id="items"></ul>
  <div class="bar"><button class="btn primary" id="cek">Check</button><button class="btn" id="ulang">Reset</button></div>
  <div class="box" id="res" hidden></div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const SETS = [{"name": "Recount pribadi", "intro": "These sentences come from a recount titled <i>Volunteering at a Book Fair</i>. Use the arrows to put them in the correct order, then press <b>Check</b>. Look for time signals such as <i>last month, on the first morning, by noon, at the end</i>.", "items": [["Last month, my classmates and I volunteered at the city book fair.", "Orientation: who, when, where."], ["On the first morning, we carried boxes of books from the trucks to the stalls.", "First event, signalled by 'On the first morning'."], ["By noon, the hall was full, and I was asked to help at the children's corner.", "'By noon' shows a later time on the same day."], ["In the afternoon, I read picture books aloud to a group of small children.", "Follows the request to help at the children's corner."], ["On the last day, the organizers gave each volunteer a certificate and a free book.", "'On the last day' moves the story to the end."], ["It was tiring, but I realized how much I enjoy sharing stories with children.", "Reorientation: the writer's reflection."]], "start": [1, 3, 5, 0, 2, 4]}, {"name": "Recount faktual", "intro": "Arrange these events about the Proclamation of Indonesian Independence in the order they happened.", "items": [["On 15 August 1945, news spread that Japan had surrendered to the Allies.", "The background event that started everything."], ["Early on 16 August, young activists took Soekarno and Hatta to Rengasdengklok.", "The youth group wanted the proclamation to happen quickly."], ["On the night of 16 August, the text of the proclamation was drafted at Admiral Maeda's house in Jakarta.", "After returning from Rengasdengklok."], ["At 10 a.m. on 17 August, Soekarno read the proclamation at Jalan Pegangsaan Timur 56.", "The main event."], ["Right after the reading, the red-and-white flag was raised in front of the house.", "Immediately after the proclamation."], ["In the following days, the news was spread by radio, newspapers, and messengers across the country.", "The final stage: spreading the news."]], "start": [1, 3, 5, 0, 2, 4]}];
const MODE = 'order';
const T = {"pick": "Choose a category for every item first.", "of": "of", "correct": "correct", "done": "Well done!", "retry": "Read the notes under each item, then try again.", "pos": "Correct position:", "ans": "Answer:", "up": "Move up", "down": "Move down", "cek": "Check", "ulang": "Reset"};
const $ = id => document.getElementById(id);
const esc = s => s;
let cur = 0, ans = [], order = [], checked = false;
function pick(i){
  cur = i; checked = false;
  const S = SETS[i];
  if($('sets')) $('sets').querySelectorAll('button').forEach((b, j) => b.classList.toggle('on', j === i));
  $('intro').innerHTML = S.intro;
  $('psg').hidden = !S.passage; $('psg').innerHTML = S.passage || '';
  if(MODE === 'order'){
    // urutan awal teracak tetap (bukan urutan benar)
    const n = S.items.length; order = S.start.slice();
  } else ans = S.items.map(() => null);
  $('res').hidden = true;
  draw();
}
function draw(){
  const S = SETS[cur], ul = $('items'); ul.innerHTML = '';
  if(MODE === 'order'){
    order.forEach((k, pos) => {
      const it = S.items[k], li = document.createElement('li');
      li.className = 'it' + (checked ? (k === pos ? ' ok' : ' no') : '');
      li.innerHTML = `<div class="ord"><span class="n">${pos + 1}</span><span class="tx">${it[0]}</span><span class="mv"><button aria-label="${T.up}">↑</button><button aria-label="${T.down}">↓</button></span></div>` + (checked ? `<div class="why">${k === pos ? '✓ ' : '✗ ' + T.pos + ' ' + (k + 1) + '. '}${it[1]}</div>` : '');
      const [up, dn] = li.querySelectorAll('.mv button');
      up.disabled = pos === 0; dn.disabled = pos === order.length - 1;
      up.onclick = () => { [order[pos - 1], order[pos]] = [order[pos], order[pos - 1]]; checked = false; $('res').hidden = true; draw(); };
      dn.onclick = () => { [order[pos + 1], order[pos]] = [order[pos], order[pos + 1]]; checked = false; $('res').hidden = true; draw(); };
      ul.appendChild(li);
    });
  } else {
    S.items.forEach((it, i) => {
      const li = document.createElement('li');
      const ok = ans[i] === it[1];
      li.className = 'it' + (checked ? (ok ? ' ok' : ' no') : '');
      li.innerHTML = `<div class="tx">${it[0]}</div><div class="seg">${S.cats.map((c, j) => `<button data-j="${j}" class="${ans[i] === j ? 'on' : ''}">${c}</button>`).join('')}</div>` + (checked ? `<div class="why">${ok ? '✓ ' : '✗ ' + T.ans + ' <b>' + S.cats[it[1]] + '</b>. '}${it[2]}</div>` : '');
      li.querySelectorAll('.seg button').forEach(b => b.onclick = () => { ans[i] = +b.dataset.j; if(checked){ checked = false; $('res').hidden = true; } draw(); });
      ul.appendChild(li);
    });
  }
}
$('cek').onclick = () => {
  const S = SETS[cur];
  let ok = 0, n = S.items.length;
  if(MODE === 'order') order.forEach((k, pos) => ok += k === pos);
  else { if(ans.some(a => a === null)){ $('res').hidden = false; $('res').className = 'box info'; $('res').innerHTML = T.pick; return; } ans.forEach((a, i) => ok += a === S.items[i][1]); }
  checked = true; draw();
  $('res').hidden = false; $('res').className = 'box ' + (ok === n ? 'ok' : 'no');
  $('res').innerHTML = `<b>${ok} ${T.of} ${n} ${T.correct}.</b> ` + (ok === n ? (S.done || T.done) : T.retry);
};
$('ulang').onclick = () => pick(cur);
if($('sets')) $('sets').querySelectorAll('button').forEach((b, j) => b.onclick = () => pick(j));
pick(0);
</script>
</body>
</html>
