<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Struktur Narrative Text</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>
.wrap{padding:14px 16px;display:grid;gap:12px}
.intro{font-size:14px;color:var(--muted)}
.psg{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:14.5px;line-height:1.6}
.psg b{font-family:var(--display)}
.psg table{border-collapse:collapse;margin:8px 0}.psg td,.psg th{border:1px solid var(--line-2);padding:4px 12px;text-align:center}
.items{display:grid;gap:8px;padding:0;list-style:none}
.it{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;display:grid;gap:8px;background:var(--surface)}
.it.ok{border-color:var(--ok);background:var(--ok-soft)}
.it.no{border-color:var(--bad);background:var(--bad-soft)}
.it .tx{font-size:14.5px}
.it .why{font-size:13px;color:var(--muted)}
.it .seg button{font-size:12.5px;padding:6px 6px;white-space:normal;flex:1 1 30%;min-width:0}
.it .tx{overflow-wrap:anywhere}
.ord{display:flex;gap:10px;align-items:center}
.ord .n{font-family:var(--display);font-weight:800;min-width:22px;text-align:center}
.ord .tx{flex:1}
.ord .mv{display:flex;flex-direction:column;gap:4px}
.ord .mv button{width:32px;height:28px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:800}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="seg" id="sets"><button>Struktur cerita</button><button>Realitas atau fantasi</button></div>
  <p class="intro" id="intro"></p>
  <div class="psg" id="psg" hidden></div>
  <ul class="items" id="items"></ul>
  <div class="bar"><button class="btn primary" id="cek">Check</button><button class="btn" id="ulang">Reset</button></div>
  <div class="box" id="res" hidden></div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const SETS = [{"name": "Struktur cerita", "cats": ["Orientation", "Complication", "Resolution", "Coda"], "intro": "The paragraphs below tell the fable <i>The Ant and the Dove</i>. Decide which part of the narrative structure each one is.", "items": [["One hot day, a thirsty ant went to a river to drink. A dove was sitting on a branch above the water.", 0, "Introduces the characters, place, and time."], ["As the ant drank, a wave suddenly washed it into the river. The little ant struggled and was about to drown.", 1, "The first problem appears."], ["The dove quickly dropped a leaf into the water. The ant climbed onto it and floated safely to the bank.", 2, "The first problem is solved."], ["A few days later, a hunter aimed his arrow at the dove, who did not see the danger.", 1, "A new problem: the dove is in danger."], ["The ant saw the hunter and bit his foot hard. The hunter shouted, and the dove flew away safely.", 2, "The second problem is solved."], ["One good turn deserves another.", 3, "The moral of the story (coda)."]]}, {"name": "Realitas atau fantasi", "cats": ["Could happen in real life", "Fantasy"], "intro": "Decide whether each event <b>could happen in real life</b> or is <b>fantasy</b>.", "items": [["A girl finds a lost wallet and returns it to its owner.", 0, "This is realistic."], ["A crocodile talks to a mouse deer and agrees to a deal.", 1, "Animals cannot talk: fantasy."], ["A prince searches for his missing bride for months.", 0, "Unusual but possible."], ["A princess is turned into a golden snail by a spell.", 1, "Magic is fantasy."], ["A farmer's daughter tricks a greedy merchant with a stone.", 0, "Clever, but realistic."], ["A giant stone ship appears overnight because of a curse.", 1, "Curses and overnight transformations are fantasy."]]}];
const MODE = 'classify';
const $ = id => document.getElementById(id);
const esc = s => s;
let cur = 0, ans = [], order = [], checked = false;
function pick(i){
  cur = i; checked = false;
  const S = SETS[i];
  if($('sets')) $('sets').querySelectorAll('button').forEach((b, j) => b.classList.toggle('on', j === i));
  $('intro').innerHTML = S.intro;
  $('psg').hidden = !S.passage; $('psg').innerHTML = S.passage || '';
  if(MODE === 'order'){
    // urutan awal teracak tetap (bukan urutan benar)
    const n = S.items.length; order = S.start.slice();
  } else ans = S.items.map(() => null);
  $('res').hidden = true;
  draw();
}
function draw(){
  const S = SETS[cur], ul = $('items'); ul.innerHTML = '';
  if(MODE === 'order'){
    order.forEach((k, pos) => {
      const it = S.items[k], li = document.createElement('li');
      li.className = 'it' + (checked ? (k === pos ? ' ok' : ' no') : '');
      li.innerHTML = `<div class="ord"><span class="n">${pos + 1}</span><span class="tx">${it[0]}</span><span class="mv"><button aria-label="Move up">↑</button><button aria-label="Move down">↓</button></span></div>` + (checked ? `<div class="why">${k === pos ? '✓ ' : '✗ Correct position: ' + (k + 1) + '. '}${it[1]}</div>` : '');
      const [up, dn] = li.querySelectorAll('.mv button');
      up.disabled = pos === 0; dn.disabled = pos === order.length - 1;
      up.onclick = () => { [order[pos - 1], order[pos]] = [order[pos], order[pos - 1]]; checked = false; $('res').hidden = true; draw(); };
      dn.onclick = () => { [order[pos + 1], order[pos]] = [order[pos], order[pos + 1]]; checked = false; $('res').hidden = true; draw(); };
      ul.appendChild(li);
    });
  } else {
    S.items.forEach((it, i) => {
      const li = document.createElement('li');
      const ok = ans[i] === it[1];
      li.className = 'it' + (checked ? (ok ? ' ok' : ' no') : '');
      li.innerHTML = `<div class="tx">${it[0]}</div><div class="seg">${S.cats.map((c, j) => `<button data-j="${j}" class="${ans[i] === j ? 'on' : ''}">${c}</button>`).join('')}</div>` + (checked ? `<div class="why">${ok ? '✓ ' : '✗ Answer: <b>' + S.cats[it[1]] + '</b>. '}${it[2]}</div>` : '');
      li.querySelectorAll('.seg button').forEach(b => b.onclick = () => { ans[i] = +b.dataset.j; if(checked){ checked = false; $('res').hidden = true; } draw(); });
      ul.appendChild(li);
    });
  }
}
$('cek').onclick = () => {
  const S = SETS[cur];
  let ok = 0, n = S.items.length;
  if(MODE === 'order') order.forEach((k, pos) => ok += k === pos);
  else { if(ans.some(a => a === null)){ $('res').hidden = false; $('res').className = 'box info'; $('res').innerHTML = 'Choose a category for every item first.'; return; } ans.forEach((a, i) => ok += a === S.items[i][1]); }
  checked = true; draw();
  $('res').hidden = false; $('res').className = 'box ' + (ok === n ? 'ok' : 'no');
  $('res').innerHTML = `<b>${ok} of ${n} correct.</b> ` + (ok === n ? (S.done || 'Well done!') : 'Read the notes under each item, then try again.');
};
$('ulang').onclick = () => pick(cur);
if($('sets')) $('sets').querySelectorAll('button').forEach((b, j) => b.onclick = () => pick(j));
pick(0);
</script>
</body>
</html>
