<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembagian SHU Koperasi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 320" role="img" aria-label="Diagram pembagian sisa hasil usaha koperasi"></svg></div>
  <div class="panel">
    <div class="lab">SHU koperasi tahun ini <b id="sv"></b></div><input type="range" id="s" min="10" max="100" step="1" value="40">
    <div class="lab">Bagian jasa modal (% SHU) <b id="mv"></b></div><input type="range" id="m" min="10" max="40" step="5" value="25">
    <div class="lab">Bagian jasa anggota/usaha (% SHU) <b id="uv"></b></div><input type="range" id="u" min="10" max="50" step="5" value="35">
    <div class="lab">Simpanan seorang anggota (dari total simpanan Rp160 juta) <b id="av"></b></div><input type="range" id="a" min="0.5" max="10" step="0.25" value="2.4">
    <div class="lab">Belanja anggota itu di koperasi (dari total penjualan Rp700 juta) <b id="bv"></b></div><input type="range" id="b" min="1" max="30" step="0.5" value="8.4">
    <div class="read" id="read"></div>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const rp = v => Math.round(v).toLocaleString('id-ID');
const $ = id => document.getElementById(id);
const svg = $('svg');
const TS = 160, TP = 700;
['s', 'm', 'u', 'a', 'b'].forEach(i => $(i).oninput = draw);
function draw(){
  const S = +$('s').value, m = +$('m').value, u = +$('u').value, a = +$('a').value, b = +$('b').value;
  $('sv').textContent = `Rp${S} juta`; $('mv').textContent = m + '%'; $('uv').textContent = u + '%'; $('av').textContent = `Rp${fmt(a, 2)} juta`; $('bv').textContent = `Rp${fmt(b, 1)} juta`;
  const lain = 100 - m - u;
  const parts = [['jasa modal', m, '#1e88e5'], ['jasa anggota', u, '#43a047'], ['cadangan, pengurus, pendidikan, sosial, dan lainnya', lain, '#bdbdbd']];
  let s = '', x = 30;
  parts.forEach(([n, p, c]) => { const w = p / 100 * 420; s += `<rect x="${x}" y="40" width="${w}" height="50" fill="${c}"/>${w > 50 ? `<text class="s" x="${x + w / 2}" y="70" text-anchor="middle" fill="#fff">${p}%</text>` : ''}`; x += w; });
  s += `<text class="s" x="30" y="30" style="fill:var(--ink)">SHU Rp${S} juta dibagi menurut AD/ART:</text>`;
  const JM = S * m / 100, JU = S * u / 100, sm = a / TS * JM, su = b / TP * JU;
  s += `<text class="s" x="30" y="115" fill="#1e88e5">jasa modal Rp${fmt(JM, 2)} juta</text><text class="s" x="200" y="115" fill="#43a047">jasa anggota Rp${fmt(JU, 2)} juta</text>`;
  s += `<rect x="30" y="160" width="${Math.min(400, sm * 200)}" height="30" fill="#1e88e5"/><text class="c" x="${36 + Math.min(400, sm * 200)}" y="180" fill="#1e88e5">${fmt(sm * 1000, 0)} ribu</text><text class="s" x="30" y="152" fill="#555">bagian anggota dari jasa modal = simpanan/total simpanan × jasa modal</text>`;
  s += `<rect x="30" y="230" width="${Math.min(400, su * 200)}" height="30" fill="#43a047"/><text class="c" x="${36 + Math.min(400, su * 200)}" y="250" fill="#43a047">${fmt(su * 1000, 0)} ribu</text><text class="s" x="30" y="222" fill="#555">bagian anggota dari jasa usaha = belanja/total penjualan × jasa anggota</text>`;
  svg.innerHTML = s;
  $('read').innerHTML = `<div><span>SHU anggota dari jasa modal</span><b>Rp${rp(sm * 1e6)}</b></div><div><span>SHU anggota dari jasa usaha</span><b>Rp${rp(su * 1e6)}</b></div><div><span>Total SHU anggota</span><b>Rp${rp((sm + su) * 1e6)}</b></div><div><span>Prinsip</span><b style="font-weight:600">SHU dibagi sebanding dengan jasa (simpanan dan transaksi) setiap anggota, bukan sama rata</b></div>`;
}
draw();
</script>
</body>
</html>
