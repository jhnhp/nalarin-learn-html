<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<rect x="10" y="10" width="310" height="300" rx="14" fill="#f7f8fd" stroke="#e3e6f1"/><text x="165.0" y="38.0" text-anchor="middle" class="t">Jaring-jaring tabung</text><rect x="340" y="10" width="310" height="300" rx="14" fill="#f7f8fd" stroke="#e3e6f1"/><text x="495.0" y="38.0" text-anchor="middle" class="t">Jaring-jaring kerucut</text><circle cx="165" cy="78" r="24" fill="#2447f9" fill-opacity=".18" stroke="#2447f9" stroke-width="2"/><circle cx="165" cy="252" r="24" fill="#2447f9" fill-opacity=".18" stroke="#2447f9" stroke-width="2"/><rect x="40" y="102" width="250" height="126" fill="#d98200" fill-opacity=".18" stroke="#d98200" stroke-width="2"/><text x="165.0" y="170.0" text-anchor="middle" class="b" style="fill:#d98200">selimut: 2πr × t</text><text x="165.0" y="296.0" text-anchor="middle" class="m">L = 2πr² + 2πrt = 2πr(r + t)</text><path d="M495,80 L581.0,202.9 A150,150 0 0 1 409.0,202.9 Z" fill="#d98200" fill-opacity=".18" stroke="#d98200" stroke-width="2"/><text x="495.0" y="185.0" text-anchor="middle" class="b" style="fill:#d98200">selimut: πrs</text><text x="541.0" y="146.0" text-anchor="middle" class="t" style="fill:#d98200">s</text><circle cx="495" cy="258" r="26" fill="#2447f9" fill-opacity=".18" stroke="#2447f9" stroke-width="2"/><text x="495.0" y="296.0" text-anchor="middle" class="m">L = πr² + πrs = πr(r + s)</text></svg>
