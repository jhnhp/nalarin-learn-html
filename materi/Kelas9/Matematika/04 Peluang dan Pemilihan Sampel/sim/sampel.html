<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Populasi dan Sampel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.lbl{font-family:var(--font);font-size:12px;fill:var(--muted)}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 420 330" role="img" aria-label="Populasi 400 siswa dan sampel yang dipilih"></svg></div>
  <div class="panel">
    <h3 class="t">Berapa persen siswa yang pernah membaca buku digital?</h3>
    <div><div class="lab"><span>Ukuran sampel</span><b id="nout"></b></div><input type="range" id="n" min="10" max="100" step="10" value="40"></div>
    <div class="seg" id="how"><button data-h="acak" class="on">Sampel acak</button><button data-h="bias">Hanya kelas dekat perpustakaan</button></div>
    <div class="row"><button class="btn primary" id="take">Ambil sampel</button><button class="btn" id="show">Tampilkan populasi</button></div>
    <div class="read" id="read"></div>
    <div class="box info" id="fb"></div>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
// 400 siswa dalam 20 x 20; sisi kiri (dekat perpustakaan) lebih banyak pembaca
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const POP = [];
for(let r = 0; r < 20; r++) for(let c = 0; c < 20; c++) POP.push({r, c, yes: rnd() < (c < 5 ? .8 : .3)});
const TRUE = POP.filter(p => p.yes).length / POP.length;
let how = 'acak', sample = [], reveal = false;
$('n').oninput = () => { $('nout').textContent = $('n').value + ' siswa'; };
$('how').onclick = e => { const b = e.target.closest('button'); if(!b) return; how = b.dataset.h; document.querySelectorAll('#how button').forEach(x => x.classList.toggle('on', x === b)); };
$('take').onclick = () => {
  const n = +$('n').value, pool = how === 'acak' ? POP.slice() : POP.filter(p => p.c < 5);
  sample = []; const idx = pool.map((_, i) => i);
  for(let i = 0; i < Math.min(n, pool.length); i++){ const j = i + Math.floor(Math.random() * (idx.length - i)); [idx[i], idx[j]] = [idx[j], idx[i]]; sample.push(pool[idx[i]]); }
  draw();
};
$('show').onclick = () => { reveal = !reveal; $('show').textContent = reveal ? 'Sembunyikan populasi' : 'Tampilkan populasi'; draw(); };
Sim.onTheme(draw);
function draw(){
  const S = new Set(sample);
  let s = `<rect x="6" y="6" width="96" height="306" rx="8" style="fill:var(--k)" fill-opacity=".1"/><text class="lbl" x="8" y="326">← kelas dekat perpustakaan</text>`;
  POP.forEach(p => {
    const x = 20 + p.c * 20, y = 20 + p.r * 15, inS = S.has(p);
    const col = (reveal || inS) ? (p.yes ? 'var(--a)' : 'var(--comp)') : 'var(--line-2)';
    s += `<circle cx="${x}" cy="${y}" r="${inS ? 6.5 : 4.5}" style="fill:${col}${inS ? ';stroke:var(--ink)' : ''}" stroke-width="2"/>`;
  });
  svg.innerHTML = s;
  $('nout').textContent = $('n').value + ' siswa';
  const k = sample.filter(p => p.yes).length;
  $('read').innerHTML = `<div><span>Ukuran populasi</span><b>400 siswa</b></div>` +
    (sample.length ? `<div><span>Dalam sampel, pernah membaca</span><b>${k} dari ${sample.length}</b></div><div><span>Perkiraan dari sampel</span><b>${fmt(k / sample.length * 100, 1)}%</b></div>` : '') +
    (reveal ? `<div><span>Nilai sebenarnya (populasi)</span><b>${fmt(TRUE * 100, 1)}%</b></div>` : '');
  const err = sample.length ? Math.abs(k / sample.length - TRUE) * 100 : 0;
  $('fb').innerHTML = !sample.length ? 'Biru = pernah membaca, oranye = belum. Ambil sampel, lalu bandingkan perkiraannya dengan nilai sebenarnya.' :
    how === 'bias' ? `Sampel ini hanya dari kelas dekat perpustakaan, sehingga perkiraannya cenderung <b>terlalu tinggi</b> (selisih ${fmt(err, 1)} poin persen). Sampel seperti ini <b>bias</b>.` :
    `Sampel acak memberi setiap siswa peluang sama untuk terpilih. Selisihnya dengan nilai sebenarnya ${fmt(err, 1)} poin persen. Ulangi beberapa kali: semakin besar sampel, perkiraannya biasanya makin dekat.`;
}
draw();
</script>
</body>
</html>
