<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persilangan Mendel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:13px}.s{font-family:var(--display);font-weight:700;font-size:11px}.par{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;font-size:13px;font-weight:700}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 420" role="img" aria-label="Papan Punnett persilangan kacang ercis"></svg></div>
  <div class="panel">
    <div class="seg" id="mode"><button class="on" data-v="1">Monohibrid</button><button data-v="2">Dihibrid</button></div>
    <div class="par">
      <span>Induk ♂ warna</span><div class="seg" id="p1a"></div>
      <span class="g2">Induk ♂ batang</span><div class="seg g2" id="p1b"></div>
      <span>Induk ♀ warna</span><div class="seg" id="p2a"></div>
      <span class="g2">Induk ♀ batang</span><div class="seg g2" id="p2b"></div>
    </div>
    <div class="row"><button class="btn primary" id="sim">Tanam 100 biji acak</button></div>
    <div class="read" id="read"></div>
    <p class="note">Ungu (U) dominan terhadap putih (u); batang tinggi (T) dominan terhadap pendek (t). Setiap induk memberikan satu alel dari tiap pasangan ke gametnya (hukum I Mendel); alel gen berbeda berpasangan secara bebas (hukum II Mendel).</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const $ = id => document.getElementById(id);
const svg = $('svg');
const st = {mode: 1, p1a: 'Uu', p1b: 'Tt', p2a: 'Uu', p2b: 'Tt'};
let obs = null;
function seg(id, opts){
  $(id).innerHTML = opts.map(o => `<button data-v="${o}" class="${st[id] === o ? 'on' : ''}">${o}</button>`).join('');
  $(id).querySelectorAll('button').forEach(b => b.onclick = () => { st[id] = b.dataset.v; obs = null; seg(id, opts); draw(); });
}
seg('p1a', ['UU', 'Uu', 'uu']); seg('p2a', ['UU', 'Uu', 'uu']); seg('p1b', ['TT', 'Tt', 'tt']); seg('p2b', ['TT', 'Tt', 'tt']);
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); st.mode = +b.dataset.v; obs = null; draw(); });
$('sim').onclick = () => {
  const g1 = gametes(1), g2 = gametes(2); obs = {};
  for(let i = 0; i < 100; i++){ const k = phen(join(g1[Math.random() * g1.length | 0], g2[Math.random() * g2.length | 0])); obs[k] = (obs[k] || 0) + 1; }
  draw();
};
function gametes(p){
  const a = st['p' + p + 'a'], b = st['p' + p + 'b'];
  if(st.mode === 1) return [a[0], a[1]];
  return [a[0] + b[0], a[0] + b[1], a[1] + b[0], a[1] + b[1]];
}
const ord = s => s.split('').sort((x, y) => x.toLowerCase() === y.toLowerCase() ? (x < y ? -1 : 1) : x.toLowerCase() < y.toLowerCase() ? -1 : 1).join('');
function join(x, y){ return st.mode === 1 ? ord(x + y) : ord(x[0] + y[0]) + ord(x[1] + y[1]); }
function phen(g){
  const u = g.includes('U') ? 'ungu' : 'putih';
  if(st.mode === 1) return u;
  return u + ' ' + (g.includes('T') ? 'tinggi' : 'pendek');
}
const COL = {'ungu': '#8b5cf6', 'putih': '#cbd5e1', 'ungu tinggi': '#8b5cf6', 'ungu pendek': '#c4b5fd', 'putih tinggi': '#94a3b8', 'putih pendek': '#e2e8f0'};
const ORDER = ['ungu', 'putih', 'ungu tinggi', 'ungu pendek', 'putih tinggi', 'putih pendek'];
function gcd(a, b){ return b ? gcd(b, a % b) : a; }
function ratio(counts){ const v = Object.values(counts); const g = v.reduce(gcd); return v.map(x => x / g).join(' : '); }
function draw(){
  document.querySelectorAll('.g2').forEach(e => e.style.display = st.mode === 2 ? '' : 'none');
  const g1 = gametes(1), g2 = gametes(2), n = g1.length;
  const S = st.mode === 1 ? 110 : 76, x0 = (480 - S * (n + .6)) / 2 + S * .6, y0 = 40;
  let s = `<text class="c" x="${x0 - S * .3}" y="${y0 - 12}" text-anchor="middle" style="fill:var(--muted)">♂ \\ ♀</text>`;
  g2.forEach((g, j) => s += `<text class="c" x="${x0 + S * j + S / 2}" y="${y0 - 12}" text-anchor="middle" style="fill:var(--b)">${g}</text>`);
  g1.forEach((g, i) => s += `<text class="c" x="${x0 - S * .3}" y="${y0 + S * i + S / 2 + 5}" text-anchor="middle" style="fill:var(--a)">${g}</text>`);
  const gc = {}, pc = {};
  g1.forEach((a, i) => g2.forEach((b, j) => {
    const g = join(a, b), p = phen(g); gc[g] = (gc[g] || 0) + 1; pc[p] = (pc[p] || 0) + 1;
    const x = x0 + S * j, y = y0 + S * i;
    s += `<rect x="${x + 2}" y="${y + 2}" width="${S - 4}" height="${S - 4}" rx="8" fill="${COL[p]}" fill-opacity=".45" style="stroke:var(--line-2)"/>`;
    s += `<text class="c" x="${x + S / 2}" y="${y + S / 2 + (st.mode === 1 ? -2 : 0)}" text-anchor="middle" style="fill:var(--ink)">${g}</text>`;
    s += `<text class="s" x="${x + S / 2}" y="${y + S / 2 + 16}" text-anchor="middle" style="fill:var(--ink)" fill-opacity=".7">${st.mode === 1 ? p : p.replace(' ', ', ')}</text>`;
  }));
  // pengamatan acak
  let VH = y0 + S * n + 12;
  if(obs){
    const yb = y0 + S * n + 22, keys = ORDER.filter(k => obs[k] || pc[k]), H = 70, B = yb + 14 + H;
    const exp = k => 100 * (pc[k] || 0) / (n * n), mx = Math.max(...keys.map(k => Math.max(obs[k] || 0, exp(k)))), sc = H / mx;
    s += `<text class="s" x="20" y="${yb}" style="fill:var(--muted)">100 biji ditanam: hasil acak (batang) vs harapan (garis putus-putus)</text>`;
    const bw = 440 / keys.length;
    keys.forEach((k, i) => {
      const o = obs[k] || 0, e = exp(k), x = 20 + i * bw;
      s += `<rect x="${x + 8}" y="${B - o * sc}" width="${bw - 16}" height="${o * sc}" fill="${COL[k]}" style="stroke:var(--line-2)"/>`;
      s += `<line x1="${x + 4}" y1="${B - e * sc}" x2="${x + bw - 4}" y2="${B - e * sc}" style="stroke:var(--ink)" stroke-width="2" stroke-dasharray="4 3"/>`;
      s += `<text class="s" x="${x + bw / 2}" y="${B + 14}" text-anchor="middle" style="fill:var(--ink)">${k}: ${o}</text>`;
    });
    VH = B + 24;
  }
  svg.setAttribute('viewBox', `0 0 480 ${VH}`);
  svg.innerHTML = s;
  const key = g => g.split('').map(c => c === c.toUpperCase() ? 0 : 1).join(''), gk = Object.keys(gc).sort((a, b) => key(a) < key(b) ? -1 : 1);
  const pk = ORDER.filter(k => pc[k]);
  const gcs = {}; gk.forEach(k => gcs[k] = gc[k]); const pcs = {}; pk.forEach(k => pcs[k] = pc[k]);
  $('read').innerHTML = `<div><span>Gamet ♂ / ♀</span><b>${[...new Set(g1)].join(', ')} / ${[...new Set(g2)].join(', ')}</b></div>` +
    `<div><span>Genotipe</span><b>${gk.join(' : ')} = ${ratio(gcs)}</b></div>` +
    `<div><span>Fenotipe</span><b>${pk.join(' : ')} = ${ratio(pcs)}</b></div>`;
}
draw();
</script>
</body>
</html>
