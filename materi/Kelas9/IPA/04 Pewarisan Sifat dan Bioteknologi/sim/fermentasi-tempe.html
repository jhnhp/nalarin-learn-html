<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fermentasi Tempe</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:11px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 270" role="img" aria-label="Kedelai yang difermentasi menjadi tempe dan grafik pertumbuhan jamur"></svg></div>
  <div class="panel">
    <div class="lab">Suhu ruang <b id="tv">30 °C</b></div>
    <input type="range" id="T" min="15" max="45" step="1" value="30">
    <div class="lab">Ragi tempe <b id="rv">2 g/kg kedelai</b></div>
    <input type="range" id="R" min="0" max="4" step=".5" value="2">
    <label class="chk"><input type="checkbox" id="c-dry" checked> Kedelai ditiriskan sampai kering</label>
    <label class="chk"><input type="checkbox" id="c-hole" checked> Bungkus diberi lubang-lubang kecil</label>
    <label class="chk"><input type="checkbox" id="c-clean" checked> Alat dan tangan bersih</label>
    <div class="lab">Waktu <b id="hv">0 jam</b></div>
    <input type="range" id="H" min="0" max="72" step="2" value="0">
    <div class="row"><button class="btn primary" id="play">▶ Jalankan</button></div>
    <div class="read" id="read"></div>
    <p class="note">Ragi tempe berisi spora jamur <i>Rhizopus oligosporus</i>. Benang-benang jamur (miselium) menyatukan kedelai menjadi tempe yang kompak. Jamur ini memerlukan sedikit oksigen, suhu hangat, dan kedelai yang tidak terlalu basah.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const $ = id => document.getElementById(id);
const svg = $('svg');
let H = 0, timer = null;
['T', 'R', 'H'].forEach(i => $(i).oninput = () => { if(i === 'H') H = +$('H').value; draw(); });
['c-dry', 'c-hole', 'c-clean'].forEach(i => $(i).onchange = draw);
$('play').onclick = () => {
  if(timer){ clearInterval(timer); timer = null; $('play').textContent = '▶ Jalankan'; return; }
  if(H >= 72) H = 0;
  $('play').textContent = '⏸ Berhenti';
  timer = setInterval(() => { H += 2; if(H >= 72){ H = 72; clearInterval(timer); timer = null; $('play').textContent = '▶ Jalankan'; } $('H').value = H; draw(); }, 120);
};
// model sederhana
function model(t){
  const T = +$('T').value, R = +$('R').value, dry = $('c-dry').checked, hole = $('c-hole').checked, clean = $('c-clean').checked;
  let r = T < 20 || T > 42 ? 0 : Math.exp(-((T - 33) ** 2) / (2 * 4.5 ** 2)) * .2;
  if(!hole) r *= .35;
  const m0 = R ? .004 * R : 0;
  const M = m0 ? 1 / (1 + (1 / m0 - 1) * Math.exp(-r * t)) : 0;
  const rb = ((dry ? 0 : .22) + (clean ? 0 : .18) + (hole ? 0 : .08)) * (T >= 20 && T <= 45 ? 1 : .3);
  const Bk = rb ? 1 / (1 + 400 * Math.exp(-rb * t)) : 0;
  const over = M > .9 ? Math.max(0, (t - 52) / 20) : 0;
  return {M: M * (1 - .6 * Bk), B: Bk, over: Math.min(1, over), T};
}
function draw(){
  const m = model(H);
  $('tv').textContent = $('T').value + ' °C'; $('rv').textContent = $('R').value.replace('.', ',') + ' g/kg kedelai'; $('hv').textContent = H + ' jam';
  let s = '';
  // balok tempe
  const X0 = 30, Y0 = 30, W = 200, HH = 120;
  s += `<rect x="${X0 - 6}" y="${Y0 - 6}" width="${W + 12}" height="${HH + 12}" rx="10" style="fill:var(--surface-2);stroke:var(--line-2)"/>`;
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for(let i = 0; i < 70; i++){
    const x = X0 + 10 + rnd() * (W - 20), y = Y0 + 10 + rnd() * (HH - 20);
    s += `<ellipse cx="${x}" cy="${y}" rx="11" ry="9" fill="#e9c46a" stroke="#c9a03f"/>`;
  }
  if(m.B > .05) s += `<rect x="${X0}" y="${Y0}" width="${W}" height="${HH}" rx="6" fill="#a16207" fill-opacity="${Math.min(.55, m.B * .6)}"/>`;
  s += `<rect x="${X0}" y="${Y0}" width="${W}" height="${HH}" rx="6" fill="#ffffff" fill-opacity="${Math.min(.93, m.M * .95)}"/>`;
  seed = 3;
  for(let i = 0; i < Math.round(m.M * 140); i++){ const x = X0 + rnd() * W, y = Y0 + rnd() * HH, a = rnd() * 6.28; s += `<line x1="${x}" y1="${y}" x2="${x + 9 * Math.cos(a)}" y2="${y + 9 * Math.sin(a)}" stroke="#d4d4d8" stroke-width="1"/>`; }
  if(m.over > .05){ seed = 11; for(let i = 0; i < Math.round(m.over * 30); i++) s += `<circle cx="${X0 + rnd() * W}" cy="${Y0 + rnd() * HH}" r="${2 + rnd() * 3}" fill="#1f2937" fill-opacity=".7"/>`; }
  s += `<text class="s" x="${X0 + W / 2}" y="${Y0 + HH + 26}" text-anchor="middle" style="fill:var(--muted)">kedelai + ragi tempe, ${H} jam</text>`;
  // grafik
  const L = 270, R = 465, T = 30, B = 150, X = t => L + t / 72 * (R - L), Y = v => B - v * (B - T);
  s += `<rect x="${L}" y="${T}" width="${R - L}" height="${B - T}" style="fill:none;stroke:var(--line)"/>`;
  let pm = '', pb = '';
  for(let t = 0; t <= 72; t += 1){ const k = model(t); pm += (t ? 'L' : 'M') + X(t).toFixed(1) + ',' + Y(k.M).toFixed(1); pb += (t ? 'L' : 'M') + X(t).toFixed(1) + ',' + Y(k.B).toFixed(1); }
  s += `<path d="${pm}" fill="none" style="stroke:var(--a)" stroke-width="2.5"/><path d="${pb}" fill="none" style="stroke:var(--b)" stroke-width="2" stroke-dasharray="5 4"/>`;
  s += `<line x1="${X(H)}" y1="${T}" x2="${X(H)}" y2="${B}" style="stroke:var(--ink)" stroke-dasharray="3 3"/>`;
  [0, 24, 48, 72].forEach(t => s += `<text class="s" x="${X(t)}" y="${B + 14}" text-anchor="middle" style="fill:var(--muted)">${t}</text>`);
  s += `<text class="s" x="${R}" y="${B + 28}" text-anchor="end" style="fill:var(--muted)">jam</text><text class="s" x="${L}" y="${T - 16}" style="fill:var(--a)">— miselium jamur</text><text class="s" x="${L}" y="${T - 4}" style="fill:var(--b)">- - bakteri pembusuk</text>`;
  // hasil
  let res, ok = false;
  if(H < 12) res = 'kedelai masih terpisah-pisah';
  else if(m.B > .5 && m.M < .8) res = 'gagal: berlendir dan berbau (bakteri lebih cepat tumbuh)';
  else if(m.M < .15) res = H > 30 ? 'gagal: jamur tidak tumbuh' : 'jamur belum tampak';
  else if(m.M < .85) res = 'miselium mulai menyelimuti kedelai';
  else if(m.over > .3) res = 'terlalu matang: berbintik hitam (spora) dan berbau amonia';
  else { res = 'tempe jadi: putih, padat, dan kompak'; ok = true; }
  const why = [];
  if(+$('T').value < 20) why.push('suhu terlalu dingin'); if(+$('T').value > 42) why.push('suhu terlalu panas, jamur mati');
  if(+$('R').value === 0) why.push('tidak ada ragi');
  if(!$('c-hole').checked) why.push('oksigen kurang');
  if(!$('c-dry').checked) why.push('kedelai terlalu basah');
  if(!$('c-clean').checked) why.push('alat kotor (kontaminasi)');
  s += `<rect x="270" y="190" width="195" height="${why.length ? 40 + why.length * 16 : 40}" rx="10" style="fill:${ok ? 'var(--ok)' : 'var(--surface-2)'}" fill-opacity="${ok ? .15 : 1}"/>`;
  s += `<text class="c" x="282" y="214" style="fill:var(--ink)">Faktor penghambat:</text>`;
  (why.length ? why : ['tidak ada']).forEach((w, i) => s += `<text class="s" x="282" y="${232 + i * 16}" style="fill:${why.length ? 'var(--bad)' : 'var(--ok)'}">• ${w}</text>`);
  svg.innerHTML = s;
  $('read').innerHTML = `<div><span>Tutupan miselium</span><b>${Math.round(m.M * 100)}%</b></div><div><span>Hasil</span><b>${res}</b></div>`;
}
draw();
</script>
</body>
</html>
