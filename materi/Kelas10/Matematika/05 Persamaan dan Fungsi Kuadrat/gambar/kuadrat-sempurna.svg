<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<rect x="40" y="40" width="136" height="136" fill="#2447f9" fill-opacity=".2" stroke="#2447f9" stroke-width="2"/><text x="108.0" y="114.0" text-anchor="middle" class="t" style="fill:#2447f9">x²</text><rect x="176" y="40" width="102" height="136" fill="#d98200" fill-opacity=".2" stroke="#d98200" stroke-width="2"/><text x="227.0" y="114.0" text-anchor="middle" class="t" style="fill:#d98200">3x</text><rect x="40" y="176" width="136" height="102" fill="#d98200" fill-opacity=".2" stroke="#d98200" stroke-width="2"/><text x="108.0" y="233.0" text-anchor="middle" class="t" style="fill:#d98200">3x</text><rect x="176" y="176" width="102" height="102" fill="#0b9a6a" fill-opacity=".25" stroke="#0b9a6a" stroke-width="2" stroke-dasharray="6 4"/><text x="227.0" y="233.0" text-anchor="middle" class="t" style="fill:#0b9a6a">9</text><text x="108.0" y="30.0" text-anchor="middle" class="b">x</text><text x="227.0" y="30.0" text-anchor="middle" class="b">3</text><text x="28.0" y="113.0" text-anchor="middle" class="b">x</text><text x="28.0" y="232.0" text-anchor="middle" class="b">3</text><text x="330.0" y="80.0" text-anchor="start" class="t">x² + 6x + 9 = (x + 3)²</text><text x="330.0" y="110.0" text-anchor="start" class="m">Persegi x² dan dua persegi panjang 3x</text><text x="330.0" y="130.0" text-anchor="start" class="m">membutuhkan potongan 3 × 3 = 9</text><text x="330.0" y="150.0" text-anchor="start" class="m">agar menjadi persegi utuh.</text><text x="330.0" y="190.0" text-anchor="start" class="m">Bilangan yang ditambahkan:</text><text x="330.0" y="214.0" text-anchor="start" class="b">(½ × koefisien x)² = (6/2)² = 9</text></svg>
