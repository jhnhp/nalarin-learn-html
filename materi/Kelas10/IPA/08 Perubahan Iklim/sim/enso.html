<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Nino dan La Nina</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:11px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 300" role="img" aria-label="Penampang Samudra Pasifik tropis: angin, kolam air hangat, dan awan hujan"></svg></div>
  <div class="panel">
    <div class="seg" id="ph"><button data-v="-1">La Nina</button><button class="on" data-v="0">Netral</button><button data-v="1">El Nino</button></div>
    <div class="read" id="read"></div>
    <p class="note">ENSO (El Nino–Southern Oscillation) adalah perubahan suhu permukaan laut Pasifik tropis bagian tengah–timur yang mengubah pola angin dan hujan. Awan hujan terbentuk di atas kolam air laut yang hangat.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
let ph = 0, cur = 0, t = 0;
document.querySelectorAll('#ph button').forEach(b => b.onclick = () => { document.querySelectorAll('#ph button').forEach(x => x.classList.toggle('on', x === b)); ph = +b.dataset.v; });
function cloud(x, y, k){ return `<g opacity="${k}"><circle cx="${x}" cy="${y}" r="14" fill="#94a3b8"/><circle cx="${x + 16}" cy="${y - 6}" r="17" fill="#94a3b8"/><circle cx="${x + 34}" cy="${y}" r="13" fill="#94a3b8"/>${[0, 1, 2, 3].map(i => `<line x1="${x + 2 + i * 10}" y1="${y + 16 + (t * 40 + i * 7) % 18}" x2="${x - 2 + i * 10}" y2="${y + 24 + (t * 40 + i * 7) % 18}" stroke="#3b82f6" stroke-width="2"/>`).join('')}</g>`; }
function draw(){
  cur += (ph - cur) * .08; t += .03;
  const sea = 150, W = 480;
  // posisi pusat kolam hangat: netral di barat (Indonesia), El Nino bergeser ke tengah-timur
  const warm = 110 + 170 * (cur + .3) , wwid = 170 + 40 * Math.max(0, -cur);
  let s = `<rect x="0" y="0" width="${W}" height="${sea}" style="fill:var(--surface)"/>`;
  // laut dengan gradasi suhu
  for(let x = 0; x < W; x += 8){
    const d = Math.exp(-((x - Math.min(Math.max(warm, 60), 420)) ** 2) / (2 * wwid * wwid / 4));
    const r = Math.round(60 + 190 * d), g = Math.round(120 + 40 * d), b = Math.round(220 - 160 * d);
    s += `<rect x="${x}" y="${sea}" width="9" height="40" fill="rgb(${r},${g},${b})"/>`;
  }
  s += `<rect x="0" y="${sea + 40}" width="${W}" height="70" fill="#1e3a8a" fill-opacity=".85"/>`;
  // termoklin
  let p = ''; for(let x = 0; x <= W; x += 10){ const y = Math.min(sea + 104, Math.max(sea + 44, sea + 70 - (x / W - .5) * 50 * (1 - cur * 1.2))); p += (x ? 'L' : 'M') + x + ',' + y.toFixed(1); }
  s += `<path d="${p}" fill="none" stroke="#fff" stroke-dasharray="5 4" stroke-width="1.5"/><text class="s" x="${W - 6}" y="${sea + 102}" text-anchor="end" fill="#fff">termoklin (batas air hangat–dingin)</text>`;
  // daratan
  s += `<path d="M0,${sea} L0,${sea - 26} Q30,${sea - 40} 60,${sea - 22} L70,${sea} Z" fill="#65a30d"/><text class="c" x="8" y="${sea - 44}" style="fill:var(--ink)">Indonesia</text>`;
  s += `<path d="M${W},${sea} L${W},${sea - 50} Q${W - 30},${sea - 60} ${W - 48},${sea - 20} L${W - 56},${sea} Z" fill="#a16207"/><text class="c" x="${W - 6}" y="${sea - 66}" text-anchor="end" style="fill:var(--ink)">Amerika Selatan</text>`;
  // awan hujan di atas kolam hangat
  s += cloud(Math.min(Math.max(warm, 70), 400) - 20, 60, 1) ;
  if(cur < -.3) s += cloud(110, 50, Math.min(1, -cur));
  // angin pasat
  const strength = 1 - cur, dir = cur > .5 ? 1 : -1;
  for(let i = 0; i < 4; i++){
    const y = 118, x0 = 100 + i * 80, len = 40 * Math.min(1.6, Math.max(.6, Math.abs(strength) + .2));
    const x1 = dir < 0 ? x0 + len : x0, x2 = dir < 0 ? x0 : x0 + len;
    s += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" style="stroke:var(--ink)" stroke-width="2.5"/><path d="M${x2},${y} l${dir < 0 ? 8 : -8},-5 l0,10z" style="fill:var(--ink)"/>`;
  }
  s += `<text class="s" x="240" y="140" text-anchor="middle" style="fill:var(--ink)">${cur > .5 ? 'angin pasat melemah/berbalik ke timur' : cur < -.5 ? 'angin pasat timur menguat' : 'angin pasat bertiup dari timur ke barat'}</text>`;
  s += `<text class="s" x="240" y="${sea + 32}" text-anchor="middle" fill="#fff">permukaan laut (merah = hangat, biru = dingin)</text>`;
  svg.innerHTML = s;
  const rain = Math.round(100 - 45 * cur);
  const txt = ph === 1 ? ['El Nino', 'air hangat bergeser ke Pasifik tengah–timur; perairan Indonesia relatif lebih dingin', 'curah hujan berkurang → kemarau panjang, kekeringan, kebakaran hutan dan lahan gambut'] : ph === -1 ? ['La Nina', 'air hangat menumpuk di Pasifik barat dekat Indonesia', 'curah hujan meningkat → kemarau basah, banjir, longsor, tanaman membusuk'] : ['Netral', 'kolam air hangat di Pasifik barat', 'curah hujan normal'];
  $('read').innerHTML = `<div><span>Fase</span><b>${txt[0]}</b></div><div><span>Laut</span><b>${txt[1]}</b></div><div><span>Dampak di Indonesia</span><b>${txt[2]}</b></div><div><span>Curah hujan Indonesia (gambaran kasar)</span><b>± ${ph === 0 ? 100 : ph > 0 ? 60 : 140}% dari normal</b></div>`;
}
setInterval(draw, 50);
</script>
</body>
</html>
