<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energi Kelapa Jatuh</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:11px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 300" role="img" aria-label="Kelapa jatuh dengan diagram energi potensial dan energi kinetik"></svg></div>
  <div class="panel">
    <div class="lab">Massa kelapa <b id="mv"></b></div><input type="range" id="m" min="0.5" max="3" step="0.1" value="1.5">
    <div class="lab">Tinggi awal h₀ <b id="hv"></b></div><input type="range" id="h0" min="4" max="20" step="1" value="12">
    <div class="row"><button class="btn primary" id="go">▶ Jatuhkan</button><button class="btn" id="reset">Ulang</button></div>
    <div class="read" id="read"></div>
    <p class="note">Ep = m·g·h dan Ek = ½·m·v², dengan g = 10 m/s². Tanpa gesekan udara, Ep + Ek tetap. Ek bertambah <b>linear</b> ketika ketinggian berkurang: Ek = m·g·(h₀ − h).</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
let t = 0, timer = null;
['m', 'h0'].forEach(i => $(i).oninput = () => { reset(); });
$('go').onclick = () => { if(timer) return; timer = setInterval(() => { t += .02; const h0 = +$('h0').value; if(h0 - 5 * t * t <= 0){ t = Math.sqrt(h0 / 5); clearInterval(timer); timer = null; } draw(); }, 30); };
$('reset').onclick = reset;
function reset(){ if(timer){ clearInterval(timer); timer = null; } t = 0; draw(); }
function draw(){
  const m = +$('m').value, h0 = +$('h0').value, h = Math.max(0, h0 - 5 * t * t), v = 10 * t;
  const Ep = m * 10 * h, Ek = m * 10 * (h0 - h), Em = m * 10 * h0;
  const G = 270, Y = y => G - y / 20 * 240;
  let s = `<line x1="20" y1="${G}" x2="200" y2="${G}" style="stroke:var(--ink)" stroke-width="2"/>`;
  // pohon
  s += `<path d="M60,${G} Q66,${Y(h0) + 40} 56,${Y(h0)}" fill="none" stroke="#92400e" stroke-width="8"/>`;
  for(let i = 0; i < 5; i++){ const a = -2.6 + i * .5; s += `<path d="M56,${Y(h0)} q${30 * Math.cos(a)},${30 * Math.sin(a) - 10} ${60 * Math.cos(a)},${40 * Math.sin(a) + 10}" fill="none" stroke="#16a34a" stroke-width="4"/>`; }
  s += `<circle cx="80" cy="${Y(h) - 9}" r="9" fill="#65a30d" stroke="#3f6212"/>`;
  [0, 5, 10, 15, 20].forEach(y => s += `<line x1="150" y1="${Y(y)}" x2="156" y2="${Y(y)}" style="stroke:var(--muted)"/><text class="s" x="160" y="${Y(y) + 4}" style="fill:var(--muted)">${y} m</text>`);
  // batang energi
  const B = 270, H = 220, sc = H / (2 * 3 * 10 * 20) * 2;
  const bar = (x, val, col, lab) => `<rect x="${x}" y="${B - val / Em * 200}" width="36" height="${val / Em * 200}" style="fill:${col}"/><text class="s" x="${x + 18}" y="${B + 14}" text-anchor="middle" style="fill:var(--ink)">${lab}</text><text class="s" x="${x + 18}" y="${B - val / Em * 200 - 5}" text-anchor="middle" style="fill:var(--ink)">${fmt(val, 0)} J</text>`;
  s += bar(215, Ep, 'var(--a)', 'Ep') + bar(258, Ek, 'var(--b)', 'Ek') + bar(301, Em, 'var(--ok)', 'Em');
  // grafik Ek terhadap h
  const L = 360, R = 470, T = 60, BB = 240;
  const X = hh => L + hh / h0 * (R - L), YY = e => BB - e / Em * (BB - T);
  s += `<line x1="${L}" y1="${BB}" x2="${R}" y2="${BB}" style="stroke:var(--ink)"/><line x1="${L}" y1="${BB}" x2="${L}" y2="${T - 6}" style="stroke:var(--ink)"/>`;
  s += `<line x1="${X(0)}" y1="${YY(Em)}" x2="${X(h0)}" y2="${YY(0)}" style="stroke:var(--b)" stroke-width="2.5"/><circle cx="${X(h)}" cy="${YY(Ek)}" r="5" style="fill:var(--b)"/>`;
  s += `<text class="s" x="${L}" y="${T - 12}" style="fill:var(--b)">Ek</text><text class="s" x="${R}" y="${BB + 28}" text-anchor="end" style="fill:var(--muted)">ketinggian h</text><text class="s" x="${X(h0)}" y="${BB + 14}" text-anchor="middle" style="fill:var(--muted)">h₀</text><text class="s" x="${L}" y="${BB + 14}" text-anchor="middle" style="fill:var(--muted)">0</text>`;
  svg.innerHTML = s;
  $('mv').textContent = fmt(m, 1) + ' kg'; $('hv').textContent = h0 + ' m';
  $('read').innerHTML = `<div><span>Ketinggian</span><b>${fmt(h, 2)} m</b></div><div><span>Kecepatan</span><b>${fmt(v, 2)} m/s</b></div><div><span>Ep + Ek</span><b>${fmt(Ep, 0)} + ${fmt(Ek, 0)} = ${fmt(Ep + Ek, 0)} J</b></div>`;
}
draw();
</script>
</body>
</html>
