<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sifat Keperiodikan Unsur</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10px}#svg{touch-action:none}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 330" role="img" aria-label="Grafik sifat periodik terhadap nomor atom"></svg></div>
  <div class="panel">
    <div class="seg" id="prop"><button class="on" data-v="r">Jari-jari atom</button><button data-v="ie">Energi ionisasi</button><button data-v="en">Keelektronegatifan</button></div>
    <div class="seg" id="hl"><button class="on" data-v="none">Semua</button><button data-v="g1">Golongan IA</button><button data-v="g7">Golongan VIIA</button><button data-v="p3">Periode 3</button></div>
    <div class="read" id="read"></div>
    <p class="note" id="trend"></p>
    <p class="note">Ketuk/geser pada grafik untuk memilih unsur. Data: jari-jari kovalen (pm), energi ionisasi pertama (kJ/mol), dan keelektronegatifan skala Pauling (gas mulia tidak diberi nilai).</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const SYM = 'H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr'.split(' ');
const D = {
  r: [31,28,128,96,84,76,71,66,57,58,166,141,121,111,107,105,102,106,203,176,170,160,153,139,139,132,126,124,132,122,122,120,119,120,120,116],
  ie: [1312,2372,520,899,801,1086,1402,1314,1681,2081,496,738,578,787,1012,1000,1251,1521,419,590,633,659,651,653,717,762,760,737,746,906,579,762,947,941,1140,1351],
  en: [2.20,null,0.98,1.57,2.04,2.55,3.04,3.44,3.98,null,0.93,1.31,1.61,1.90,2.19,2.58,3.16,null,0.82,1.00,1.36,1.54,1.63,1.66,1.55,1.83,1.88,1.91,1.90,1.65,1.81,2.01,2.18,2.55,2.96,3.00]
};
const INFO = {r: ['Jari-jari atom', 'pm', 'makin ke bawah dalam satu golongan makin besar (kulit bertambah); makin ke kanan dalam satu periode makin kecil (muatan inti bertambah, tarikan ke elektron makin kuat)'],
  ie: ['Energi ionisasi pertama', 'kJ/mol', 'energi untuk melepas satu elektron terluar dari atom gas. Makin ke bawah makin kecil; makin ke kanan umumnya makin besar. Puncaknya pada gas mulia.'],
  en: ['Keelektronegatifan', 'skala Pauling', 'kemampuan atom menarik elektron ikatan. Makin ke bawah makin kecil; makin ke kanan makin besar. Fluorin paling elektronegatif.']};
const GROUP = {g1: [1, 3, 11, 19], g7: [9, 17, 35], p3: [11, 12, 13, 14, 15, 16, 17, 18]};
let prop = 'r', hl = 'none', sel = 11;
document.querySelectorAll('#prop button').forEach(b => b.onclick = () => { document.querySelectorAll('#prop button').forEach(x => x.classList.toggle('on', x === b)); prop = b.dataset.v; draw(); });
document.querySelectorAll('#hl button').forEach(b => b.onclick = () => { document.querySelectorAll('#hl button').forEach(x => x.classList.toggle('on', x === b)); hl = b.dataset.v; draw(); });
const L = 46, R = 470, T = 34, B = 290, X = z => L + (z - .5) / 36 * (R - L);
function pick(e){ const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 480; sel = Math.max(1, Math.min(36, Math.round((x - L) / (R - L) * 36 + .5))); draw(); }
let down = false;
svg.addEventListener('pointerdown', e => { down = true; svg.setPointerCapture(e.pointerId); pick(e); });
svg.addEventListener('pointermove', e => { if(down) pick(e); });
svg.addEventListener('pointerup', () => down = false);
function draw(){
  const d = D[prop], max = prop === 'r' ? 220 : prop === 'ie' ? 2500 : 4, Y = v => B - v / max * (B - T);
  let s = '';
  for(let i = 0; i <= 4; i++){ const v = max * i / 4; s += `<line x1="${L}" y1="${Y(v)}" x2="${R}" y2="${Y(v)}" style="stroke:var(--line)"/><text class="s" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" style="fill:var(--muted)">${fmt(v, 1)}</text>`; }
  [2.5, 10.5, 18.5].forEach(z => s += `<line x1="${X(z + .5) - (R - L) / 72}" y1="${T}" x2="${X(z + .5) - (R - L) / 72}" y2="${B}" style="stroke:var(--line-2)" stroke-dasharray="3 3"/>`);
  [['periode 1', 1.5], ['periode 2', 6.5], ['periode 3', 14.5], ['periode 4', 27.5]].forEach(([t, z]) => s += `<text class="s" x="${X(z)}" y="${B - 6}" text-anchor="middle" style="fill:var(--muted)">${t}</text>`);
  let p = '';
  d.forEach((v, i) => { if(v === null){ return; } p += (p && d[i - 1] !== null ? 'L' : 'M') + X(i + 1).toFixed(1) + ',' + Y(v).toFixed(1); });
  s += `<path d="${p}" fill="none" style="stroke:var(--a)" stroke-width="2" stroke-opacity="${hl === 'none' ? 1 : .35}"/>`;
  d.forEach((v, i) => {
    if(v === null) return;
    const z = i + 1, on = hl !== 'none' && GROUP[hl].includes(z);
    s += `<circle cx="${X(z)}" cy="${Y(v)}" r="${on || z === sel ? 5 : 3}" style="fill:${on ? 'var(--b)' : z === sel ? 'var(--comp)' : 'var(--a)'}"/>`;
    if(on || [2, 10, 18, 36, 3, 11, 19, 9].includes(z)) s += `<text class="s" x="${X(z)}" y="${Y(v) - 8}" text-anchor="middle" style="fill:${on ? 'var(--b)' : 'var(--ink)'}">${SYM[i]}</text>`;
  });
  if(hl !== 'none'){ const g = GROUP[hl].filter(z => d[z - 1] !== null); for(let i = 1; i < g.length; i++) s += `<line x1="${X(g[i - 1])}" y1="${Y(d[g[i - 1] - 1])}" x2="${X(g[i])}" y2="${Y(d[g[i] - 1])}" style="stroke:var(--b)" stroke-width="2" stroke-dasharray="5 3"/>`; }
  s += `<line x1="${X(sel)}" y1="${T}" x2="${X(sel)}" y2="${B}" style="stroke:var(--comp)" stroke-dasharray="2 3"/>`;
  s += `<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" style="stroke:var(--ink)"/>`;
  [1, 5, 10, 15, 20, 25, 30, 36].forEach(z => s += `<text class="s" x="${X(z)}" y="${B + 14}" text-anchor="middle" style="fill:var(--muted)">${z}</text>`);
  s += `<text class="s" x="${R}" y="${B + 28}" text-anchor="end" style="fill:var(--muted)">nomor atom</text><text class="c" x="${L}" y="12" style="fill:var(--a)">${INFO[prop][0]} (${INFO[prop][1]})</text>`;
  svg.innerHTML = s;
  const v = d[sel - 1];
  $('read').innerHTML = `<div><span>Unsur terpilih</span><b>${SYM[sel - 1]} (Z = ${sel})</b></div><div><span>${INFO[prop][0]}</span><b>${v === null ? 'tidak ditentukan' : fmt(v, 2) + ' ' + INFO[prop][1]}</b></div>`;
  $('trend').innerHTML = '<b>Kecenderungan:</b> ' + INFO[prop][2];
}
draw();
</script>
</body>
</html>
