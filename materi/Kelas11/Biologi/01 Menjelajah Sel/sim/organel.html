<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Organel Sel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.s{font-family:var(--display);font-weight:700;font-size:11px}
.o{cursor:pointer}.o:hover{filter:brightness(1.15)}.o.sel *{stroke:var(--b)!important;stroke-width:3!important}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 340" role="img" aria-label="Diagram sel dengan organel yang dapat diklik"></svg></div>
  <div class="panel">
    <div class="seg" id="mode"><button data-m="hewan" class="on">Sel hewan</button><button data-m="tumbuhan">Sel tumbuhan</button><button data-m="prokariot">Sel prokariot</button></div>
    <p class="note">Klik bagian sel untuk melihat nama, fungsi, dan keberadaannya pada jenis sel lain.</p>
    <div class="read" id="read"></div>
    <p class="note" id="fungsi" style="color:var(--ink)"></p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const $ = id => document.getElementById(id);
const svg = $('svg');
// keberadaan: [prokariot, tumbuhan, hewan]
const INFO = {
  membran: ['Membran plasma', 'Lapisan ganda fosfolipid dengan protein (model mosaik cair). Mengatur keluar-masuk zat dan komunikasi antarsel.', [1, 1, 1]],
  dinding: ['Dinding sel', 'Lapisan kaku di luar membran (selulosa pada tumbuhan, peptidoglikan pada bakteri). Melindungi dan memberi bentuk sel.', [1, 1, 0]],
  inti: ['Inti sel (nukleus)', 'Berisi DNA yang dibungkus membran inti berpori. Mengendalikan seluruh aktivitas sel.', [0, 1, 1]],
  nukleolus: ['Nukleolus (anak inti)', 'Bagian padat di dalam inti tempat RNA ribosom dibuat dan subunit ribosom dirakit.', [0, 1, 1]],
  re: ['Retikulum endoplasma', 'Jaringan membran. RE kasar (ditempeli ribosom) membuat protein untuk dikirim; RE halus membuat lipid dan menetralkan racun.', [0, 1, 1]],
  ribosom: ['Ribosom', 'Butiran kecil tanpa membran, tempat sintesis protein. Dimiliki semua sel.', [1, 1, 1]],
  golgi: ['Badan Golgi', 'Tumpukan kantong pipih. Memodifikasi, mengemas, dan mengirim protein serta lipid; membentuk lisosom dan dinding sel baru.', [0, 1, 1]],
  mito: ['Mitokondria', 'Bermembran ganda dengan krista. Tempat respirasi aerob yang menghasilkan ATP. Jumlahnya banyak pada sel yang aktif, seperti otot jantung.', [0, 1, 1]],
  lisosom: ['Lisosom', 'Kantong berisi enzim pencerna. Menguraikan organel tua atau rusak dan benda asing. Pada tumbuhan fungsi ini banyak dilakukan vakuola.', [0, 1, 1]],
  sentriol: ['Sentriol', 'Sepasang silinder mikrotubul. Membentuk benang gelendong saat pembelahan sel hewan. Umumnya tidak ada pada tumbuhan tingkat tinggi.', [0, 0, 1]],
  vakuola: ['Vakuola', 'Kantong berisi cairan sel. Pada tumbuhan berukuran besar: menyimpan air, zat makanan, pigmen, dan sisa metabolisme serta menjaga tekanan turgor. Pada hewan kecil atau tidak ada.', [0, 1, 1]],
  kloroplas: ['Kloroplas', 'Plastida hijau berisi klorofil, tempat fotosintesis.', [0, 1, 0]],
  nukleoid: ['Nukleoid', 'Daerah tempat DNA melingkar pada prokariot. Tidak diselubungi membran inti.', [1, 0, 0]],
  plasmid: ['Plasmid', 'DNA melingkar kecil di luar nukleoid, sering membawa gen tahan antibiotik.', [1, 0, 0]],
  flagel: ['Flagel', 'Alat gerak berbentuk cambuk.', [1, 0, 1]],
  kapsul: ['Kapsul', 'Lapisan lendir di luar dinding sel bakteri; melindungi dari kekeringan dan sel darah putih.', [1, 0, 0]],
  sitoplasma: ['Sitoplasma', 'Seluruh isi sel di antara membran plasma dan inti: sitosol (cairan) dan organel. Sebagian besar aktivitas sel terjadi di sini.', [1, 1, 1]]
};
let M = 'hewan', S = 'mito';
$('mode').querySelectorAll('button').forEach(b => b.onclick = () => { $('mode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); M = b.dataset.m; if(!INFO[S][2][['prokariot', 'tumbuhan', 'hewan'].indexOf(M)]) S = 'sitoplasma'; draw(); });
const g = (id, body) => `<g class="o${S === id ? ' sel' : ''}" data-id="${id}">${body}</g>`;
function mito(x, y, a){ return `<g transform="rotate(${a} ${x} ${y})"><ellipse cx="${x}" cy="${y}" rx="22" ry="11" fill="#f2a65a" stroke="#a5591a" stroke-width="1.5"/><path d="M${x - 15},${y} q4,-8 8,0 q4,8 8,0 q4,-8 8,0 q4,8 8,0" fill="none" stroke="#a5591a" stroke-width="1.3"/></g>`; }
function draw(){
  let s = '';
  if(M === 'prokariot'){
    s += g('kapsul', `<rect x="70" y="95" width="340" height="150" rx="75" fill="#efe4c6" stroke="#b9a46a" stroke-width="2"/>`);
    s += g('dinding', `<rect x="82" y="107" width="316" height="126" rx="63" fill="#d9e8c4" stroke="#6b8f3a" stroke-width="3"/>`);
    s += g('membran', `<rect x="92" y="117" width="296" height="106" rx="53" fill="none" stroke="#3b6fb6" stroke-width="3"/>`);
    s += g('sitoplasma', `<rect x="96" y="121" width="288" height="98" rx="49" fill="#eef4fb"/>`);
    s += g('nukleoid', `<path d="M190,170 q20,-40 50,-10 q30,30 60,-5 q20,-20 10,20 q-20,30 -60,10 q-30,-15 -50,10 q-25,15 -10,-25z" fill="none" stroke="#7a3fb0" stroke-width="2.5"/>`);
    s += g('plasmid', `<circle cx="140" cy="150" r="11" fill="none" stroke="#7a3fb0" stroke-width="2"/><circle cx="345" cy="195" r="9" fill="none" stroke="#7a3fb0" stroke-width="2"/>`);
    let rb = ''; for(let k = 0; k < 30; k++){ const x = 120 + (k * 37) % 250, y = 135 + (k * 23) % 75; rb += `<circle cx="${x}" cy="${y}" r="2.6" fill="#333"/>`; } s += g('ribosom', rb);
    s += g('flagel', `<path d="M410,170 q20,-20 35,0 q15,20 30,0" fill="none" stroke="#555" stroke-width="3"/>`);
  } else {
    const plant = M === 'tumbuhan';
    if(plant){ s += g('dinding', `<rect x="40" y="30" width="400" height="280" rx="10" fill="#d9e8c4" stroke="#6b8f3a" stroke-width="4"/>`); s += g('membran', `<rect x="52" y="42" width="376" height="256" rx="8" fill="none" stroke="#3b6fb6" stroke-width="3"/>`); s += g('sitoplasma', `<rect x="55" y="45" width="370" height="250" rx="7" fill="#eef4fb"/>`); s += g('vakuola', `<rect x="210" y="70" width="190" height="200" rx="40" fill="#cfe6f7" stroke="#5b8fc0" stroke-width="2"/>`); }
    else { s += g('membran', `<ellipse cx="240" cy="170" rx="215" ry="145" fill="none" stroke="#3b6fb6" stroke-width="3"/>`); s += g('sitoplasma', `<ellipse cx="240" cy="170" rx="212" ry="142" fill="#eef4fb"/>`); s += g('vakuola', `<circle cx="345" cy="245" r="14" fill="#cfe6f7" stroke="#5b8fc0" stroke-width="1.5"/>`); }
    const nx = plant ? 130 : 220, ny = plant ? 140 : 160;
    s += g('re', `<path d="M${nx + 50},${ny - 40} q20,10 0,20 q-20,10 0,20 q20,10 0,20 q-20,10 0,20" fill="none" stroke="#c0569b" stroke-width="5"/>` + [0, 1, 2, 3, 4, 5].map(k => `<circle cx="${nx + 58 + (k % 2) * -16}" cy="${ny - 36 + k * 13}" r="2.2" fill="#333"/>`).join(''));
    s += g('inti', `<circle cx="${nx}" cy="${ny}" r="42" fill="#d8c6ef" stroke="#6a3fa0" stroke-width="3" stroke-dasharray="10 3"/>`);
    s += g('nukleolus', `<circle cx="${nx + 8}" cy="${ny + 5}" r="13" fill="#6a3fa0"/>`);
    const gx = plant ? 110 : 120, gy = plant ? 240 : 250;
    s += g('golgi', [0, 1, 2, 3].map(k => `<path d="M${gx - 30 + k * 2},${gy + k * 9} q30,-14 60,0" fill="none" stroke="#2f8f6f" stroke-width="5" stroke-linecap="round"/>`).join(''));
    s += g('mito', plant ? mito(190, 275, 10) + mito(95, 85, -20) : mito(350, 110, 20) + mito(110, 150, -30) + mito(300, 270, 5));
    s += g('lisosom', plant ? `<circle cx="180" cy="80" r="8" fill="#e6c229" stroke="#9a7f0a" stroke-width="1.5"/>` : `<circle cx="390" cy="185" r="10" fill="#e6c229" stroke="#9a7f0a" stroke-width="1.5"/><circle cx="175" cy="260" r="8" fill="#e6c229" stroke="#9a7f0a" stroke-width="1.5"/>`);
    let rb = ''; for(let k = 0; k < 24; k++){ const x = (plant ? 70 : 90) + (k * 41) % (plant ? 130 : 300), y = (plant ? 200 : 70) + (k * 29) % (plant ? 30 : 60); rb += `<circle cx="${x}" cy="${y}" r="2.4" fill="#333"/>`; } s += g('ribosom', rb);
    if(plant) s += g('kloroplas', [[250, 55], [415, 160], [190, 205], [300, 285]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="20" ry="10" fill="#4caf50" stroke="#2e6b31" stroke-width="1.5"/><line x1="${x - 12}" y1="${y}" x2="${x + 12}" y2="${y}" stroke="#2e6b31" stroke-width="2"/>`).join(''));
    else s += g('sentriol', `<rect x="380" y="235" width="22" height="8" fill="#8d6e63" transform="rotate(20 391 239)"/><rect x="392" y="242" width="8" height="22" fill="#8d6e63"/>`);
  }
  svg.innerHTML = s;
  svg.querySelectorAll('.o').forEach(el => el.onclick = e => { e.stopPropagation(); S = el.dataset.id; draw(); });
  const I = INFO[S], ada = v => v ? '✓ ada' : '— tidak ada / umumnya tidak ada';
  $('read').innerHTML = `<div><span>Bagian terpilih</span><b>${I[0]}</b></div><div><span>Sel prokariot</span><b>${ada(I[2][0])}</b></div><div><span>Sel tumbuhan</span><b>${ada(I[2][1])}</b></div><div><span>Sel hewan</span><b>${ada(I[2][2])}</b></div>`;
  $('fungsi').textContent = I[1];
}
draw();
</script>
</body>
</html>
