<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pertukaran Gas di Alveolus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 340" role="img" aria-label="Alveolus dan kapiler, grafik tekanan oksigen sepanjang kapiler, dan kurva saturasi hemoglobin"></svg></div>
  <div class="panel">
    <div class="lab">Ketinggian tempat <b id="av"></b></div><input type="range" id="alt" min="0" max="5000" step="250" value="0">
    <div class="lab">Kadar hemoglobin <b id="hv"></b></div><input type="range" id="hb" min="6" max="17" step="0.5" value="14">
    <div class="lab">Ketebalan dinding alveolus–kapiler <b id="tv"></b></div><input type="range" id="th" min="1" max="5" step="0.5" value="1">
    <div class="lab">Luas permukaan alveolus <b id="sv"></b></div><input type="range" id="ar" min="30" max="100" step="5" value="100">
    <label class="chk"><input type="checkbox" id="ex"> Sedang berolahraga</label>
    <div class="read" id="read"></div>
    <p class="note" id="ket" style="color:var(--ink)"></p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const sat = (p, p50) => p ** 2.7 / (p ** 2.7 + p50 ** 2.7);
let tick = 0;
function model(){
  const alt = +$('alt').value, hb = +$('hb').value, th = +$('th').value, ar = +$('ar').value / 100, ex = $('ex').checked;
  const patm = 760 * Math.exp(-alt / 8000), pco2 = 40 - alt / 500, PA = Math.max(20, (patm - 47) * 0.21 - pco2 / 0.8);
  const Pv = Math.round(Math.min(ex ? 25 : 40, PA * 0.6)), flow = ex ? 2.6 : 1, k = 6 * ar / th / flow;
  const P = x => PA - (PA - Pv) * Math.exp(-k * x);
  const Pa = P(1), Sa = sat(Pa, 26.8), Sv = sat(Pv, ex ? 31 : 26.8);
  const CaO2 = 1.34 * hb * Sa, CvO2 = 1.34 * hb * Sv;
  return {alt, hb, th, ar, ex, patm, PA, Pv, P, Pa, Sa, Sv, CaO2, CvO2, flow};
}
function draw(){
  tick++;
  const m = model();
  $('av').textContent = m.alt + ' m'; $('hv').textContent = m.hb + ' g/dL'; $('tv').textContent = m.th === 1 ? 'normal' : '× ' + fmt(m.th, 1); $('sv').textContent = Math.round(m.ar * 100) + '%';
  let s = '';
  // diagram alveolus dan kapiler
  s += `<rect x="20" y="20" width="440" height="56" rx="26" fill="#e3f2fd" stroke="#64b5f6" stroke-width="${1 + m.th}"/><text class="s" x="34" y="40" style="fill:var(--ink)">udara alveolus: PO₂ = ${fmt(m.PA, 0)} mmHg</text>`;
  s += `<rect x="20" y="84" width="440" height="36" rx="18" fill="#ffcdd2" stroke="#e57373" stroke-width="2"/><text class="s" x="34" y="106" style="fill:var(--ink)">kapiler: darah masuk PO₂ ${m.Pv} → keluar ${fmt(m.Pa, 0)} mmHg</text>`;
  const nArrow = Math.round(Math.min(8, 1 + 14 * (m.PA - m.Pv) / 100 * m.ar / m.th));
  for(let i = 0; i < nArrow; i++){ const x = 300 + i * 18, y = 54 + ((tick * 2 + i * 9) % 30); s += `<text class="s" x="${x}" y="${y}" fill="#1565c0">O₂</text>`; }
  for(let i = 0; i < 3; i++){ const x = 230 + i * 20, y = 110 - ((tick * 2 + i * 11) % 40); s += `<text class="s" x="${x}" y="${y}" fill="#6d4c41">CO₂</text>`; }
  s += `<path d="M30,128 h420" stroke="#e57373" stroke-width="2" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#e57373"/></marker></defs><text class="s" x="450" y="142" text-anchor="end" style="fill:var(--muted)">arah aliran darah</text>`;
  // grafik PO2 sepanjang kapiler
  const gx = 40, gy = 320, gw = 180, gh = 140;
  s += `<text class="s" x="${gx}" y="${gy - gh - 8}" style="fill:var(--muted)">PO₂ darah sepanjang kapiler (mmHg)</text><line x1="${gx}" y1="${gy}" x2="${gx + gw}" y2="${gy}" style="stroke:var(--muted)"/><line x1="${gx}" y1="${gy - gh}" x2="${gx}" y2="${gy}" style="stroke:var(--muted)"/>`;
  for(const v of [0, 50, 100]) s += `<text class="s" x="${gx - 4}" y="${gy - gh * v / 110 + 4}" text-anchor="end" style="fill:var(--muted)">${v}</text>`;
  let p = ''; for(let i = 0; i <= 40; i++){ const x = i / 40; p += (i ? 'L' : 'M') + (gx + gw * x).toFixed(1) + ',' + (gy - gh * m.P(x) / 110).toFixed(1); }
  s += `<line x1="${gx}" y1="${gy - gh * m.PA / 110}" x2="${gx + gw}" y2="${gy - gh * m.PA / 110}" stroke="#64b5f6" stroke-dasharray="4 3"/><path d="${p}" fill="none" stroke="#c62828" stroke-width="2.5"/><text class="s" x="${gx + gw}" y="${gy + 14}" text-anchor="end" style="fill:var(--muted)">awal → akhir kapiler</text>`;
  // kurva disosiasi oksihemoglobin
  const hx = 270, hw = 190;
  s += `<text class="s" x="${hx}" y="${gy - gh - 8}" style="fill:var(--muted)">saturasi hemoglobin (%) terhadap PO₂</text><line x1="${hx}" y1="${gy}" x2="${hx + hw}" y2="${gy}" style="stroke:var(--muted)"/><line x1="${hx}" y1="${gy - gh}" x2="${hx}" y2="${gy}" style="stroke:var(--muted)"/>`;
  let q = ''; for(let i = 0; i <= 50; i++){ const P = 110 * i / 50; q += (i ? 'L' : 'M') + (hx + hw * P / 110).toFixed(1) + ',' + (gy - gh * sat(P, 26.8)).toFixed(1); }
  s += `<path d="${q}" fill="none" stroke="#6a1b9a" stroke-width="2.5"/>`;
  s += `<circle cx="${hx + hw * m.Pa / 110}" cy="${gy - gh * m.Sa}" r="5" fill="#c62828"/><text class="s" x="${hx + hw * m.Pa / 110 - 6}" y="${gy - gh * m.Sa - 8}" text-anchor="end" fill="#c62828">paru-paru</text>`;
  s += `<circle cx="${hx + hw * m.Pv / 110}" cy="${gy - gh * m.Sv}" r="5" fill="#1565c0"/><text class="s" x="${hx + hw * m.Pv / 110 + 8}" y="${gy - gh * m.Sv + 4}" fill="#1565c0">jaringan</text>`;
  svg.innerHTML = s;
  const del = m.CaO2 - m.CvO2;
  $('read').innerHTML = `<div><span>Saturasi Hb darah arteri</span><b>${fmt(100 * m.Sa, 0)}%</b></div><div><span>O₂ dalam darah arteri</span><b>${fmt(m.CaO2, 1)} mL/dL</b></div><div><span>O₂ dilepas ke jaringan</span><b>${fmt(del, 1)} mL/dL darah</b></div>`;
  let ket = 'Oksigen berdifusi dari alveolus (PO₂ tinggi) ke darah (PO₂ rendah), lalu diikat hemoglobin menjadi oksihemoglobin. Di jaringan yang PO₂-nya rendah, oksihemoglobin melepaskan oksigen.';
  if(m.alt > 2000) ket = 'Di tempat tinggi tekanan udara rendah, sehingga PO₂ alveolus turun, selisih PO₂ dengan darah mengecil, dan saturasi hemoglobin berkurang.';
  if(m.hb < 11) ket = 'Hemoglobin rendah (anemia, misalnya karena kekurangan zat besi): saturasi tetap tinggi, tetapi jumlah oksigen yang dapat diangkut tiap dL darah berkurang.';
  if(m.th > 2 || m.ar < .6) ket = 'Dinding yang menebal atau berisi cairan (misalnya pneumonia) dan permukaan alveolus yang berkurang memperlambat difusi, sehingga darah meninggalkan kapiler sebelum PO₂-nya setinggi PO₂ alveolus. Efek ini makin terasa saat olahraga karena darah mengalir lebih cepat.';
  $('ket').textContent = ket;
}
['alt', 'hb', 'th', 'ar', 'ex'].forEach(i => $(i).oninput = draw);
setInterval(draw, 80);
draw();
</script>
</body>
</html>
