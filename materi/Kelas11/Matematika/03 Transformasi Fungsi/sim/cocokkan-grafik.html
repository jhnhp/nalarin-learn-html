<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tantangan Mencocokkan Grafik</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.big{font-family:var(--display);font-weight:800;font-size:18px;text-align:center;padding:8px;border-radius:12px;background:var(--surface-2)}
.msg{font-weight:700;padding:8px 10px;border-radius:10px;background:var(--surface-2)}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" role="img" aria-label="Grafik target dan grafik buatanmu"></svg></div>
  <div class="panel">
    <div class="row"><b>Tantangan <span id="lv">1</span></b><button class="btn" id="new">Target baru</button></div>
    <p class="note">Ubah a, h, dan k pada y = a·f(x − h) + k agar grafik biru menutupi titik-titik target merah. Fungsi dasar: <b id="bn"></b>.</p>
    <div class="big" id="eq"></div>
    <div><div class="lab"><span>a</span><b id="aout"></b></div><input type="range" id="a" min="-3" max="3" step="0.5" value="1"></div>
    <div><div class="lab"><span>h</span><b id="hout"></b></div><input type="range" id="h" min="-5" max="5" step="1" value="0"></div>
    <div><div class="lab"><span>k</span><b id="kout"></b></div><input type="range" id="k" min="-5" max="5" step="1" value="0"></div>
    <div class="row"><button class="btn primary" id="cek">Periksa</button><button class="btn" id="hint">Petunjuk</button></div>
    <div class="msg" id="msg">Cocokkan grafiknya, lalu tekan Periksa.</div>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const P = Sim.plane(svg, {xmin: -7, xmax: 7, ymin: -7, ymax: 7, scale: 26});
const B = [{n: 'y = x²', f: x => x * x, s: u => u === 'x' ? 'x²' : `(${u})²`}, {n: 'y = 2ˣ', f: x => 2 ** x, s: u => u === 'x' ? '2ˣ' : `2^(${u})`}];
let T, lv = 1;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function newT(){ const bi = lv % 2 ? 0 : 1; T = {bi, a: pick(bi ? [1, 2, -1, -2, .5] : [1, -1, 2, -2, .5, -.5]), h: pick([-3, -2, -1, 1, 2, 3]), k: pick([-3, -2, -1, 1, 2, 3])}; ['a', 'h', 'k'].forEach(id => $(id).value = id === 'a' ? 1 : 0); $('msg').textContent = 'Cocokkan grafiknya, lalu tekan Periksa.'; $('lv').textContent = lv; draw(); }
['a', 'h', 'k'].forEach(id => $(id).oninput = draw);
$('new').onclick = () => { lv++; newT(); };
$('cek').onclick = () => { const a = +$('a').value, h = +$('h').value, k = +$('k').value; const ok = a === T.a && h === T.h && k === T.k;
  $('msg').innerHTML = ok ? `✓ Tepat! Fungsinya y = ${fmt(T.a)}·${B[T.bi].s('x ' + (T.h > 0 ? '− ' : '+ ') + Math.abs(T.h))} ${T.k > 0 ? '+' : '−'} ${Math.abs(T.k)}. Tekan <b>Target baru</b>.` : `Belum tepat: ${[a !== T.a ? 'a' : '', h !== T.h ? 'h' : '', k !== T.k ? 'k' : ''].filter(Boolean).join(', ')} masih perlu diubah.`; };
$('hint').onclick = () => { $('msg').innerHTML = T.bi === 0 ? 'Titik puncak parabola target adalah (h, k). Setelah itu, bandingkan titik yang berjarak 1 satuan dari puncak untuk menentukan a.' : 'Asimtot datar grafik target adalah y = k. Lalu lihat titik saat x = h: nilainya a + k.'; };
Sim.onTheme(draw);
function curve(f, col, w){ let d = '', pen = false; for(let x = -7; x <= 7.001; x += .02){ const y = f(x); if(!isFinite(y) || Math.abs(y) > 7.5){ pen = false; continue; } d += (pen ? 'L' : 'M') + P.X(x).toFixed(1) + ',' + P.Y(y).toFixed(1); pen = true; } return `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${w}"/>`; }
function draw(){
  const F = B[T.bi], a = +$('a').value, h = +$('h').value, k = +$('k').value;
  ['a', 'h', 'k'].forEach(id => $(id + 'out').textContent = fmt(+$(id).value));
  $('bn').textContent = F.n;
  const tg = x => T.a * F.f(x - T.h) + T.k;
  let s = P.grid({labelStep: 2, xname: 'x', yname: 'y'});
  if(T.bi === 1) s += `<line x1="0" y1="${P.Y(T.k)}" x2="${P.X(7)}" y2="${P.Y(T.k)}" style="stroke:var(--r)" stroke-width="1.2" class="dash"/>`;
  for(let x = -6; x <= 6; x += .5){ const y = tg(x); if(Math.abs(y) <= 7) s += `<circle cx="${P.X(x)}" cy="${P.Y(y)}" r="6" style="fill:var(--r)" fill-opacity=".8"/>`; }
  s += curve(x => a * F.f(x - h) + k, 'var(--a)', 3);
  svg.innerHTML = s;
  $('eq').textContent = `y = ${a === 1 ? '' : a === -1 ? '−' : fmt(a) + '·'}${F.s(h ? 'x ' + (h > 0 ? '− ' : '+ ') + Math.abs(h) : 'x')}${k ? (k > 0 ? ' + ' : ' − ') + Math.abs(k) : ''}`;
}
newT();
</script>
</body>
</html>
