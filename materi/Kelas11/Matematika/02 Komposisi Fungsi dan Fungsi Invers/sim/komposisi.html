<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesin Komposisi Fungsi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800}
select{font:inherit;font-size:14px;padding:6px 8px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);width:100%}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 460 300" role="img" aria-label="Dua mesin fungsi yang dirangkai"></svg></div>
  <div class="panel">
    <div><div class="lab"><span>f(x) =</span></div><select id="f"></select></div>
    <div><div class="lab"><span>g(x) =</span></div><select id="g"></select></div>
    <div class="seg" id="ord"><button data-o="fg" class="on">(f ∘ g)(x) = f(g(x))</button><button data-o="gf">(g ∘ f)(x) = g(f(x))</button></div>
    <div><div class="lab"><span>Masukan x</span><b id="xout"></b></div><input type="range" id="x" min="-5" max="5" step="1" value="2"></div>
    <div class="read" id="read"></div>
    <p class="note">Pada f ∘ g, mesin <b>g</b> bekerja lebih dulu, lalu keluarannya menjadi masukan <b>f</b>. Bandingkan kedua urutan: hasilnya umumnya berbeda.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
// [label, fungsi, rumus dengan u sebagai masukan, syarat domain]
const FN = [
  ['2x + 3', u => 2 * u + 3, u => `2${par(u)} + 3`],
  ['x − 4', u => u - 4, u => `${u} − 4`],
  ['3x', u => 3 * u, u => `3${par(u)}`],
  ['x²', u => u * u, u => `${par(u)}²`],
  ['x² + 1', u => u * u + 1, u => `${par(u)}² + 1`],
  ['√x', u => u >= 0 ? Math.sqrt(u) : NaN, u => `√${par(u)}`],
  ['1/(x − 1)', u => u === 1 ? NaN : 1 / (u - 1), u => `1/(${u} − 1)`],
];
const par = u => u === 'x' ? 'x' : `(${u})`;
['f', 'g'].forEach((id, k) => { $(id).innerHTML = FN.map((F, i) => `<option value="${i}"${i === [0, 3][k] ? ' selected' : ''}>${F[0]}</option>`).join(''); $(id).onchange = draw; });
let ord = 'fg';
$('ord').onclick = e => { const b = e.target.closest('button'); if(!b) return; ord = b.dataset.o; document.querySelectorAll('#ord button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
$('x').oninput = draw;
Sim.onTheme(draw);
const val = v => isNaN(v) ? 'tidak terdefinisi' : fmt(v, 3);
function box(x, y, name, rule, col){
  return `<rect x="${x}" y="${y}" width="150" height="86" rx="14" style="fill:${col};stroke:${col}" fill-opacity=".14" stroke-width="2.5"/><text class="c" x="${x + 75}" y="${y + 36}" text-anchor="middle" font-size="22" style="fill:${col}">${name}</text><text x="${x + 75}" y="${y + 62}" text-anchor="middle" font-size="13.5" style="fill:var(--ink)">${name}(x) = ${rule}</text>`;
}
const arrow = (x1, x2, y, t) => `<line x1="${x1}" y1="${y}" x2="${x2 - 8}" y2="${y}" style="stroke:var(--ink)" stroke-width="2"/><path d="M${x2} ${y} l-10 -6 v12z" style="fill:var(--ink)"/><text class="c" x="${(x1 + x2) / 2}" y="${y - 10}" text-anchor="middle" font-size="14">${t}</text>`;
function draw(){
  const fi = +$('f').value, gi = +$('g').value, x = +$('x').value, F = FN[fi], G = FN[gi];
  const [first, second, n1, n2, c1, c2] = ord === 'fg' ? [G, F, 'g', 'f', 'var(--comp)', 'var(--a)'] : [F, G, 'f', 'g', 'var(--a)', 'var(--comp)'];
  const m = first[1](x), out = isNaN(m) ? NaN : second[1](m);
  let s = arrow(6, 70, 120, `x = ${x}`) + box(70, 77, n1, first[0], c1) + arrow(220, 290, 120, val(m)) + box(290, 77, n2, second[0], c2);
  s += `<line x1="440" y1="120" x2="450" y2="120" style="stroke:var(--ink)" stroke-width="2"/><text class="c" x="440" y="200" text-anchor="end" font-size="16">${ord === 'fg' ? '(f ∘ g)' : '(g ∘ f)'}(${x}) = ${val(out)}</text>`;
  const rule = second[2](first[0].replace(/x/g, 'x'));
  s += `<text x="230" y="250" text-anchor="middle" font-size="15" style="fill:var(--muted)">${ord === 'fg' ? '(f ∘ g)(x) = f(g(x))' : '(g ∘ f)(x) = g(f(x))'} = ${rule}</text>`;
  svg.innerHTML = s;
  $('xout').textContent = x;
  const fg = isNaN(G[1](x)) ? NaN : F[1](G[1](x)), gf = isNaN(F[1](x)) ? NaN : G[1](F[1](x));
  $('read').innerHTML = `<div><span style="color:var(--comp)">Langkah 1: ${n1}(${x})</span><b>${val(m)}</b></div><div><span style="color:var(--a)">Langkah 2: ${n2}(${val(m)})</span><b>${val(out)}</b></div>` +
    `<div><span>(f ∘ g)(${x})</span><b>${val(fg)}</b></div><div><span>(g ∘ f)(${x})</span><b>${val(gf)}</b></div>` +
    `<div><span>Sama?</span><b>${isNaN(fg) || isNaN(gf) ? '–' : Math.abs(fg - gf) < 1e-9 ? 'sama untuk x ini' : 'berbeda'}</b></div>`;
}
draw();
</script>
</body>
</html>
