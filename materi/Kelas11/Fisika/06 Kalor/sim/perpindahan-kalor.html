<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perpindahan Kalor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:11px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 260" role="img" aria-label="Laju perpindahan kalor secara konduksi, konveksi, atau radiasi"></svg></div>
  <div class="panel">
    <div class="seg" id="mode"><button class="on" data-v="kond">Konduksi</button><button data-v="konv">Konveksi</button><button data-v="rad">Radiasi</button></div>
    <div id="ctl"></div>
    <div class="read" id="read"></div>
    <p class="note" id="note"></p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
let mode = 'kond', ph = 0;
const MAT = [['Tembaga', 385], ['Aluminium', 205], ['Baja', 50], ['Kaca', 0.8], ['Bata', 0.6], ['Kayu', 0.12], ['Styrofoam', 0.033]];
const P = {mat: 6, A: 0.5, L: 2, Th: 30, Tc: 0, h: 10, Ts: 34, Tf: 24, e: 0.9, T: 600, Te: 300, r: 0.1};
const CTL = {
  kond: [['A', 'Luas penampang A', 'm²', .05, 2, .05], ['L', 'Tebal L', 'cm', .5, 10, .5], ['Th', 'Suhu sisi panas', '°C', 0, 100, 1], ['Tc', 'Suhu sisi dingin', '°C', -20, 50, 1]],
  konv: [['h', 'Koefisien konveksi h', 'W/m²K', 2, 50, 1], ['A', 'Luas permukaan A', 'm²', .1, 3, .1], ['Ts', 'Suhu permukaan', '°C', 0, 100, 1], ['Tf', 'Suhu fluida', '°C', 0, 100, 1]],
  rad: [['e', 'Emisivitas e', '', .05, 1, .05], ['r', 'Jari-jari bola', 'm', .02, .5, .01], ['T', 'Suhu benda', 'K', 200, 1500, 10], ['Te', 'Suhu lingkungan', 'K', 0, 600, 10]]
};
function controls(){
  let h = mode === 'kond' ? `<div class="lab">Bahan</div><select id="i-mat" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit">${MAT.map(([n, k], i) => `<option value="${i}" ${i === P.mat ? 'selected' : ''}>${n} (k = ${String(k).replace('.', ',')} W/m·K)</option>`).join('')}</select>` : '';
  h += CTL[mode].map(([k, n, u, a, b, st]) => `<div class="lab">${n} <b id="v-${k}">${fmt(P[k], 3)} ${u}</b></div><input type="range" id="i-${k}" min="${a}" max="${b}" step="${st}" value="${P[k]}">`).join('');
  $('ctl').innerHTML = h;
  if(mode === 'kond') $('i-mat').onchange = e => { P.mat = +e.target.value; };
  CTL[mode].forEach(([k, , u]) => $('i-' + k).oninput = e => { P[k] = +e.target.value; $('v-' + k).textContent = fmt(P[k], 3) + ' ' + u; });
  $('note').innerHTML = mode === 'kond' ? 'Konduksi: H = kAΔT/L. Logam konduktor yang baik; kayu, styrofoam, dan udara isolator. Lantai keramik terasa lebih dingin daripada keset walaupun suhunya sama karena keramik menghantarkan kalor dari kaki lebih cepat.' : mode === 'konv' ? 'Konveksi: H = hAΔT, kalor dibawa oleh aliran fluida. Konveksi alami (angin darat dan laut) dan konveksi paksa (kipas, pompa air radiator).' : 'Radiasi: P = eσAT⁴ dengan σ = 5,67 × 10⁻⁸ W/m²K⁴; tidak memerlukan medium. Laju bersih P = eσA(T⁴ − T<sub>ling</sub>⁴). Benda hitam e = 1.';
}
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); mode = b.dataset.v; controls(); });
function frame(){
  ph += .05;
  let H, s = '', form;
  if(mode === 'kond'){
    const [n, k] = MAT[P.mat]; H = k * P.A * (P.Th - P.Tc) / (P.L / 100);
    const w = 30 + P.L * 12;
    s += `<rect x="${240 - w / 2}" y="40" width="${w}" height="140" style="fill:var(--comp)" fill-opacity=".35" stroke="var(--ink)"/><text class="s" x="240" y="200" text-anchor="middle" style="fill:var(--ink)">${n}, tebal ${fmt(P.L, 1)} cm</text>`;
    s += `<rect x="20" y="40" width="${200 - w / 2}" height="140" fill="#ef4444" fill-opacity=".15"/><rect x="${260 + w / 2}" y="40" width="${200 - w / 2}" height="140" fill="#3b82f6" fill-opacity=".15"/>`;
    s += `<text class="c" x="60" y="30" style="fill:#ef4444">${P.Th} °C</text><text class="c" x="420" y="30" text-anchor="end" style="fill:#3b82f6">${P.Tc} °C</text>`;
    form = `H = kAΔT/L = ${fmt(k, 3)} × ${fmt(P.A, 2)} × ${P.Th - P.Tc} / ${fmt(P.L / 100, 3)}`;
  } else if(mode === 'konv'){
    H = P.h * P.A * (P.Ts - P.Tf);
    s += `<rect x="40" y="150" width="400" height="30" style="fill:var(--comp)" fill-opacity=".4"/><text class="s" x="240" y="200" text-anchor="middle" style="fill:var(--ink)">permukaan ${P.Ts} °C, fluida ${P.Tf} °C</text>`;
    for(let i = 0; i < 6; i++){ const x = 70 + i * 65, y = 140 - ((ph * 30 * Math.sign(H || 1) + i * 20) % 100 + 100) % 100; s += `<path d="M${x},${y} q8,-10 0,-20" fill="none" stroke="${H >= 0 ? '#ef4444' : '#3b82f6'}" stroke-width="2"/>`; }
    form = `H = hAΔT = ${P.h} × ${fmt(P.A, 2)} × ${P.Ts - P.Tf}`;
  } else {
    const A = 4 * Math.PI * P.r * P.r, sg = 5.67e-8; H = P.e * sg * A * (P.T ** 4 - P.Te ** 4);
    const glow = Math.min(1, Math.max(0, (P.T - 600) / 900));
    s += `<circle cx="240" cy="110" r="${30 + P.r * 120}" fill="rgb(${Math.round(120 + 135 * glow)},${Math.round(80 + 120 * glow * glow)},${Math.round(80 * glow * glow)})" fill-opacity="${.3 + .7 * Math.min(1, P.T / 1500)}" stroke="var(--ink)"/>`;
    for(let i = 0; i < 12; i++){ const a = i / 12 * 2 * Math.PI, r0 = 40 + P.r * 120, r1 = r0 + 10 + (ph * 20 % 30); s += `<line x1="${240 + r0 * Math.cos(a)}" y1="${110 + r0 * Math.sin(a)}" x2="${240 + r1 * Math.cos(a)}" y2="${110 + r1 * Math.sin(a)}" stroke="#f59e0b" stroke-width="2" stroke-opacity="${H > 0 ? .8 : .2}"/>`; }
    form = `P = eσA(T⁴ − T_ling⁴), A = 4πr² = ${fmt(A, 4)} m²`;
  }
  // panah laju (skala log)
  const mag = Math.abs(H), len = mag > 0 ? Math.min(180, 20 + 30 * Math.log10(1 + mag)) : 0, dir = H >= 0 ? 1 : -1;
  if(mode === 'kond' && len){ const y = 110; s += `<line x1="${240 - dir * len / 2}" y1="${y}" x2="${240 + dir * len / 2}" y2="${y}" style="stroke:var(--b)" stroke-width="5"/><path d="M${240 + dir * (len / 2 + 10)},${y} l${-dir * 12},-8 l0,16z" style="fill:var(--b)"/>`; }
  s += `<text class="c" x="240" y="240" text-anchor="middle" style="fill:var(--ink)">${form}</text>`;
  svg.innerHTML = s;
  $('read').innerHTML = `<div><span>Laju kalor</span><b>${fmt(H, mag < 10 ? 3 : 1)} W ${H < 0 ? '(kalor mengalir ke arah sebaliknya)' : ''}</b></div><div><span>Kalor dalam 1 jam</span><b>${fmt(H * 3600 / 1000, 1)} kJ</b></div>`;
}
controls();
setInterval(frame, 40);
</script>
</body>
</html>
