<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interferensi dan Difraksi Cahaya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 300" role="img" aria-label="Pola terang gelap pada layar"></svg></div>
  <div class="panel">
    <div class="seg" id="mode"><button class="on" data-v="ganda">Celah ganda</button><button data-v="kisi">Kisi</button><button data-v="tunggal">Celah tunggal</button></div>
    <div class="lab">Panjang gelombang λ <b id="lv"></b></div><input type="range" id="l" min="400" max="700" step="10" value="550">
    <div class="lab" id="dl">Jarak antarcelah d <b id="dv"></b></div><input type="range" id="d" min="0.05" max="1" step="0.01" value="0.25">
    <div class="lab">Jarak celah–layar L <b id="Lv"></b></div><input type="range" id="L" min="0.5" max="3" step="0.1" value="1.5">
    <div class="read" id="read"></div>
    <p class="note" id="note"></p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
let mode = 'ganda';
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); mode = b.dataset.v; setup(); draw(); });
['l', 'd', 'L'].forEach(i => $(i).oninput = draw);
function setup(){
  const d = $('d');
  if(mode === 'kisi'){ d.min = 100; d.max = 1000; d.step = 50; d.value = 500; }
  else if(mode === 'tunggal'){ d.min = .02; d.max = .3; d.step = .01; d.value = .1; }
  else { d.min = .05; d.max = 1; d.step = .01; d.value = .25; }
  $('note').innerHTML = mode === 'ganda' ? 'Young: terang jika d·sin θ ≈ d·y/L = nλ; gelap jika = (n − ½)λ. Jarak antar terang berdekatan Δy = λL/d.' : mode === 'kisi' ? 'Kisi difraksi dengan N garis per mm memiliki d = 1/N. Terang orde n: d sin θ = nλ. Kisi menghasilkan garis terang yang tajam.' : 'Celah tunggal selebar a: gelap jika a sin θ = nλ (n = 1, 2, …). Terang pusat paling lebar, dua kali lebar terang lainnya.';
}
function rgb(nm){ let r = 0, g = 0, b = 0; if(nm < 440){ r = (440 - nm) / 60; b = 1; } else if(nm < 490){ g = (nm - 440) / 50; b = 1; } else if(nm < 510){ g = 1; b = (510 - nm) / 20; } else if(nm < 580){ r = (nm - 510) / 70; g = 1; } else if(nm < 645){ r = 1; g = (645 - nm) / 65; } else r = 1; return [r, g, b].map(v => Math.round(255 * v)); }
function draw(){
  const lam = +$('l').value * 1e-9, L = +$('L').value, dv = +$('d').value;
  let d, label, a;
  if(mode === 'kisi'){ d = 1e-3 / dv; label = dv + ' garis/mm'; }
  else if(mode === 'tunggal'){ a = dv * 1e-3; label = fmt(dv, 2) + ' mm (lebar celah a)'; }
  else { d = dv * 1e-3; label = fmt(dv, 2) + ' mm'; }
  const ymax = .06; // ±6 cm ditampilkan
  const I = y => { const th = Math.atan(y / L), sn = Math.sin(th);
    if(mode === 'tunggal'){ const b = Math.PI * a * sn / lam; return b === 0 ? 1 : (Math.sin(b) / b) ** 2; }
    const ph = Math.PI * d * sn / lam;
    if(mode === 'ganda') return Math.cos(ph) ** 2;
    const N = 8, den = Math.sin(ph); return Math.abs(den) < 1e-9 ? 1 : (Math.sin(N * ph) / (N * den)) ** 2; };
  const [r, g, b] = rgb(+$('l').value);
  let s = '';
  // layar (pita warna)
  const X = y => 240 + y / ymax * 220;
  for(let i = 0; i < 440; i++){ const y = (i - 220) / 220 * ymax, k = I(y); s += `<rect x="${20 + i}" y="30" width="1.2" height="60" fill="rgb(${r},${g},${b})" fill-opacity="${Math.min(1, k * 1.1)}"/>`; }
  s += `<rect x="20" y="30" width="440" height="60" fill="none" style="stroke:var(--line-2)"/><text class="s" x="20" y="22" style="fill:var(--muted)">pola pada layar (±6 cm dari pusat)</text>`;
  // grafik intensitas
  let p = ''; for(let i = 0; i <= 440; i++){ const y = (i - 220) / 220 * ymax; p += (i ? 'L' : 'M') + (20 + i) + ',' + (240 - I(y) * 110).toFixed(1); }
  s += `<line x1="20" y1="240" x2="460" y2="240" style="stroke:var(--ink)"/><path d="${p}" fill="none" stroke="rgb(${r},${g},${b})" stroke-width="2"/>`;
  [-6, -4, -2, 0, 2, 4, 6].forEach(c => s += `<text class="s" x="${X(c / 100)}" y="256" text-anchor="middle" style="fill:var(--muted)">${c} cm</text>`);
  s += `<text class="s" x="20" y="120" style="fill:var(--muted)">intensitas</text>`;
  svg.innerHTML = s;
  $('lv').textContent = $('l').value + ' nm'; $('dv').textContent = label; $('Lv').textContent = fmt(L, 1) + ' m';
  $('dl').firstChild.textContent = mode === 'kisi' ? 'Jumlah garis kisi N ' : mode === 'tunggal' ? 'Lebar celah a ' : 'Jarak antarcelah d ';
  let rd;
  if(mode === 'tunggal'){ const y1 = lam * L / a; rd = `<div><span>Gelap pertama y₁ = λL/a</span><b>${fmt(y1 * 100, 3)} cm</b></div><div><span>Lebar terang pusat 2y₁</span><b>${fmt(2 * y1 * 100, 3)} cm</b></div>`; }
  else { const dy = lam * L / d; const s1 = lam / d; rd = `<div><span>${mode === 'kisi' ? 'd = 1/N' : 'd'}</span><b>${fmt(d * 1e3, 4)} mm</b></div><div><span>sin θ₁ = λ/d</span><b>${fmt(s1, 4)}</b></div><div><span>Jarak terang pusat ke terang ke-1</span><b>${s1 < 1 ? fmt(L * Math.tan(Math.asin(s1)) * 100, 3) + ' cm' : 'tidak ada'}${mode === 'ganda' ? ' (Δy = λL/d)' : ''}</b></div>`; }
  $('read').innerHTML = rd;
}
setup(); draw();
</script>
</body>
</html>
