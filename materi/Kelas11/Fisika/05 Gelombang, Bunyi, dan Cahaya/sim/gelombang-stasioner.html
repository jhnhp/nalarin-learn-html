<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawai dan Pipa Organa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:11px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 260" role="img" aria-label="Pola gelombang stasioner pada dawai atau pipa organa"></svg></div>
  <div class="panel">
    <div class="seg" id="tp"><button class="on" data-v="dawai">Dawai</button><button data-v="terbuka">Pipa terbuka</button><button data-v="tertutup">Pipa tertutup</button></div>
    <div class="lab" id="nl">Nada ke- <b id="nv"></b></div><input type="range" id="n" min="1" max="5" step="1" value="1">
    <div class="lab">Panjang L <b id="Lv"></b></div><input type="range" id="L" min="0.2" max="1.5" step="0.01" value="0.5">
    <div id="extra"></div>
    <div class="read" id="read"></div>
    <p class="note" id="note"></p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
let tp = 'dawai', t = 0;
const P = {F: 100, mu: 5, v: 340};
const NAMA = ['nada dasar', 'nada atas pertama', 'nada atas kedua', 'nada atas ketiga', 'nada atas keempat'];
function extra(){
  if(tp === 'dawai'){
    $('extra').innerHTML = `<div class="lab">Tegangan dawai F <b id="Fv">${P.F} N</b></div><input type="range" id="F" min="10" max="400" step="10" value="${P.F}"><div class="lab">Massa per panjang μ <b id="mv">${P.mu} g/m</b></div><input type="range" id="mu" min="1" max="20" step="0.5" value="${P.mu}">`;
    $('F').oninput = e => { P.F = +e.target.value; $('Fv').textContent = P.F + ' N'; };
    $('mu').oninput = e => { P.mu = +e.target.value; $('mv').textContent = fmt(P.mu, 1) + ' g/m'; };
  } else {
    $('extra').innerHTML = `<div class="lab">Cepat rambat bunyi v <b id="vvv">${P.v} m/s</b></div><input type="range" id="vv" min="300" max="360" step="1" value="${P.v}">`;
    $('vv').oninput = e => { P.v = +e.target.value; $('vvv').textContent = P.v + ' m/s'; };
  }
  $('note').innerHTML = tp === 'dawai' ? 'Dawai: kedua ujung terikat (simpul). Cepat rambat v = √(F/μ) (hukum Melde). fₙ = (n+1)v/2L dengan n = 0 untuk nada dasar, n = 1 untuk nada atas pertama, dan seterusnya. Perbandingan f₀ : f₁ : f₂ = 1 : 2 : 3.' : tp === 'terbuka' ? 'Pipa organa terbuka: kedua ujung perut. fₙ = (n+1)v/2L; perbandingan 1 : 2 : 3 : …' : 'Pipa organa tertutup: ujung tertutup simpul, ujung terbuka perut. fₙ = (2n+1)v/4L; hanya harmonik ganjil: 1 : 3 : 5 : …';
}
document.querySelectorAll('#tp button').forEach(b => b.onclick = () => { document.querySelectorAll('#tp button').forEach(x => x.classList.toggle('on', x === b)); tp = b.dataset.v; extra(); });
function frame(){
  t += .08;
  const n = +$('n').value - 1, L = +$('L').value;
  const v = tp === 'dawai' ? Math.sqrt(P.F / (P.mu / 1000)) : P.v;
  const m = tp === 'tertutup' ? 2 * n + 1 : n + 1; // kelipatan
  const lam = tp === 'tertutup' ? 4 * L / m : 2 * L / m, f = v / lam;
  const x0 = 40, x1 = 440, cy = 120, A = 50;
  let s = '';
  if(tp === 'dawai'){
    s += `<rect x="${x0 - 12}" y="${cy - 40}" width="12" height="80" style="fill:var(--line-2)"/><rect x="${x1}" y="${cy - 40}" width="12" height="80" style="fill:var(--line-2)"/>`;
  } else {
    s += `<rect x="${x0}" y="${cy - 60}" width="${x1 - x0}" height="120" rx="4" fill="none" style="stroke:var(--ink)" stroke-width="2"/>`;
    s += `<rect x="${x0}" y="${cy - 60}" width="${x1 - x0}" height="120" style="fill:var(--a)" fill-opacity=".05"/>`;
    if(tp === 'tertutup') s += `<rect x="${x0 - 8}" y="${cy - 64}" width="10" height="128" style="fill:var(--ink)"/>`;
  }
  // amplitudo simpangan sepanjang x
  const amp = u => tp === 'dawai' || tp === 'terbuka' ? (tp === 'dawai' ? Math.sin(Math.PI * m * u) : Math.cos(Math.PI * m * u)) : Math.sin(Math.PI * m * u / 2);
  const c = Math.cos(t);
  const path = sgn => { let p = ''; for(let i = 0; i <= 120; i++){ const u = i / 120; p += (i ? 'L' : 'M') + (x0 + u * (x1 - x0)).toFixed(1) + ',' + (cy - sgn * A * amp(u)).toFixed(1); } return p; };
  s += `<path d="${path(1)}" fill="none" style="stroke:var(--a)" stroke-opacity=".25" stroke-width="2"/><path d="${path(-1)}" fill="none" style="stroke:var(--a)" stroke-opacity=".25" stroke-width="2"/>`;
  let p = ''; for(let i = 0; i <= 120; i++){ const u = i / 120; p += (i ? 'L' : 'M') + (x0 + u * (x1 - x0)).toFixed(1) + ',' + (cy - A * amp(u) * c).toFixed(1); }
  s += `<path d="${p}" fill="none" style="stroke:var(--a)" stroke-width="3"/>`;
  // simpul dan perut
  for(let i = 0; i <= 240; i++){ const u = i / 240, a0 = Math.abs(amp(u)), a1 = Math.abs(amp((i - 1) / 240)), a2 = Math.abs(amp((i + 1) / 240));
    if(a0 < .02 && a0 <= a1 && a0 <= a2) s += `<circle cx="${x0 + u * (x1 - x0)}" cy="${cy}" r="5" style="fill:var(--b)"/>`;
    if(a0 > .995 && a0 >= a1 && a0 >= a2) s += `<text class="s" x="${x0 + u * (x1 - x0)}" y="${cy + A + 22}" text-anchor="middle" style="fill:var(--k)">P</text>`; }
  s += `<circle cx="20" cy="236" r="5" style="fill:var(--b)"/><text class="s" x="30" y="240" style="fill:var(--ink)">simpul</text><text class="s" x="90" y="240" style="fill:var(--k)">P</text><text class="s" x="102" y="240" style="fill:var(--ink)">perut</text>`;
  s += `<text class="s" x="440" y="240" text-anchor="end" style="fill:var(--muted)">L = ${fmt(L, 2)} m = ${fmt(L / lam, 2)} λ</text>`;
  svg.innerHTML = s;
  $('nv').textContent = (n + 1) + ' (' + NAMA[n] + ')'; $('Lv').textContent = fmt(L, 2) + ' m';
  $('read').innerHTML = `<div><span>Cepat rambat v</span><b>${fmt(v, 1)} m/s</b></div><div><span>Panjang gelombang λ</span><b>${fmt(lam, 3)} m</b></div><div><span>Frekuensi</span><b>${fmt(f, 1)} Hz</b></div>`;
}
extra();
setInterval(frame, 40);
</script>
</body>
</html>
