<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerak Parabola</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 310" role="img" aria-label="Lintasan gerak parabola dengan komponen kecepatan"></svg></div>
  <div class="panel">
    <div class="lab">Kelajuan awal v₀ <b id="vv"></b></div><input type="range" id="v" min="2" max="30" step="1" value="15">
    <div class="lab">Sudut elevasi θ <b id="av"></b></div><input type="range" id="a" min="0" max="90" step="1" value="53">
    <div class="lab">Tinggi awal h₀ <b id="hv"></b></div><input type="range" id="h" min="0" max="30" step="0.5" value="0">
    <label class="chk"><input type="checkbox" id="c-drop"> Bandingkan dengan bola yang dijatuhkan dari tinggi yang sama</label>
    <label class="chk"><input type="checkbox" id="c-comp" checked> Tampilkan komponen kecepatan</label>
    <div class="row"><button class="btn primary" id="go">▶ Lempar</button><button class="btn" id="reset">Ulang</button></div>
    <div class="read" id="read"></div>
    <p class="note">Sumbu x: GLB dengan v<sub>x</sub> = v₀ cos θ. Sumbu y: GLBB dengan v<sub>y</sub> = v₀ sin θ − g t, percepatan g = 10 m/s² ke bawah. Kedua gerak berlangsung bersamaan dan saling bebas.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt, rad} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const g = 10;
let t = 0, timer = null;
['v', 'a', 'h', 'c-drop', 'c-comp'].forEach(i => $(i).oninput = () => { if(i !== 'c-comp') reset(); else draw(); });
$('go').onclick = () => { if(timer) return; if(t >= tf()) t = 0; timer = setInterval(() => { t = Math.min(tf(), t + .03); if(t >= tf()){ clearInterval(timer); timer = null; } draw(); }, 30); };
$('reset').onclick = reset;
function reset(){ if(timer){ clearInterval(timer); timer = null; } t = 0; draw(); }
function prm(){ const v = +$('v').value, a = rad(+$('a').value), h = +$('h').value; return {v, a, h, vx: v * Math.cos(a), vy: v * Math.sin(a)}; }
function tf(){ const p = prm(); return (p.vy + Math.sqrt(p.vy * p.vy + 2 * g * p.h)) / g; }
function draw(){
  const p = prm(), T = tf(), R = p.vx * T, ymax = p.h + p.vy * p.vy / (2 * g) * (p.vy > 0 ? 1 : 0);
  const W = Math.max(R, 10), Hh = Math.max(ymax, 5);
  const sc = Math.min(390 / W, 225 / Hh), X = x => 30 + x * sc, Y = y => 255 - y * sc;
  let s = `<line x1="20" y1="${Y(0)}" x2="470" y2="${Y(0)}" style="stroke:var(--ink)" stroke-width="2"/>`;
  if(p.h > 0) s += `<rect x="${X(0) - 26}" y="${Y(p.h)}" width="26" height="${p.h * sc}" style="fill:var(--line-2)"/>`;
  // grid skala
  const step = [1, 2, 5, 10, 20, 50].find(k => k * sc > 40) || 50;
  for(let x = step; x <= W + .01; x += step) s += `<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(0) + 5}" style="stroke:var(--muted)"/><text class="s" x="${X(x)}" y="${Y(0) + 17}" text-anchor="middle" style="fill:var(--muted)">${x} m</text>`;
  // lintasan
  let path = ''; for(let i = 0; i <= 80; i++){ const tt = T * i / 80; path += (i ? 'L' : 'M') + X(p.vx * tt).toFixed(1) + ',' + Y(p.h + p.vy * tt - .5 * g * tt * tt).toFixed(1); }
  s += `<path d="${path}" fill="none" style="stroke:var(--a)" stroke-width="2" stroke-dasharray="5 4"/>`;
  // jejak titik tiap 0,2 s
  for(let tt = 0; tt <= t + 1e-9; tt += .2) s += `<circle cx="${X(p.vx * tt)}" cy="${Y(p.h + p.vy * tt - .5 * g * tt * tt)}" r="2.5" style="fill:var(--a)" fill-opacity=".5"/>`;
  const x = p.vx * t, y = p.h + p.vy * t - .5 * g * t * t, vyt = p.vy - g * t;
  if($('c-drop').checked){ const yd = Math.max(0, p.h - .5 * g * t * t); s += `<circle cx="${X(0) + 8}" cy="${Y(yd) - 6}" r="6" style="fill:var(--comp)"/>`; }
  s += `<circle cx="${X(x)}" cy="${Y(y) - 6}" r="7" style="fill:var(--b)"/>`;
  if($('c-comp').checked){
    const k = 2.2, cx = X(x), cy = Y(y) - 6;
    const ar = (dx, dy, col, lab) => { const L = Math.hypot(dx, dy); if(L < 3) return ''; const a = Math.atan2(dy, dx); return `<line x1="${cx}" y1="${cy}" x2="${cx + dx - 7 * Math.cos(a)}" y2="${cy + dy - 7 * Math.sin(a)}" style="stroke:${col}" stroke-width="2.5"/><path d="M${cx + dx},${cy + dy} l${-9 * Math.cos(a - .4)},${-9 * Math.sin(a - .4)} l${9 * Math.cos(a - .4) - 9 * Math.cos(a + .4)},${9 * Math.sin(a - .4) - 9 * Math.sin(a + .4)}z" style="fill:${col}"/><text class="s" x="${cx + dx + 4}" y="${cy + dy - 4}" style="fill:${col}">${lab}</text>`; };
    s += ar(p.vx * k, 0, 'var(--k)', 'vₓ') + ar(0, -vyt * k, 'var(--comp)', 'v_y') + ar(p.vx * k, -vyt * k, 'var(--b)', 'v');
  }
  // titik puncak
  if(p.vy > 0){ const tp = p.vy / g; s += `<line x1="${X(p.vx * tp)}" y1="${Y(ymax)}" x2="${X(p.vx * tp)}" y2="${Y(0)}" style="stroke:var(--muted)" stroke-dasharray="2 3"/><text class="s" x="${X(p.vx * tp)}" y="${Y(ymax) - 10}" text-anchor="middle" style="fill:var(--muted)">puncak ${fmt(ymax, 2)} m</text>`; }
  svg.innerHTML = s;
  $('vv').textContent = $('v').value + ' m/s'; $('av').textContent = $('a').value + '°'; $('hv').textContent = fmt(+$('h').value, 1) + ' m';
  $('read').innerHTML = `<div><span>t / x / y</span><b>${fmt(t, 2)} s / ${fmt(x, 2)} m / ${fmt(Math.max(0, y), 2)} m</b></div><div><span>vₓ (tetap) / v_y</span><b>${fmt(p.vx, 2)} / ${fmt(vyt, 2)} m/s</b></div><div><span>Tinggi maksimum / waktu di udara</span><b>${fmt(ymax, 2)} m / ${fmt(T, 2)} s</b></div><div><span>Jarak mendatar</span><b>${fmt(R, 2)} m</b></div>`;
}
draw();
</script>
</body>
</html>
