<text x="360" y="252" class="v" style="fill:#2447f9" dy="-4">A</text>
<text x="280" y="170" class="v" style="fill:#e0344b">B</text>
<text x="212" y="70" class="v" style="fill:#7c3aed">A × B</text>
<text x="330" y="180" class="b" style="fill:#0e8f8a">putar A ke B</text>
<text x="360" y="60" class="m">Empat jari kanan memutar</text>
