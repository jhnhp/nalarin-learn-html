<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c}.m{fill:#5a6283}.b{font-weight:700}.v{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:22px}</style><marker id="ha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2447f9"/></marker><marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0344b"/></marker><marker id="hr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="hc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d98200"/></marker><marker id="hg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3c9"/></marker><marker id="hk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e8f8a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<polygon points="120,250 360,250 460,170 220,170" fill="#f0f2fa" stroke="#cdd3e8" stroke-width="2"/>
<line x1="200" y1="225" x2="390" y2="225" stroke="#2447f9" stroke-width="6" marker-end="url(#ha)"/>
<line x1="200" y1="225" x2="275" y2="175" stroke="#e0344b" stroke-width="6" marker-end="url(#hb)"/>
<line x1="200" y1="225" x2="200" y2="50" stroke="#7c3aed" stroke-width="6" marker-end="url(#hr)"/>
