<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defleksi Muatan di Antara Pelat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 280" role="img" aria-label="Lintasan tetes tinta bermuatan di antara dua pelat sejajar"></svg></div>
  <div class="panel">
    <div class="seg" id="mode"><button data-m="tinta" class="on">Tetes tinta</button><button data-m="elektron">Elektron</button></div>
    <div class="lab">Beda potensial pelat <b id="vv"></b></div><input type="range" id="v" min="0" max="100" step="1" value="40">
    <div class="lab">Muatan <b id="qv"></b></div><input type="range" id="q" min="1" max="10" step="1" value="4">
    <div class="lab">Kelajuan awal <b id="uv"></b></div><input type="range" id="u" min="1" max="10" step="1" value="5">
    <div class="read" id="read"></div>
    <p class="note">Di antara pelat, gaya listrik F = qE = qV/d konstan dan tegak lurus kecepatan awal, sehingga lintasannya parabola (seperti gerak horizontal di medan gravitasi). Gaya berat diabaikan.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
let M = 'tinta';
const CFG = {
  tinta: {m: 1.2e-11, L: 0.015, d: 0.004, Vmax: 3000, qu: 1e-13, qlab: '× 10⁻¹³ C', uu: 5, ulab: 'm/s', vlab: 'V'},
  elektron: {m: 9.1e-31, L: 0.04, d: 0.012, Vmax: 200, qu: 1.6e-19, qlab: 'e', uu: 4e6, ulab: '× 10⁶ m/s', vlab: 'V'}
};
$('mode').querySelectorAll('button').forEach(b => b.onclick = () => { $('mode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); M = b.dataset.m; draw(); });
const sci = v => { if(v === 0) return '0'; const e = Math.floor(Math.log10(Math.abs(v))); if(e >= -2 && e <= 3) return fmt(v, 3); return `${fmt(v / 10 ** e, 2)} × 10${String(e).replace('-', '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d])}`; };
function draw(){
  const c = CFG[M], V = c.Vmax * +$('v').value / 100, qn = +$('q').value, q = qn * c.qu * (M === 'elektron' ? 1 : 1), u = +$('u').value * c.uu;
  const qq = M === 'elektron' ? 1 : qn; // elektron: muatan tetap 1e
  const Q = M === 'elektron' ? c.qu : q;
  $('vv').textContent = fmt(V, 0) + ' V'; $('qv').textContent = M === 'elektron' ? '1 e (tetap)' : qn + ' ' + c.qlab; $('uv').textContent = (M === 'elektron' ? fmt(u / 1e6, 0) + ' × 10⁶' : fmt(u, 0)) + ' m/s';
  $('q').disabled = M === 'elektron';
  const E = V / c.d, a = Q * E / c.m, t = c.L / u, y = 0.5 * a * t * t, vy = a * t;
  const sx = 300 / c.L, sy = 80 / (c.d / 2); // skala gambar
  const x0 = 60, yc = 140, half = c.d / 2;
  let s = `<rect x="${x0}" y="${yc - half * sy - 10}" width="${c.L * sx}" height="10" fill="${M === 'tinta' ? '#1e88e5' : '#e53935'}"/><rect x="${x0}" y="${yc + half * sy}" width="${c.L * sx}" height="10" fill="${M === 'tinta' ? '#e53935' : '#1e88e5'}"/>`;
  s += `<text class="c" x="${x0 + c.L * sx + 6}" y="${yc - half * sy}" style="fill:var(--ink)">${M === 'tinta' ? '−' : '+'}</text><text class="c" x="${x0 + c.L * sx + 6}" y="${yc + half * sy + 10}" style="fill:var(--ink)">${M === 'tinta' ? '+' : '−'}</text>`;
  // lintasan: tinta negatif ditarik ke pelat bawah (+); elektron ke pelat atas (+)
  const dir = M === 'tinta' ? 1 : -1;
  let p = `M20,${yc} L${x0},${yc}`, hit = null;
  for(let i = 1; i <= 60; i++){ const tt = t * i / 60, yy = 0.5 * a * tt * tt; if(yy > half && !hit) hit = u * tt; const yv = Math.min(yy, half); p += ` L${x0 + u * tt * sx},${yc + dir * yv * sy}`; if(yy > half) break; }
  if(!hit){ const slope = vy / u; p += ` L${x0 + c.L * sx + 100},${yc + dir * (y + slope * 100 / sx) * sy}`; }
  s += `<path d="${p}" fill="none" stroke="#2e7d32" stroke-width="2.5"/><circle cx="20" cy="${yc}" r="5" fill="#2e7d32"/>`;
  s += `<text class="s" x="${x0}" y="${yc + half * sy + 34}" style="fill:var(--muted)">panjang pelat ${fmt(c.L * 100, 1)} cm, jarak pelat ${fmt(c.d * 1000, 0)} mm (skala tegak diperbesar)</text>`;
  svg.innerHTML = s;
  $('read').innerHTML = `<div><span>Kuat medan E = V/d</span><b>${sci(E)} N/C</b></div><div><span>Percepatan a = qE/m</span><b>${sci(a)} m/s²</b></div><div><span>Waktu di antara pelat t = L/v</span><b>${sci(t)} s</b></div><div><span>Simpangan y = ½at²</span><b>${hit ? 'menabrak pelat' : sci(y * 1000) + ' mm'}</b></div>`;
}
['v', 'q', 'u'].forEach(i => $(i).oninput = draw);
draw();
</script>
</body>
</html>
