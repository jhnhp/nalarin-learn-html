<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hambatan Kawat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}
select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 240" role="img" aria-label="Kawat penghantar dengan panjang dan luas penampang tertentu"></svg></div>
  <div class="panel">
    <div class="lab">Bahan kawat</div><select id="mat"><option value="1.6e-8,0.0038,#b0bec5">perak</option><option value="1.7e-8,0.0039,#e07b39" selected>tembaga</option><option value="2.8e-8,0.0039,#cfd8dc">aluminium</option><option value="5.6e-8,0.0045,#90a4ae">tungsten</option><option value="1.0e-7,0.005,#8d6e63">besi</option><option value="1.1e-6,0.0004,#a1887f">nikrom</option></select>
    <div class="lab">Panjang L <b id="lv"></b></div><input type="range" id="l" min="1" max="100" step="1" value="20">
    <div class="lab">Diameter kawat <b id="dv"></b></div><input type="range" id="d" min="0.1" max="3" step="0.1" value="0.8">
    <div class="lab">Suhu kawat <b id="tv"></b></div><input type="range" id="t" min="0" max="300" step="10" value="20">
    <div class="read" id="read"></div>
    <p class="note">R = ρL/A. Hambatan jenis logam naik bila suhu naik: R = R₀(1 + αΔT), dengan R₀ pada 20 °C.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const sci = v => { if(v === 0) return '0'; const e = Math.floor(Math.log10(Math.abs(v))); if(e >= -2 && e <= 3) return fmt(v, 3); return `${fmt(v / 10 ** e, 3)} × 10${String(e).replace('-', '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d])}`; };
function draw(){
  const [rho, alpha, col] = $('mat').value.split(','), r0 = +rho, a = +alpha, L = +$('l').value, dmm = +$('d').value, T = +$('t').value;
  $('lv').textContent = L + ' m'; $('dv').textContent = fmt(dmm, 1) + ' mm'; $('tv').textContent = T + ' °C';
  const A = Math.PI * (dmm / 2000) ** 2, R20 = r0 * L / A, R = R20 * (1 + a * (T - 20));
  const len = 60 + 3.6 * L, th = 4 + 14 * dmm, y = 110;
  const glow = Math.min(1, Math.max(0, (T - 120) / 180));
  let s = `<rect x="40" y="${y - th / 2}" width="${len}" height="${th}" rx="${th / 2}" fill="${col}" stroke="#555"/>`;
  if(glow > 0) s += `<rect x="40" y="${y - th / 2}" width="${len}" height="${th}" rx="${th / 2}" fill="#ff5722" fill-opacity="${glow * .7}"/>`;
  s += `<ellipse cx="${40 + len}" cy="${y}" rx="${Math.max(2, th / 4)}" ry="${th / 2}" fill="#fff" stroke="#555"/><text class="s" x="${40 + len + 10}" y="${y + 4}" style="fill:var(--muted)">A = πd²/4</text>`;
  s += `<line x1="40" y1="${y + th / 2 + 18}" x2="${40 + len}" y2="${y + th / 2 + 18}" stroke="#555" marker-start="url(#a)" marker-end="url(#a)"/><text class="s" x="${40 + len / 2}" y="${y + th / 2 + 32}" text-anchor="middle" style="fill:var(--ink)">L = ${L} m</text>`;
  s += `<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#555"/></marker></defs>`;
  svg.innerHTML = s;
  $('read').innerHTML = `<div><span>Hambatan jenis ρ (20 °C)</span><b>${sci(r0)} Ω m</b></div><div><span>Luas penampang A</span><b>${sci(A * 1e6)} mm²</b></div><div><span>Hambatan pada 20 °C</span><b>${sci(R20)} Ω</b></div><div><span>Hambatan pada ${T} °C</span><b>${sci(R)} Ω</b></div>`;
}
['mat', 'l', 'd', 't'].forEach(i => $(i).oninput = draw);
draw();
</script>
</body>
</html>
