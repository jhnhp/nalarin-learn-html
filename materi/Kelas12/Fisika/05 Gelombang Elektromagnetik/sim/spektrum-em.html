<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spektrum Elektromagnetik</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 260" role="img" aria-label="Spektrum elektromagnetik dari gelombang radio sampai sinar gamma"></svg></div>
  <div class="panel">
    <div class="lab">Panjang gelombang (geser) <b id="lv"></b></div><input type="range" id="l" min="-3" max="13" step="0.05" value="6.3">
    <div class="read" id="read"></div>
    <p class="note" id="ket" style="color:var(--ink)"></p>
    <p class="note">Semua gelombang elektromagnetik merambat di vakum dengan laju c = 3 × 10⁸ m/s; yang berbeda adalah frekuensi dan panjang gelombangnya (c = λf). Energi tiap foton E = hf: makin tinggi frekuensi, makin besar energinya.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const BANDS = [
  [-13, -11, 'sinar gamma', '#7b1fa2', 'Dihasilkan inti atom radioaktif dan radiasi kosmik. Energinya sangat tinggi dan mengionisasi sel. Dipakai untuk radioterapi kanker, sterilisasi alat medis, dan pengawetan makanan.'],
  [-11, -8, 'sinar-X', '#5e35b1', 'Dihasilkan ketika elektron berkecepatan tinggi diperlambat tiba-tiba saat menumbuk logam. Menembus jaringan lunak tetapi diserap tulang: foto rontgen, CT scan, pemeriksaan bagasi bandara.'],
  [-8, -6.6, 'ultraviolet', '#3949ab', 'Banyak pada sinar Matahari. UV-A (320–400 nm) membantu pembentukan vitamin D; UV-B (280–320 nm) dapat merusak sel kulit dan mata bila berlebihan. Dipakai untuk sterilisasi ruang operasi dan air.'],
  [-6.6, -6.12, 'cahaya tampak', '#43a047', 'Satu-satunya bagian yang terlihat mata: ungu (± 400 nm) sampai merah (± 750 nm). Cahaya putih Matahari bersifat polikromatik: dapat diuraikan prisma menjadi warna-warna.'],
  [-6.12, -3, 'inframerah', '#e53935', 'Dipancarkan semua benda bersuhu di atas 0 K, terasa sebagai panas. Dipakai pada termometer tembak, remote TV, kamera malam, dan penginderaan satelit.'],
  [-3, -1, 'gelombang mikro', '#fb8c00', 'Dipakai pada oven microwave (menggetarkan molekul air), radar, komunikasi satelit, Wi-Fi, dan telepon seluler.'],
  [-1, 3, 'gelombang radio', '#8d6e63', 'Frekuensi terendah: siaran radio AM dan FM, televisi, komunikasi, serta teleskop radio.']
];
const h = 6.63e-34, c = 3e8;
const sci = v => { if(v === 0) return '0'; const e = Math.floor(Math.log10(Math.abs(v))); if(e >= -2 && e <= 3) return fmt(v, 3); return `${fmt(v / 10 ** e, 2)} × 10${String(e).replace('-', '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d])}`; };
function rgb(nm){ let r = 0, g = 0, b = 0; if(nm < 440){ r = (440 - nm) / 60; b = 1; } else if(nm < 490){ g = (nm - 440) / 50; b = 1; } else if(nm < 510){ g = 1; b = (510 - nm) / 20; } else if(nm < 580){ r = (nm - 510) / 70; g = 1; } else if(nm < 645){ r = 1; g = (645 - nm) / 65; } else r = 1; return `rgb(${Math.round(255 * r)},${Math.round(255 * g)},${Math.round(255 * b)})`; }
function draw(){
  const L = -$('l').value, lam = 10 ** L, f = c / lam, E = h * f, eV = E / 1.6e-19;
  const X = l => 20 + (3 - l) / 16 * 440; // panjang gelombang besar di kiri
  let s = '';
  BANDS.forEach(([a, b, n, col]) => { const sh = {'sinar gamma': 'γ', 'sinar-X': 'sinar-X', 'ultraviolet': 'UV', 'cahaya tampak': '', 'inframerah': 'inframerah', 'gelombang mikro': 'mikro', 'gelombang radio': 'radio'}[n]; s += `<rect x="${X(b)}" y="60" width="${X(a) - X(b)}" height="60" fill="${col}" fill-opacity=".25" stroke="#fff"/><text class="s" x="${(X(a) + X(b)) / 2}" y="95" text-anchor="middle" style="fill:var(--ink)">${sh}</text>`; });
  for(let nm = 400; nm <= 750; nm += 5){ const l = Math.log10(nm * 1e-9); s += `<rect x="${X(l) - 1}" y="60" width="2.5" height="60" fill="${rgb(nm)}"/>`; }
  for(let e = 3; e >= -12; e -= 3) s += `<line x1="${X(e)}" y1="120" x2="${X(e)}" y2="126" stroke="#555"/><text class="s" x="${X(e)}" y="138" text-anchor="middle" style="fill:var(--muted)">10${String(e).replace('-', '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d])} m</text>`;
  s += `<text class="s" x="20" y="50" style="fill:var(--muted)">← panjang gelombang besar, frekuensi kecil</text><text class="s" x="460" y="50" text-anchor="end" style="fill:var(--muted)">frekuensi dan energi besar →</text>`;
  s += `<line x1="${X(L)}" y1="40" x2="${X(L)}" y2="140" stroke="#000" stroke-width="2"/><path d="M${X(L)},150 l-6,10 h12z" fill="#000"/>`;
  // gelombang ilustrasi
  const wl = Math.max(6, Math.min(140, 6 + (L + 13) * 8.4));
  let p = ''; for(let x = 0; x <= 440; x += 2) p += (x ? 'L' : 'M') + (20 + x) + ',' + (215 - 25 * Math.sin(2 * Math.PI * x / wl)).toFixed(1);
  s += `<path d="${p}" fill="none" stroke="#333" stroke-width="1.8"/><text class="s" x="20" y="252" style="fill:var(--muted)">ilustrasi: makin ke kanan, gelombang makin rapat (skala tidak sebenarnya)</text>`;
  svg.innerHTML = s;
  const band = BANDS.find(([a, b]) => L >= a && L < b) || BANDS[6];
  $('lv').textContent = sci(lam) + ' m';
  $('read').innerHTML = `<div><span>Jenis gelombang</span><b>${band[2]}${band[2] === 'cahaya tampak' ? ' (' + fmt(lam * 1e9, 0) + ' nm)' : ''}</b></div><div><span>Panjang gelombang λ</span><b>${sci(lam)} m</b></div><div><span>Frekuensi f = c/λ</span><b>${sci(f)} Hz</b></div><div><span>Energi foton E = hf</span><b>${sci(E)} J = ${sci(eV)} eV</b></div>`;
  $('ket').textContent = band[4];
}
$('l').oninput = draw;
draw();
</script>
</body>
</html>
