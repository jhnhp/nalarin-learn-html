<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sifat Koloid</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 300" role="img" aria-label="Percobaan sifat koloid"></svg></div>
  <div class="panel">
    <div class="seg" id="mode"><button data-m="t" class="on">Efek Tyndall dan penyaringan</button><button data-m="b">Gerak Brown</button><button data-m="e">Elektroforesis dan koagulasi</button></div>
    <div id="pt"><label class="chk"><input type="checkbox" id="sorot" checked> Sorotkan senter</label><label class="chk"><input type="checkbox" id="saring"> Saring dengan kertas saring</label><label class="chk"><input type="checkbox" id="diam"> Diamkan beberapa jam</label></div>
    <div id="pe" hidden><label class="chk"><input type="checkbox" id="arus"> Alirkan arus searah</label><div class="lab">Muatan partikel sol</div><div class="seg" id="mu"><button data-q="-1" class="on">Negatif (mis. sol As₂S₃)</button><button data-q="1">Positif (mis. sol Fe(OH)₃)</button></div><div class="row"><button class="btn" id="elek">Tambah elektrolit</button><button class="btn" id="ul">Ulangi</button></div></div>
    <div class="read" id="read"></div>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const $ = id => document.getElementById(id);
const svg = $('svg');
let M = 't', Q = -1, P = [], koag = 0, t = 0;
const seg = (id, key, cb) => $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); cb(b.dataset[key]); init(); });
seg('mode', 'm', v => { M = v; $('pt').hidden = M !== 't'; $('pe').hidden = M !== 'e'; });
seg('mu', 'q', v => Q = +v);
$('elek').onclick = () => { koag = Math.min(1, koag + 0.34); };
$('ul').onclick = () => { koag = 0; init(); };
['sorot', 'saring', 'diam', 'arus'].forEach(i => $(i).oninput = () => draw());
function init(){
  P = []; t = 0;
  if(M === 'b') for(let i = 0; i < 14; i++) P.push({x: 60 + Math.random() * 360, y: 50 + Math.random() * 200, tr: []});
  if(M === 'e') for(let i = 0; i < 60; i++) P.push({x: 140 + Math.random() * 200, y: 120 + Math.random() * 130, vx: 0, vy: 0, r: 3});
  draw();
}
function gelas(x, lab, kind){
  const sor = $('sorot').checked, sar = $('saring').checked, dm = $('diam').checked;
  let s = `<path d="M${x},70 v150 q0,12 12,12 h86 q12,0 12,-12 v-150" fill="none" stroke="#90a4ae" stroke-width="2.5"/>`;
  const fill = kind === 'l' ? '#e3f2fd' : kind === 'k' ? '#f5f5f5' : '#d7ccc8';
  const clear = sar && kind === 's';
  s += `<rect x="${x + 2}" y="100" width="106" height="130" rx="10" fill="${clear ? '#e3f2fd' : fill}" fill-opacity="${kind === 'l' ? .5 : .85}"/>`;
  if(kind === 's' && !sar){ if(dm) s += `<rect x="${x + 4}" y="212" width="102" height="18" rx="6" fill="#8d6e63"/>`; else for(let i = 0; i < 40; i++) s += `<circle cx="${x + 10 + (i * 29) % 92}" cy="${110 + (i * 53) % 115}" r="2.5" fill="#8d6e63"/>`; }
  if(kind === 'k') for(let i = 0; i < 70; i++) s += `<circle cx="${x + 8 + (i * 17) % 96}" cy="${105 + (i * 41) % 120}" r="1.2" fill="#bdbdbd"/>`;
  if(sor){
    s += `<line x1="0" y1="160" x2="${x}" y2="160" stroke="#fdd835" stroke-width="10" stroke-opacity=".7"/>`;
    if(kind === 'k' || (kind === 's' && !sar && !dm)) s += `<rect x="${x + 2}" y="153" width="106" height="14" fill="#fff59d" fill-opacity="${kind === 'k' ? .95 : .5}"/>`;
  }
  return s + `<text class="c" x="${x + 55}" y="255" text-anchor="middle" style="fill:var(--ink)">${lab}</text>`;
}
function draw(){
  let s = '', html = '';
  if(M === 't'){
    s += gelas(20, 'larutan garam', 'l') + gelas(180, 'susu encer (koloid)', 'k') + gelas(340, 'air + pasir halus', 's');
    s += `<text class="s" x="75" y="275" text-anchor="middle" fill="#555">partikel &lt; 1 nm</text><text class="s" x="235" y="275" text-anchor="middle" fill="#555">1–100 nm</text><text class="s" x="395" y="275" text-anchor="middle" fill="#555">&gt; 100 nm</text>`;
    if($('sorot').checked) s += `<text class="s" x="240" y="40" text-anchor="middle" fill="#555">berkas cahaya hanya tampak di dalam campuran yang menghamburkan cahaya</text>`;
    html = `<div><span>Larutan</span><b>jernih, homogen, stabil, lolos saringan, tidak menghamburkan cahaya</b></div><div><span>Koloid</span><b>tampak keruh, stabil, lolos kertas saring, berkas cahaya terlihat (efek Tyndall)</b></div><div><span>Suspensi</span><b>keruh, memisah jika didiamkan, tertahan kertas saring</b></div>`;
  } else if(M === 'b'){
    s += `<rect x="40" y="30" width="400" height="240" rx="14" fill="#e3f2fd" fill-opacity=".4" stroke="#90a4ae"/>`;
    for(let k = 0; k < 220; k++) s += `<circle cx="${45 + (k * 97 + t * 13 * (k % 7 - 3)) % 390}" cy="${35 + (k * 53 + t * 11 * (k % 5 - 2)) % 230}" r="1.3" fill="#90caf9"/>`;
    P.forEach(p => { s += `<polyline points="${p.tr.map(q => q.join(',')).join(' ')}" fill="none" stroke="#ef9a9a" stroke-width="1"/><circle cx="${p.x}" cy="${p.y}" r="6" fill="#e53935"/>`; });
    s += `<text class="s" x="50" y="290" fill="#555">merah: partikel koloid (jejaknya zig-zag); biru: molekul medium yang menumbuknya dari segala arah</text>`;
    html = `<div><span>Penyebab</span><b>tumbukan molekul medium yang tidak seimbang dari segala arah</b></div><div><span>Akibat</span><b>partikel koloid tidak mudah mengendap, sehingga koloid stabil</b></div>`;
  } else {
    const on = $('arus').checked;
    s += `<path d="M120,70 v170 q0,12 12,12 h216 q12,0 12,-12 v-170" fill="none" stroke="#90a4ae" stroke-width="2.5"/><rect x="122" y="110" width="236" height="140" rx="10" fill="#fff8e1" fill-opacity=".8"/>`;
    s += `<rect x="128" y="60" width="10" height="170" fill="#78909c"/><rect x="342" y="60" width="10" height="170" fill="#78909c"/><text class="c" x="133" y="52" text-anchor="middle" fill="#1565c0">katode (−)</text><text class="c" x="347" y="52" text-anchor="middle" fill="#c62828">anode (+)</text>`;
    if(on) s += `<line x1="133" y1="40" x2="133" y2="20" stroke="#555" stroke-width="2"/><line x1="347" y1="40" x2="347" y2="20" stroke="#555" stroke-width="2"/><line x1="133" y1="20" x2="225" y2="20" stroke="#555" stroke-width="2"/><line x1="255" y1="20" x2="347" y2="20" stroke="#555" stroke-width="2"/><line x1="225" y1="10" x2="225" y2="30" stroke="#555" stroke-width="3"/><line x1="255" y1="14" x2="255" y2="26" stroke="#555" stroke-width="3"/>`;
    P.forEach(p => s += `<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="${Q < 0 ? '#1e88e5' : '#e53935'}"/>`);
    html = `<div><span>Muatan partikel</span><b>${Q < 0 ? 'negatif → bergerak ke anode (+)' : 'positif → bergerak ke katode (−)'}</b></div><div><span>Elektrolit</span><b>${koag > 0 ? 'ion berlawanan muatan menetralkan partikel → partikel bergabung dan mengendap (koagulasi)' : 'belum ditambahkan'}</b></div>`;
  }
  svg.innerHTML = s; $('read').innerHTML = html;
}
function step(){
  t++;
  if(M === 'b') P.forEach(p => { p.x = Math.max(50, Math.min(430, p.x + (Math.random() - .5) * 10)); p.y = Math.max(40, Math.min(260, p.y + (Math.random() - .5) * 10)); p.tr.push([p.x, p.y]); if(p.tr.length > 60) p.tr.shift(); });
  if(M === 'e'){
    const on = $('arus').checked;
    P.forEach((p, i) => {
      p.vx = (Math.random() - .5) * 2 + (on ? -Q * 1.2 : 0); p.vy = (Math.random() - .5) * 2 + koag * 1.5;
      p.r = 3 + koag * 3;
      p.x = Math.max(142, Math.min(338, p.x + p.vx)); p.y = Math.max(115, Math.min(244, p.y + p.vy));
    });
  }
  if(M !== 't') draw();
}
setInterval(step, 70);
init();
</script>
</body>
</html>
