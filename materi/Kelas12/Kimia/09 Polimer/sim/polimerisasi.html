<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polimerisasi Adisi dan Kondensasi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10px}
select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 320" role="img" aria-label="Monomer bergabung membentuk rantai polimer"></svg></div>
  <div class="panel">
    <div class="lab">Monomer</div>
    <select id="m">
      <option value="0">propena → polipropilena (adisi)</option>
      <option value="1">tetrafluoroetena → teflon (adisi)</option>
      <option value="2">stirena → polistirena (adisi)</option>
      <option value="3" selected>metil metakrilat → PMMA/akrilik (adisi)</option>
      <option value="4">etilen glikol + asam tereftalat → PET (kondensasi)</option>
      <option value="5">heksametilendiamina + asam adipat → nilon-6,6 (kondensasi)</option>
      <option value="6">glukosa → pati/selulosa (kondensasi, alam)</option>
    </select>
    <div class="row"><button class="btn primary" id="go">Tambah monomer</button><button class="btn" id="rs">Ulangi</button></div>
    <div class="lab">Derajat polimerisasi n <b id="nv"></b></div><input type="range" id="n" min="100" max="5000" step="100" value="1500">
    <div class="read" id="read"></div>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
// [nama polimer, jenis, monomer label(s), warna, unit ulang (teks), Mr unit, hasil samping, kegunaan, Mr monomer]
const P = [
  ['polipropilena (PP)', 'adisi', ['CH₂=CH–CH₃'], ['#42a5f5'], '–[CH₂–CH(CH₃)]ₙ–', 42, '', 'wadah makanan, tali, karpet', 42],
  ['politetrafluoroetilena (PTFE, teflon)', 'adisi', ['CF₂=CF₂'], ['#66bb6a'], '–[CF₂–CF₂]ₙ–', 100, '', 'lapisan antilengket, isolator kabel', 100],
  ['polistirena (PS)', 'adisi', ['CH₂=CH–C₆H₅'], ['#ffa726'], '–[CH₂–CH(C₆H₅)]ₙ–', 104, '', 'styrofoam, wadah sekali pakai, isolator', 104],
  ['polimetil metakrilat (PMMA)', 'adisi', ['CH₂=C(CH₃)COOCH₃'], ['#ab47bc'], '–[CH₂–C(CH₃)(COOCH₃)]ₙ–', 100, '', 'kaca akrilik, lensa, papan nama', 100],
  ['polietilen tereftalat (PET)', 'kondensasi', ['HO–CH₂CH₂–OH', 'HOOC–C₆H₄–COOH'], ['#26a69a', '#ef5350'], '–[O–CH₂CH₂–O–CO–C₆H₄–CO]ₙ–', 192, 'H₂O', 'botol minuman, serat poliester', 0],
  ['nilon-6,6', 'kondensasi', ['H₂N–(CH₂)₆–NH₂', 'HOOC–(CH₂)₄–COOH'], ['#5c6bc0', '#ec407a'], '–[NH–(CH₂)₆–NH–CO–(CH₂)₄–CO]ₙ–', 226, 'H₂O', 'serat tekstil, tali, sikat gigi', 0],
  ['pati / selulosa', 'kondensasi', ['C₆H₁₂O₆'], ['#8d6e63'], '–[C₆H₁₀O₅]ₙ–', 162, 'H₂O', 'cadangan makanan (pati), dinding sel (selulosa)', 180],
];
let k = 0, chain = [], waters = 0;
function reset(){ chain = []; waters = 0; draw(); }
$('m').oninput = reset; $('rs').onclick = reset; $('n').oninput = draw;
$('go').onclick = () => { const p = P[+$('m').value]; if(chain.length >= 12) return; chain.push(p[2].length === 2 ? chain.length % 2 : 0); if(p[1] === 'kondensasi' && chain.length > 1) waters++; draw(); };
function draw(){
  const p = P[+$('m').value], n = +$('n').value;
  $('nv').textContent = n.toLocaleString('id-ID');
  let s = `<text class="c" x="20" y="26" style="fill:var(--ink)">Monomer: ${p[2].join('  +  ')}</text>`;
  // monomer bebas
  for(let i = 0; i < 6; i++){ const t = p[2].length === 2 ? i % 2 : 0; s += `<circle cx="${40 + i * 30}" cy="60" r="10" fill="${p[3][t]}"/>${p[1] === 'adisi' ? `<line x1="${34 + i * 30}" y1="60" x2="${46 + i * 30}" y2="60" stroke="#fff" stroke-width="2"/><line x1="${34 + i * 30}" y1="64" x2="${46 + i * 30}" y2="64" stroke="#fff" stroke-width="2"/>` : ''}`; }
  s += `<text class="s" x="230" y="64" fill="#555">${p[1] === 'adisi' ? 'garis putih ganda: ikatan rangkap C=C' : 'dua gugus fungsi di tiap ujung monomer'}</text>`;
  // rantai
  const y = 150;
  if(p[1] === 'adisi' && chain.length) s += `<rect x="12" y="${y - 12}" width="18" height="24" rx="4" fill="#e53935"/><text class="s" x="21" y="${y + 4}" text-anchor="middle" fill="#fff">I</text>`;
  chain.forEach((t, i) => {
    const x = 50 + i * 34;
    if(i || p[1] === 'adisi') s += `<line x1="${x - (i ? 34 : 20) + 10}" y1="${y}" x2="${x - 10}" y2="${y}" stroke="#333" stroke-width="3"/>`;
    s += `<circle cx="${x}" cy="${y}" r="13" fill="${p[3][t]}"/>`;
  });
  if(chain.length && p[1] === 'adisi') s += `<circle cx="${50 + (chain.length - 1) * 34 + 16}" cy="${y - 12}" r="5" fill="#fdd835" stroke="#f57f17"/><text class="s" x="${50 + (chain.length - 1) * 34 + 26}" y="${y - 18}" fill="#f57f17">ujung aktif</text>`;
  for(let w = 0; w < waters; w++) s += `<text class="c" x="${60 + w * 34}" y="${y + 44}" fill="#1e88e5">H₂O</text>`;
  if(waters) s += `<text class="s" x="20" y="${y + 66}" fill="#1e88e5">${waters} molekul air dilepaskan (hasil samping kondensasi)</text>`;
  const tahap = p[1] === 'adisi' ? (chain.length === 0 ? 'belum dimulai' : chain.length === 1 ? 'inisiasi: inisiator (I) mengaktifkan monomer pertama' : chain.length < 12 ? 'propagasi: monomer ditambahkan satu per satu pada ujung aktif' : 'terminasi: ujung aktif dinonaktifkan, rantai berhenti tumbuh') : 'gugus fungsi monomer bereaksi dan melepaskan molekul kecil';
  s += `<text class="c" x="20" y="250" style="fill:var(--ink)">Unit ulang: ${p[4]}</text><text class="s" x="20" y="272" fill="#555">${tahap}</text><text class="s" x="20" y="296" fill="#555">kegunaan: ${p[7]}</text>`;
  svg.innerHTML = s;
  $('read').innerHTML = `<div><span>Polimer</span><b>${p[0]}</b></div><div><span>Jenis polimerisasi</span><b>${p[1]}${p[6] ? ' (melepas ' + p[6] + ')' : ' (tanpa hasil samping)'}</b></div><div><span>Mr unit ulang</span><b>${p[5]}</b></div><div><span>Mr polimer ≈ n × Mr unit</span><b>${(n * p[5]).toLocaleString('id-ID')}</b></div>`;
}
reset();
</script>
</body>
</html>
