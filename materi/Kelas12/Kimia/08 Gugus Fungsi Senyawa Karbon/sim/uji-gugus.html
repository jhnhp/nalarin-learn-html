<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uji Gugus Fungsi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:11.5px}.s{font-family:var(--display);font-weight:700;font-size:10px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 330" role="img" aria-label="Rak tabung reaksi berisi sampel yang diuji dengan pereaksi"></svg></div>
  <div class="panel">
    <div class="lab">Pereaksi uji</div>
    <div class="seg" id="r"><button data-r="tollens" class="on">Tollens</button><button data-r="fehling">Fehling</button><button data-r="kmno4">KMnO₄ asam</button><button data-r="na">Logam Na</button><button data-r="lakmus">Lakmus biru</button><button data-r="nahco3">NaHCO₃</button></div>
    <div class="read" id="read"></div>
    <p class="note">Klik tabung untuk melihat penjelasan reaksinya. Uji dengan Tollens dan Fehling dilakukan sambil dipanaskan dalam penangas air.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const $ = id => document.getElementById(id);
const svg = $('svg');
// sampel: [nama, rumus, golongan]
const S = [['etanol', 'CH₃CH₂OH', 'alkohol primer'], ['2-propanol', 'CH₃CH(OH)CH₃', 'alkohol sekunder'], ['2-metil-2-propanol', '(CH₃)₃COH', 'alkohol tersier'], ['dietil eter', 'C₂H₅OC₂H₅', 'eter'], ['etanal', 'CH₃CHO', 'aldehida'], ['propanon', 'CH₃COCH₃', 'keton'], ['asam etanoat', 'CH₃COOH', 'asam karboksilat'], ['etil etanoat', 'CH₃COOC₂H₅', 'ester']];
// hasil per pereaksi: [warna cairan, endapan/efek, teks singkat, penjelasan]
const R = {
  tollens: {base: '#eceff1', f: i => i === 4 ? ['#9e9e9e', 'cermin', 'cermin perak', 'Aldehida mereduksi Ag⁺ menjadi logam Ag yang melapisi dinding tabung: CH₃CHO + 2Ag(NH₃)₂⁺ + 3OH⁻ → CH₃COO⁻ + 2Ag + 4NH₃ + 2H₂O.'] : null, no: 'tidak ada cermin perak'},
  fehling: {base: '#42a5f5', f: i => i === 4 ? ['#42a5f5', 'endapan', 'endapan merah bata', 'Aldehida mereduksi Cu²⁺ (biru) menjadi Cu₂O (endapan merah bata).'] : null, no: 'tetap biru'},
  kmno4: {base: '#ab47bc', f: i => [0, 1, 4].includes(i) ? ['#f3e5f5', 'pudar', 'ungu memudar', ['Alkohol primer dioksidasi menjadi aldehida lalu asam karboksilat (etanol → etanal → asam etanoat).', 'Alkohol sekunder dioksidasi menjadi keton (2-propanol → propanon).', '', '', 'Aldehida dioksidasi menjadi asam karboksilat.'][i]] : null, no: 'tetap ungu (tidak teroksidasi)'},
  na: {base: '#eceff1', f: i => [0, 1, 2, 6].includes(i) ? ['#eceff1', 'gas', 'gelembung gas H₂', i === 6 ? 'Asam karboksilat bereaksi dengan Na menghasilkan garam dan H₂.' : 'Alkohol bereaksi dengan Na: 2ROH + 2Na → 2RONa + H₂. Ini membedakan alkohol dari eter yang isomer dengannya.'] : null, no: 'tidak ada gelembung'},
  lakmus: {base: '#eceff1', f: i => i === 6 ? ['#eceff1', 'merah', 'lakmus biru → merah', 'Asam karboksilat melepas H⁺ dalam air, sehingga bersifat asam.'] : null, no: 'lakmus tetap biru'},
  nahco3: {base: '#eceff1', f: i => i === 6 ? ['#eceff1', 'gas', 'gelembung CO₂', 'CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂. Alkohol tidak cukup asam untuk bereaksi dengan NaHCO₃.'] : null, no: 'tidak ada gelembung'},
};
let P = 'tollens', sel = 4, t = 0;
$('r').querySelectorAll('button').forEach(b => b.onclick = () => { $('r').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); P = b.dataset.r; draw(); });
function draw(){
  const r = R[P];
  let s = `<rect x="10" y="230" width="460" height="14" rx="3" fill="#8d6e63"/>`;
  S.forEach((sm, i) => {
    const x = 24 + i * 57, res = r.f(i), col = res ? res[0] : r.base, on = i === sel;
    s += `<g data-i="${i}" style="cursor:pointer"><rect x="${x - 4}" y="40" width="48" height="196" fill="transparent"/>`;
    s += `<path d="M${x},60 v150 a20,20 0 0,0 40,0 v-150" fill="#fff" fill-opacity=".6" stroke="${on ? '#1565c0' : '#90a4ae'}" stroke-width="${on ? 3 : 2}"/>`;
    s += `<path d="M${x + 2},140 v70 a18,18 0 0,0 36,0 v-70 z" fill="${col}" fill-opacity="${P === 'kmno4' && !res ? .8 : .6}"/>`;
    if(P === 'lakmus') s += `<rect x="${x + 15}" y="100" width="10" height="70" fill="${res ? '#e53935' : '#1e88e5'}"/>`;
    if(res && res[1] === 'cermin') s += `<path d="M${x + 2},130 v80 a18,18 0 0,0 36,0 v-80" fill="none" stroke="#bdbdbd" stroke-width="5"/>`;
    if(res && res[1] === 'endapan') s += `<ellipse cx="${x + 20}" cy="222" rx="15" ry="7" fill="#bf360c"/>`;
    if(res && res[1] === 'gas') for(let k = 0; k < 5; k++) s += `<circle cx="${x + 12 + (k * 7) % 18}" cy="${215 - ((t * 3 + k * 15) % 70)}" r="2.5" fill="none" stroke="#546e7a"/>`;
    const LB = [['etanol', ''], ['2-', 'propanol'], ['2-metil-2-', 'propanol'], ['dietil', 'eter'], ['etanal', ''], ['propanon', ''], ['asam', 'etanoat'], ['etil', 'etanoat']][i];
    s += `<text class="c" x="${x + 20}" y="262" text-anchor="middle" style="fill:var(--ink)">${LB[0]}</text><text class="c" x="${x + 20}" y="276" text-anchor="middle" style="fill:var(--ink)">${LB[1]}</text>`;
    s += `<text class="s" x="${x + 20}" y="300" text-anchor="middle" fill="${res ? '#2e7d32' : '#9e9e9e'}">${res ? '+' : '−'}</text></g>`;
  });
  s += `<text class="c" x="240" y="24" text-anchor="middle" style="fill:var(--ink)">Pereaksi: ${{tollens: 'Tollens [Ag(NH₃)₂]⁺', fehling: 'Fehling (Cu²⁺ biru)', kmno4: 'KMnO₄ + H₂SO₄ (ungu)', na: 'logam natrium', lakmus: 'kertas lakmus biru', nahco3: 'larutan NaHCO₃'}[P]}</text>`;
  s += `<text class="s" x="240" y="320" text-anchor="middle" fill="#555">+ = hasil positif, − = negatif</text>`;
  svg.innerHTML = s;
  svg.querySelectorAll('g[data-i]').forEach(g => g.onclick = () => { sel = +g.dataset.i; draw(); });
  const sm = S[sel], res = r.f(sel);
  $('read').innerHTML = `<div><span>Sampel</span><b>${sm[0]} (${sm[1]})</b></div><div><span>Golongan</span><b>${sm[2]}</b></div><div><span>Pengamatan</span><b>${res ? res[2] : r.no}</b></div>${res ? `<div><span>Penjelasan</span><b style="font-weight:600">${res[3]}</b></div>` : ''}`;
}
setInterval(() => { t++; if(['na', 'nahco3'].includes(P)) draw(); }, 80);
draw();
</script>
</body>
</html>
