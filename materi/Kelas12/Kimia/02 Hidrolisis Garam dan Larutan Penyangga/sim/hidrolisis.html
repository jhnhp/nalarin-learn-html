<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidrolisis Garam</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12.5px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}
select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 300" role="img" aria-label="Ion-ion garam dan reaksinya dengan air"></svg></div>
  <div class="panel">
    <div class="lab">Kation (dari basa)</div><select id="k"><option value="Na">Na⁺ (dari NaOH, basa kuat)</option><option value="K">K⁺ (dari KOH, basa kuat)</option><option value="NH4">NH₄⁺ (dari NH₃, Kb = 1,8 × 10⁻⁵)</option></select>
    <div class="lab">Anion (dari asam)</div><select id="a"><option value="Cl">Cl⁻ (dari HCl, asam kuat)</option><option value="NO3">NO₃⁻ (dari HNO₃, asam kuat)</option><option value="Ac" selected>CH₃COO⁻ (dari CH₃COOH, Ka = 1,8 × 10⁻⁵)</option><option value="F">F⁻ (dari HF, Ka = 6,6 × 10⁻⁴)</option><option value="CN">CN⁻ (dari HCN, Ka = 4,9 × 10⁻¹⁰)</option></select>
    <div class="lab">Konsentrasi garam <b id="cv"></b></div><input type="range" id="c" min="-3" max="0" step="0.05" value="-0.7">
    <div class="read" id="read"></div>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const KAT = {Na: {f: 'Na⁺', b: 'NaOH', Kb: 0}, K: {f: 'K⁺', b: 'KOH', Kb: 0}, NH4: {f: 'NH₄⁺', b: 'NH₃', Kb: 1.8e-5, h: 'NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺'}};
const ANI = {Cl: {f: 'Cl⁻', a: 'HCl', Ka: 0}, NO3: {f: 'NO₃⁻', a: 'HNO₃', Ka: 0}, Ac: {f: 'CH₃COO⁻', a: 'CH₃COOH', Ka: 1.8e-5, h: 'CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻'}, F: {f: 'F⁻', a: 'HF', Ka: 6.6e-4, h: 'F⁻ + H₂O ⇌ HF + OH⁻'}, CN: {f: 'CN⁻', a: 'HCN', Ka: 4.9e-10, h: 'CN⁻ + H₂O ⇌ HCN + OH⁻'}};
const sup = n => String(n).replace('-', '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
const sci = v => { const e = Math.floor(Math.log10(v) + 1e-9), m = v / 10 ** e; return Math.abs(m - 1) < 0.005 ? `10${sup(e)}` : `${fmt(m, 2)} × 10${sup(e)}`; };
const Kw = 1e-14;
function draw(){
  const k = KAT[$('k').value], a = ANI[$('a').value], C = 10 ** +$('c').value;
  $('cv').textContent = fmt(C, 3) + ' M';
  let H, jenis, sifat, rumus;
  if(!k.Kb && !a.Ka){ H = 1e-7; jenis = 'tidak terhidrolisis'; sifat = 'netral'; rumus = 'pH = 7'; }
  else if(!k.Kb){ const OH = Math.sqrt(Kw / a.Ka * C); H = Kw / OH; jenis = 'hidrolisis sebagian (anion)'; sifat = 'basa'; rumus = '[OH⁻] = √(Kw/Ka × [garam])'; }
  else if(!a.Ka){ H = Math.sqrt(Kw / k.Kb * C); jenis = 'hidrolisis sebagian (kation)'; sifat = 'asam'; rumus = '[H⁺] = √(Kw/Kb × [garam])'; }
  else { H = Math.sqrt(Kw * a.Ka / k.Kb); jenis = 'hidrolisis total'; sifat = a.Ka > k.Kb ? 'asam (Ka > Kb)' : a.Ka < k.Kb ? 'basa (Kb > Ka)' : 'netral (Ka = Kb)'; rumus = '[H⁺] = √(Kw × Ka/Kb), tidak bergantung konsentrasi'; }
  const pH = -Math.log10(H);
  const salt = (k.f.replace('⁺', '') + a.f.replace('⁻', '')).replace('NH₄CH₃COO', 'CH₃COONH₄').replace('NaCH₃COO', 'CH₃COONa').replace('KCH₃COO', 'CH₃COOK');
  let s = `<text class="c" x="20" y="28" style="fill:var(--ink)">${salt}(aq) → ${k.f}(aq) + ${a.f}(aq)</text>`;
  const row = (y, ion, info, h, col) => {
    let t = `<rect x="20" y="${y}" width="440" height="78" rx="10" fill="${h ? col : '#eceff1'}" fill-opacity="${h ? .15 : .5}" stroke="${h ? col : '#cfd8dc'}"/>`;
    t += `<circle cx="58" cy="${y + 39}" r="24" fill="${h ? col : '#b0bec5'}"/><text class="c" x="58" y="${y + 44}" text-anchor="middle" fill="#fff" style="font-size:${ion.length > 4 ? 9 : 12.5}px">${ion}</text>`;
    t += `<text class="s" x="95" y="${y + 30}" style="fill:var(--ink)">${info}</text><text class="c" x="95" y="${y + 54}" fill="${h ? col : '#78909c'}">${h || 'tidak bereaksi dengan air (ion dari elektrolit kuat)'}</text>`;
    return t;
  };
  s += row(50, k.f, `kation dari ${k.b} ${k.Kb ? '(basa lemah)' : '(basa kuat)'}`, k.h, '#e53935');
  s += row(140, a.f, `anion dari ${a.a} ${a.Ka ? '(asam lemah)' : '(asam kuat)'}`, a.h, '#1e88e5');
  // skala pH
  const sx = 40, sw = 400, sy = 252;
  const uni = p => ['#c62828', '#e53935', '#f4511e', '#fb8c00', '#ffb300', '#fdd835', '#c0ca33', '#7cb342', '#43a047', '#00897b', '#00acc1', '#1e88e5', '#3949ab', '#5e35b1', '#6a1b9a'][Math.max(0, Math.min(14, Math.round(p)))];
  for(let p = 0; p < 14; p++) s += `<rect x="${sx + p * sw / 14}" y="${sy}" width="${sw / 14 + .5}" height="14" fill="${uni(p + .5)}"/>`;
  for(let p = 0; p <= 14; p += 1) s += `<text class="s" x="${sx + p * sw / 14}" y="${sy + 28}" text-anchor="middle" fill="#555">${p}</text>`;
  const px = sx + pH * sw / 14;
  s += `<path d="M${px},${sy - 2} l-6,-10 h12 z" fill="#333"/><text class="c" x="${px}" y="${sy - 15}" text-anchor="middle" style="fill:var(--ink)">pH ${fmt(pH, 2)}</text>`;
  svg.innerHTML = s;
  $('read').innerHTML = `<div><span>Jenis</span><b>${jenis}</b></div><div><span>Sifat larutan</span><b>${sifat}</b></div><div><span>Rumus</span><b style="font-weight:600">${rumus}</b></div><div><span>[H⁺]</span><b>${sci(H)} M</b></div><div><span>pH</span><b>${fmt(pH, 2)}</b></div>`;
}
['k', 'a', 'c'].forEach(i => $(i).oninput = draw);
draw();
</script>
</body>
</html>
