<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pH Larutan Asam dan Basa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}
select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 340" role="img" aria-label="Gelas berisi larutan dengan partikel terion dan skala pH"></svg></div>
  <div class="panel">
    <div class="lab">Zat terlarut</div>
    <select id="z">
      <option value="HCl,a,1,0">HCl (asam kuat, valensi 1)</option>
      <option value="H2SO4,a,2,0">H₂SO₄ (asam kuat, valensi 2)</option>
      <option value="CH3COOH,a,1,1.8e-5" selected>CH₃COOH (asam lemah, Ka = 1,8 × 10⁻⁵)</option>
      <option value="HF,a,1,6.6e-4">HF (asam lemah, Ka = 6,6 × 10⁻⁴)</option>
      <option value="HCN,a,1,4.9e-10">HCN (asam lemah, Ka = 4,9 × 10⁻¹⁰)</option>
      <option value="NaOH,b,1,0">NaOH (basa kuat, valensi 1)</option>
      <option value="Ca(OH)2,b,2,0">Ca(OH)₂ (basa kuat, valensi 2)</option>
      <option value="NH3,b,1,1.8e-5">NH₃ (basa lemah, Kb = 1,8 × 10⁻⁵)</option>
      <option value="CH3NH2,b,1,4.4e-4">CH₃NH₂ (basa lemah, Kb = 4,4 × 10⁻⁴)</option>
    </select>
    <div class="lab">Konsentrasi <b id="cv"></b></div><input type="range" id="c" min="-4" max="0" step="0.05" value="-1">
    <div class="read" id="read"></div>
    <p class="note">Asam/basa kuat terion sempurna: [H⁺] = valensi × M. Asam lemah: [H⁺] ≈ √(Ka · M), α = √(Ka/M). Basa lemah: [OH⁻] ≈ √(Kb · M). Pada 25 °C, [H⁺][OH⁻] = 10⁻¹⁴ dan pH + pOH = 14.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const sup = n => String(n).replace('-', '⁻').replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
const sci = v => { const e = Math.floor(Math.log10(v) + 1e-9), m = v / 10 ** e; return Math.abs(m - 1) < 0.005 ? `10${sup(e)}` : `${fmt(m, 2)} × 10${sup(e)}`; };
const uni = pH => { const st = ['#c62828', '#e53935', '#f4511e', '#fb8c00', '#ffb300', '#fdd835', '#c0ca33', '#7cb342', '#43a047', '#00897b', '#00acc1', '#1e88e5', '#3949ab', '#5e35b1', '#6a1b9a']; return st[Math.max(0, Math.min(14, Math.round(pH)))]; };
function calc(){
  const [nm, t, v, K] = $('z').value.split(','); const C = 10 ** +$('c').value, val = +v, k = +K;
  let x, alpha;
  if(k === 0){ x = val * C; alpha = 1; }
  else { x = (-k + Math.sqrt(k * k + 4 * k * C)) / 2; alpha = x / C; }
  const H = t === 'a' ? x : 1e-14 / x, OH = 1e-14 / H;
  return {nm, t, val, k, C, x, alpha, H, OH, pH: -Math.log10(H), approx: k ? Math.sqrt(k * C) : x};
}
function draw(){
  const r = calc(); $('cv').textContent = `${fmt(r.C, r.C < 0.01 ? 4 : 3)} M`;
  let s = '';
  // gelas
  const col = uni(r.pH);
  s += `<path d="M40,60 v220 q0,20 20,20 h160 q20,0 20,-20 v-220" fill="none" stroke="#90a4ae" stroke-width="3"/><rect x="42" y="110" width="196" height="188" rx="16" fill="${col}" fill-opacity=".22"/>`;
  // partikel: 30 molekul, sebagian terion
  const n = 30, ion = r.alpha > 0.004 ? Math.max(1, Math.round(n * Math.min(1, r.alpha))) : 0, nm = $('z').selectedOptions[0].text.split(' (')[0];
  for(let i = 0; i < n; i++){
    const x = 62 + (i % 6) * 32, y = 135 + Math.floor(i / 6) * 32;
    if(i < ion){ s += `<circle cx="${x - 7}" cy="${y}" r="7" fill="${r.t === 'a' ? '#e53935' : '#1e88e5'}"/><text class="s" x="${x - 7}" y="${y + 3.5}" text-anchor="middle" fill="#fff">${r.t === 'a' ? 'H⁺' : 'OH'}</text><circle cx="${x + 9}" cy="${y + 4}" r="6" fill="#9e9e9e"/>`; }
    else s += `<ellipse cx="${x}" cy="${y}" rx="12" ry="8" fill="#ffffff" stroke="#607d8b" stroke-width="1.5"/>`;
  }
  s += `<text class="s" x="140" y="325" text-anchor="middle" style="fill:var(--ink)">${nm}: ± ${fmt(r.alpha * n, r.alpha < .1 ? 1 : 0)} dari ${n} molekul terion</text>`;
  s += `<ellipse cx="270" cy="128" rx="10" ry="7" fill="#fff" stroke="#607d8b"/><text class="s" x="285" y="132" fill="#555">molekul utuh</text><circle cx="270" cy="150" r="6" fill="${r.t === 'a' ? '#e53935' : '#1e88e5'}"/><text class="s" x="285" y="154" fill="#555">${r.t === 'a' ? 'ion H⁺ (H₃O⁺)' : 'ion OH⁻'}</text><circle cx="270" cy="172" r="5" fill="#9e9e9e"/><text class="s" x="285" y="176" fill="#555">ion sisa</text>`;
  // skala pH
  const sx = 260, sw = 200, sy = 40;
  for(let p = 0; p < 14; p++) s += `<rect x="${sx + p * sw / 14}" y="${sy}" width="${sw / 14 + .5}" height="16" fill="${uni(p + .5)}"/>`;
  for(let p = 0; p <= 14; p += 2) s += `<text class="s" x="${sx + p * sw / 14}" y="${sy + 30}" text-anchor="middle" fill="#555">${p}</text>`;
  const px = sx + Math.max(0, Math.min(14, r.pH)) * sw / 14;
  s += `<path d="M${px},${sy - 2} l-6,-10 h12 z" fill="#333"/><text class="c" x="${px}" y="${sy - 16}" text-anchor="middle" style="fill:var(--ink)">pH ${fmt(r.pH, 2)}</text><text class="s" x="${sx}" y="${sy + 44}" fill="#c62828">asam</text><text class="s" x="${sx + sw / 2}" y="${sy + 44}" text-anchor="middle" fill="#43a047">netral</text><text class="s" x="${sx + sw}" y="${sy + 44}" text-anchor="end" fill="#5e35b1">basa</text>`;
  // indikator
  const ind = [['Lakmus merah', r.pH > 8.3 ? '#1e88e5' : '#e53935'], ['Lakmus biru', r.pH < 4.5 ? '#e53935' : '#1e88e5'], ['Fenolftalein', r.pH < 8.3 ? '#f5f5f5' : r.pH < 10 ? '#f8bbd0' : '#ec407a'], ['Metil jingga', r.pH < 3.1 ? '#e53935' : r.pH < 4.4 ? '#fb8c00' : '#fdd835'], ['Brom timol biru', r.pH < 6 ? '#fdd835' : r.pH < 7.6 ? '#7cb342' : '#1e88e5']];
  ind.forEach(([n2, c2], i) => { const y = 228 + i * 22; s += `<rect x="268" y="${y - 11}" width="26" height="15" rx="3" fill="${c2}" stroke="#90a4ae"/><text class="s" x="302" y="${y}" fill="#555">${n2}</text>`; });
  s += `<text class="s" x="268" y="208" style="fill:var(--ink)">Warna indikator:</text>`;
  svg.innerHTML = s;
  $('read').innerHTML = `<div><span>[H⁺]</span><b>${sci(r.H)} M</b></div><div><span>[OH⁻]</span><b>${sci(r.OH)} M</b></div><div><span>pH / pOH</span><b>${fmt(r.pH, 2)} / ${fmt(14 - r.pH, 2)}</b></div><div><span>Derajat ionisasi α</span><b>${r.k ? fmt(r.alpha * 100, 2) + '%' : '100% (terion sempurna)'}</b></div>${r.k ? `<div><span>Rumus pendekatan √(K·M)</span><b>${sci(r.approx)} M</b></div>` : ''}`;
}
['z', 'c'].forEach(i => $(i).oninput = draw);
draw();
</script>
</body>
</html>
