<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menyusun Peptida</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10px}.aa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.aa button{padding:8px 4px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:12.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 300" role="img" aria-label="Rantai peptida dengan ikatan peptida dan molekul air yang dilepaskan"></svg></div>
  <div class="panel">
    <div class="lab">Klik asam amino untuk ditambahkan (maksimal 6)</div>
    <div class="aa" id="aa"></div>
    <div class="row"><button class="btn" id="undo">Hapus terakhir</button><button class="btn" id="rs">Kosongkan</button></div>
    <div class="read" id="read"></div>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const $ = id => document.getElementById(id);
const svg = $('svg');
const A = [['Gly', 'glisin', 75, '–H', '#90a4ae'], ['Ala', 'alanin', 89, '–CH₃', '#66bb6a'], ['Ser', 'serin', 105, '–CH₂OH', '#42a5f5'], ['Cys', 'sistein', 121, '–CH₂SH', '#fdd835'], ['Val', 'valin', 117, '–CH(CH₃)₂', '#26a69a'], ['Phe', 'fenilalanin', 165, '–CH₂C₆H₅', '#ab47bc'], ['Lys', 'lisin', 146, '–(CH₂)₄NH₂', '#5c6bc0'], ['Glu', 'asam glutamat', 147, '–(CH₂)₂COOH', '#ef5350']];
let C = [0, 2];
A.forEach((a, i) => { const b = document.createElement('button'); b.innerHTML = `${a[0]}<br><span style="font-weight:600;font-size:11px">${a[2]}</span>`; b.style.borderColor = a[4]; b.onclick = () => { if(C.length < 6){ C.push(i); draw(); } }; $('aa').appendChild(b); });
$('undo').onclick = () => { C.pop(); draw(); };
$('rs').onclick = () => { C = []; draw(); };
function draw(){
  let s = '';
  const n = C.length, w = 74;
  C.forEach((k, i) => {
    const a = A[k], x = 34 + i * w;
    if(i) s += `<rect x="${x - w + 28}" y="92" width="${w - 36}" height="26" rx="6" fill="#fff3e0" stroke="#fb8c00"/><text class="s" x="${x - w / 2 + 10}" y="103" text-anchor="middle" fill="#e65100" style="font-size:8.5px">–CO–NH–</text><text class="s" x="${x - w / 2 + 10}" y="114" text-anchor="middle" fill="#e65100" style="font-size:8.5px">peptida</text><text class="c" x="${x - w / 2 + 10}" y="150" text-anchor="middle" fill="#1e88e5">− H₂O</text>`;
    s += `<circle cx="${x + 10}" cy="105" r="17" fill="${a[4]}"/><text class="c" x="${x + 10}" y="109" text-anchor="middle" fill="#fff">${a[0]}</text><text class="s" x="${x + 10}" y="76" text-anchor="middle" fill="#555">${a[3]}</text>`;
  });
  if(n){ s += `<text class="s" x="16" y="110" text-anchor="middle" fill="#2e7d32">H₂N–</text><text class="s" x="${34 + (n - 1) * w + 29}" y="110" fill="#c62828">–COOH</text>`; }
  s += `<text class="s" x="20" y="200" fill="#555">ujung N (gugus amina bebas) di kiri, ujung C (gugus karboksil bebas) di kanan</text>`;
  const sum = C.reduce((t, k) => t + A[k][2], 0), Mr = n ? sum - 18 * (n - 1) : 0;
  const nm = ['', 'asam amino tunggal', 'dipeptida', 'tripeptida', 'tetrapeptida', 'pentapeptida', 'heksapeptida'][n];
  s += `<text class="c" x="20" y="240" style="fill:var(--ink)">${n ? C.map(k => A[k][0]).join('–') : 'belum ada asam amino'}</text><text class="s" x="20" y="262" fill="#555">${n > 1 ? `${n} asam amino → ${n - 1} ikatan peptida → ${n - 1} molekul air dilepaskan` : ''}</text>`;
  svg.innerHTML = s;
  $('read').innerHTML = `<div><span>Jenis</span><b>${nm || '—'}</b></div><div><span>Jumlah Mr asam amino</span><b>${sum}</b></div><div><span>Air dilepaskan</span><b>${Math.max(0, n - 1)} × 18 = ${Math.max(0, n - 1) * 18}</b></div><div><span>Mr peptida</span><b>${Mr}</b></div>`;
}
draw();
</script>
</body>
</html>
