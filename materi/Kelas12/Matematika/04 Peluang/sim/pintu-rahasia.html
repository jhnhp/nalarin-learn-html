<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permainan Pintu Rahasia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.wrap{padding:14px 16px;display:grid;gap:12px}
.doors{display:flex;gap:12px;justify-content:center}
.door{width:110px;height:160px;border-radius:12px 12px 4px 4px;border:3px solid var(--line-2);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink);transition:.15s}
.door.pick{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 30%,transparent)}
.door.open{background:var(--surface);cursor:default}.door .ic{font-size:34px}
.msg{font-weight:700;padding:10px 12px;border-radius:10px;background:var(--surface-2);text-align:center}
.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:8px;font-size:14px}
.track{height:18px;border-radius:9px;background:var(--surface-2);overflow:hidden}.fill{height:100%;border-radius:9px}</style>
</head>
<body>
<div class="wrap">
  <div class="msg" id="msg">Langkah 1: pilih satu pintu.</div>
  <div class="doors" id="doors"></div>
  <div class="row" style="justify-content:center"><button class="btn" id="stay" disabled>Tetap</button><button class="btn" id="switch" disabled>Pindah</button><button class="btn" id="again">Main lagi</button></div>
  <div class="bars" id="bars"></div>
  <div class="row" style="justify-content:center"><button class="btn primary" id="sim100">Simulasikan 100 permainan</button><button class="btn" id="reset">Ulang statistik</button></div>
  <p class="note">Pembawa acara tahu letak hadiah dan selalu membuka pintu kosong yang tidak kamu pilih. Peluang pilihan pertamamu benar hanya 1/3, sehingga peluang hadiah ada di “pintu lain” adalah 2/3.</p>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const $ = id => document.getElementById(id);
const N = ['X', 'Y', 'Z'];
let prize, pick, opened, done, st = {stay: [0, 0], switch: [0, 0]};
function newGame(){ prize = Math.floor(Math.random() * 3); pick = null; opened = null; done = false; $('stay').disabled = $('switch').disabled = true; $('msg').textContent = 'Langkah 1: pilih satu pintu.'; render(); }
function render(){
  $('doors').innerHTML = N.map((n, i) => { const open = i === opened || done; return `<div class="door${i === pick ? ' pick' : ''}${open ? ' open' : ''}" data-i="${i}"><span>${n}</span>${open ? `<span class="ic">${i === prize ? '🎁' : '🐐'}</span>` : ''}</div>`; }).join('');
  $('bars').innerHTML = ['stay', 'switch'].map(k => { const [w, t] = st[k], p = t ? w / t : 0; return `<div class="bar"><span>${k === 'stay' ? 'Tetap' : 'Pindah'}: menang</span><div class="track"><div class="fill" style="width:${p * 100}%;background:${k === 'stay' ? 'var(--comp)' : 'var(--a)'}"></div></div><b>${w}/${t}${t ? ' ≈ ' + Sim.fmt(p, 2) : ''}</b></div>`; }).join('');
}
$('doors').onclick = e => { const d = e.target.closest('.door'); if(!d || pick !== null) return; pick = +d.dataset.i;
  const cand = [0, 1, 2].filter(i => i !== pick && i !== prize); opened = cand[Math.floor(Math.random() * cand.length)];
  $('msg').textContent = `Pembawa acara membuka pintu ${N[opened]} (kosong). Tetap di ${N[pick]} atau pindah?`; $('stay').disabled = $('switch').disabled = false; render(); };
function finish(sw){ if(done || pick === null) return; const final = sw ? [0, 1, 2].find(i => i !== pick && i !== opened) : pick; const win = final === prize;
  st[sw ? 'switch' : 'stay'][1]++; if(win) st[sw ? 'switch' : 'stay'][0]++; pick = final; done = true;
  $('msg').textContent = (win ? '🎉 Menang! ' : 'Kalah. ') + `Hadiah ada di pintu ${N[prize]}.`; $('stay').disabled = $('switch').disabled = true; render(); }
$('stay').onclick = () => finish(false); $('switch').onclick = () => finish(true); $('again').onclick = newGame;
$('sim100').onclick = () => { for(let k = 0; k < 100; k++){ const pr = Math.floor(Math.random() * 3), pk = Math.floor(Math.random() * 3); st.stay[1]++; st.switch[1]++; if(pk === pr) st.stay[0]++; else st.switch[0]++; } render(); };
$('reset').onclick = () => { st = {stay: [0, 0], switch: [0, 0]}; render(); };
newGame();
</script>
</body>
</html>
