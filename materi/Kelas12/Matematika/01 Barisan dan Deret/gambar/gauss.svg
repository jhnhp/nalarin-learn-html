<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="300.0" y="24.0" text-anchor="middle" class="t">Cara Gauss: 1 + 2 + … + 100</text><text x="40.0" y="70.0" text-anchor="start" class="b">S =   1  +   2  +   3  + … +  99  + 100</text><text x="40.0" y="100.0" text-anchor="start" class="b">S = 100 +  99  +  98  + … +   2  +   1</text><line x1="30.0" y1="112.0" x2="420.0" y2="112.0" stroke="#0a0f2c" stroke-width="1.5"/><text x="40.0" y="136.0" text-anchor="start" class="b" style="fill:#2447f9">2S = 101 + 101 + 101 + … + 101 + 101</text><text x="40.0" y="166.0" text-anchor="start" class="t" style="fill:#d98200">2S = 100 × 101  →  S = 5.050</text><text x="40.0" y="200.0" text-anchor="start" class="b">Secara umum: Sₙ = ½ n (a + Uₙ)</text></svg>
