<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faktor yang Memengaruhi Kerja Enzim</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 330" role="img" aria-label="Grafik kecepatan reaksi enzim dan ilustrasi enzim-substrat"></svg></div>
  <div class="panel">
    <div class="seg" id="tab"><button data-t="suhu" class="on">Suhu</button><button data-t="ph">pH</button><button data-t="sub">Substrat dan inhibitor</button><button data-t="ea">Energi aktivasi</button></div>
    <div id="p-suhu"><div class="lab">Suhu <b id="tv"></b></div><input type="range" id="t" min="0" max="80" step="1" value="25"><label class="chk"><input type="checkbox" id="pernah"> Enzim pernah dipanaskan sampai 70 °C</label></div>
    <div id="p-ph" hidden><div class="lab">pH <b id="pv"></b></div><input type="range" id="p" min="0" max="12" step="0.1" value="4"></div>
    <div id="p-sub" hidden><div class="lab">Konsentrasi substrat <b id="sv"></b></div><input type="range" id="s" min="0" max="100" step="1" value="30"><div class="seg" id="inh"><button data-i="0" class="on">Tanpa inhibitor</button><button data-i="k">Kompetitif</button><button data-i="n">Nonkompetitif</button></div></div>
    <div class="read" id="read"></div>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
let T = 'suhu', I = '0', tick = 0;
const seg = (id, key, cb) => $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); cb(b.dataset[key]); draw(); });
seg('tab', 't', v => { T = v; ['suhu', 'ph', 'sub'].forEach(k => $('p-' + k).hidden = k !== v); });
seg('inh', 'i', v => I = v);
['t', 'p', 's', 'pernah'].forEach(i => $(i).oninput = draw);
const rateT = (t, rusak) => rusak ? 0 : t <= 40 ? Math.pow(2, (t - 40) / 10) : Math.max(0, 1 - (t - 40) / 18) ** 1.5;
const ENZ = [['pepsin (lambung)', 2, '#e53935'], ['amilase ludah', 6.8, '#43a047'], ['tripsin (usus halus)', 8, '#1e88e5']];
const rateP = (p, opt) => Math.exp(-((p - opt) ** 2) / 2.2);
const V = 1, KM = 15;
const rateS = (s, inh) => inh === 'k' ? V * s / (KM * 3 + s) : inh === 'n' ? 0.45 * V * s / (KM + s) : V * s / (KM + s);
function axes(gx, gy, gw, gh, xl, yl, ticks){
  let s = `<line x1="${gx}" y1="${gy}" x2="${gx + gw}" y2="${gy}" stroke="#555"/><line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy - gh}" stroke="#555"/><text class="s" x="${gx + gw}" y="${gy + 28}" text-anchor="end" fill="#555">${xl}</text><text class="s" x="${gx + 4}" y="${gy - gh - 6}" fill="#555">${yl}</text>`;
  ticks.forEach(([v, x]) => s += `<text class="s" x="${x}" y="${gy + 14}" text-anchor="middle" fill="#555">${v}</text>`);
  return s;
}
function enzymePic(x, y, state){ // state: 'aktif', 'denaturasi', 'lambat', 'inhK', 'inhN'
  let s = '';
  if(state === 'denaturasi') s += `<path d="M${x - 40},${y} q15,-35 30,-5 q10,25 25,-10 q15,-20 25,15" fill="none" stroke="#7e57c2" stroke-width="10" stroke-linecap="round"/><text class="s" x="${x}" y="${y + 40}" text-anchor="middle" fill="#7e57c2">bentuk sisi aktif rusak</text>`;
  else {
    s += `<path d="M${x - 45},${y - 30} h30 v20 h30 v-20 h30 v60 h-90 z" fill="#b39ddb" stroke="#5e35b1" stroke-width="2"/>`;
    const bob = Math.sin(tick / 4) * (state === 'lambat' ? 1 : 3);
    if(state === 'inhK') s += `<rect x="${x - 15}" y="${y - 30}" width="30" height="20" fill="#e53935"/><text class="s" x="${x}" y="${y - 16}" text-anchor="middle" fill="#fff">I</text><rect x="${x - 15}" y="${y - 70 + bob}" width="30" height="22" fill="#ffca28" stroke="#f57f17"/><text class="s" x="${x}" y="${y - 54 + bob}" text-anchor="middle" fill="#333">S</text>`;
    else if(state === 'inhN') s += `<circle cx="${x + 45}" cy="${y + 10}" r="10" fill="#e53935"/><text class="s" x="${x + 45}" y="${y + 14}" text-anchor="middle" fill="#fff">I</text><path d="M${x - 15},${y - 30} l8,10 h14 l8,-10" fill="#fff"/><rect x="${x - 15}" y="${y - 70 + bob}" width="30" height="22" fill="#ffca28" stroke="#f57f17"/><text class="s" x="${x}" y="${y - 54 + bob}" text-anchor="middle" fill="#333">S</text>`;
    else { const inn = (tick % 40) < 20; s += `<rect x="${x - 15}" y="${(inn ? y - 30 : y - 70) + bob * (inn ? 0 : 1)}" width="30" height="20" fill="#ffca28" stroke="#f57f17"/><text class="s" x="${x}" y="${(inn ? y - 16 : y - 56)}" text-anchor="middle" fill="#333">S</text>`; }
    s += `<text class="s" x="${x}" y="${y + 46}" text-anchor="middle" fill="#5e35b1">enzim (sisi aktif di atas)</text>`;
  }
  return s;
}
function draw(){
  tick++;
  let s = '', html = '';
  const gx = 50, gy = 290, gw = 260, gh = 230;
  if(T === 'suhu'){
    const t = +$('t').value, rusak = $('pernah').checked; $('tv').textContent = t + ' °C';
    const X = v => gx + v / 80 * gw, Y = r => gy - r * gh;
    s += axes(gx, gy, gw, gh, 'suhu (°C)', 'kecepatan reaksi', [0, 20, 40, 60, 80].map(v => [v, X(v)]));
    let d = ''; for(let v = 0; v <= 80; v++) d += (v ? 'L' : 'M') + X(v) + ',' + Y(rateT(v, rusak)).toFixed(1);
    s += `<path d="${d}" fill="none" stroke="#5e35b1" stroke-width="3"/><circle cx="${X(t)}" cy="${Y(rateT(t, rusak))}" r="6" fill="#e53935"/><line x1="${X(40)}" y1="${gy}" x2="${X(40)}" y2="${Y(1)}" stroke="#aaa" stroke-dasharray="3 3"/><text class="s" x="${X(40)}" y="${Y(1) - 6}" text-anchor="middle" fill="#555">optimum ± 40 °C</text>`;
    const st = rusak || t > 58 ? 'denaturasi' : t < 15 ? 'lambat' : 'aktif';
    s += enzymePic(400, 150, st);
    html = `<div><span>Kecepatan relatif</span><b>${fmt(rateT(t, rusak) * 100, 0)}%</b></div><div><span>Keadaan enzim</span><b>${rusak ? 'terdenaturasi: tidak pulih walau didinginkan' : t > 58 ? 'terdenaturasi (rusak permanen)' : t < 15 ? 'tidak rusak, hanya bergerak lambat (inaktif sementara)' : t <= 45 ? 'aktif' : 'mulai rusak'}</b></div>`;
  } else if(T === 'ph'){
    const p = +$('p').value; $('pv').textContent = fmt(p, 1);
    const X = v => gx + v / 12 * gw, Y = r => gy - r * gh;
    s += axes(gx, gy, gw, gh, 'pH', 'kecepatan reaksi', [0, 2, 4, 6, 8, 10, 12].map(v => [v, X(v)]));
    ENZ.forEach(([n, o, c]) => { let d = ''; for(let v = 0; v <= 120; v++){ const pp = v / 10; d += (v ? 'L' : 'M') + X(pp).toFixed(1) + ',' + Y(rateP(pp, o)).toFixed(1); } s += `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5"/><circle cx="${X(p)}" cy="${Y(rateP(p, o))}" r="5" fill="${c}"/><text class="s" x="${X(o)}" y="${Y(1) - 6}" text-anchor="middle" fill="${c}">${n.split(' ')[0]}</text>`; });
    s += `<line x1="${X(p)}" y1="${gy}" x2="${X(p)}" y2="${gy - gh}" stroke="#aaa" stroke-dasharray="3 3"/>`;
    s += `<text class="c" x="330" y="80" style="fill:var(--ink)">pH optimum:</text>` + ENZ.map(([n, o, c], i) => `<text class="s" x="330" y="${100 + i * 18}" fill="${c}">${n}: ± ${String(o).replace('.', ',')}</text>`).join('');
    html = ENZ.map(([n, o]) => `<div><span>${n}</span><b>${fmt(rateP(p, o) * 100, 0)}%</b></div>`).join('');
  } else if(T === 'sub'){
    const S = +$('s').value; $('sv').textContent = S + ' satuan';
    const X = v => gx + v / 100 * gw, Y = r => gy - r * gh;
    s += axes(gx, gy, gw, gh, '[substrat]', 'kecepatan reaksi', [0, 25, 50, 75, 100].map(v => [v, X(v)]));
    [['0', '#5e35b1', 'tanpa inhibitor'], ['k', '#fb8c00', 'kompetitif'], ['n', '#e53935', 'nonkompetitif']].forEach(([k, c, n]) => { let d = ''; for(let v = 0; v <= 100; v++) d += (v ? 'L' : 'M') + X(v) + ',' + Y(rateS(v, k)).toFixed(1); s += `<path d="${d}" fill="none" stroke="${c}" stroke-width="${k === I ? 3.5 : 1.5}" opacity="${k === I ? 1 : .45}"/>`; });
    s += `<line x1="${gx}" y1="${Y(1)}" x2="${gx + gw}" y2="${Y(1)}" stroke="#aaa" stroke-dasharray="4 3"/><text class="s" x="${gx + gw}" y="${Y(1) - 4}" text-anchor="end" fill="#555">Vmaks</text><circle cx="${X(S)}" cy="${Y(rateS(S, I))}" r="6" fill="#333"/>`;
    s += enzymePic(400, 150, I === 'k' ? 'inhK' : I === 'n' ? 'inhN' : 'aktif');
    html = `<div><span>Kecepatan relatif</span><b>${fmt(rateS(S, I) * 100, 0)}% dari Vmaks</b></div><div><span>Keterangan</span><b style="font-weight:600">${I === 'k' ? 'Inhibitor mirip substrat berebut sisi aktif. Jika substrat diperbanyak, pengaruhnya makin kecil dan kecepatan mendekati Vmaks.' : I === 'n' ? 'Inhibitor menempel di sisi alosterik dan mengubah bentuk sisi aktif. Menambah substrat tidak memulihkan kecepatan.' : S > 70 ? 'Hampir semua sisi aktif sudah terisi (jenuh), sehingga kecepatan mendekati konstan.' : 'Makin banyak substrat, makin sering bertemu sisi aktif.'}</b></div>`;
  } else {
    const X = v => gx + v / 100 * (gw + 120), Y = e => gy - e * gh;
    s += `<line x1="${gx}" y1="${gy}" x2="${gx + gw + 120}" y2="${gy}" stroke="#555"/><line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy - gh}" stroke="#555"/><text class="s" x="${gx + gw + 120}" y="${gy + 16}" text-anchor="end" fill="#555">jalannya reaksi</text><text class="s" x="${gx + 4}" y="${gy - gh - 6}" fill="#555">energi</text>`;
    const prof = (h) => { let d = ''; for(let v = 0; v <= 100; v++){ const base = v < 20 ? .55 : v > 80 ? .25 : .55 - .3 * (v - 20) / 60; const bump = h * Math.exp(-((v - 50) ** 2) / 220); d += (v ? 'L' : 'M') + X(v).toFixed(1) + ',' + Y(base + bump).toFixed(1); } return d; };
    s += `<path d="${prof(.38)}" fill="none" stroke="#90a4ae" stroke-width="3"/><path d="${prof(.13)}" fill="none" stroke="#5e35b1" stroke-width="3"/>`;
    s += `<line x1="${X(12)}" y1="${Y(.55)}" x2="${X(12)}" y2="${Y(.92)}" stroke="#90a4ae" stroke-width="2"/><text class="s" x="${X(12) + 4}" y="${Y(.85)}" fill="#78909c">Ea tanpa enzim</text><line x1="${X(30)}" y1="${Y(.55)}" x2="${X(30)}" y2="${Y(.62)}" stroke="#5e35b1" stroke-width="2"/><text class="s" x="${X(32)}" y="${Y(.65)}" fill="#5e35b1">Ea dengan enzim</text><text class="s" x="${X(4)}" y="${Y(.55) - 6}" fill="#555">substrat</text><text class="s" x="${X(85)}" y="${Y(.25) - 6}" fill="#555">produk</text>`;
    html = `<div><span>Peran enzim</span><b style="font-weight:600">menurunkan energi aktivasi sehingga reaksi berlangsung cepat pada suhu tubuh</b></div><div><span>Yang tidak berubah</span><b style="font-weight:600">energi awal substrat, energi produk, dan jumlah produk akhir; enzim juga tidak ikut habis bereaksi</b></div>`;
  }
  svg.innerHTML = s; $('read').innerHTML = html;
}
setInterval(draw, 120);
draw();
</script>
</body>
</html>
