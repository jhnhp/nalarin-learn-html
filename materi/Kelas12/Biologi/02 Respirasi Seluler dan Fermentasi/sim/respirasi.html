<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respirasi Seluler dan Fermentasi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 340" role="img" aria-label="Tahapan respirasi seluler dan jumlah ATP, NADH, FADH2, dan CO2"></svg></div>
  <div class="panel">
    <div class="seg" id="o"><button data-o="aerob" class="on">Oksigen cukup</button><button data-o="alkohol">Tanpa O₂: khamir</button><button data-o="laktat">Tanpa O₂: sel otot</button></div>
    <div class="row"><button class="btn" id="prev">◀</button><button class="btn primary" id="next">Tahap berikutnya ▶</button><button class="btn" id="rs">Ulangi</button></div>
    <div class="lab">Konversi ATP pada transpor elektron</div>
    <div class="seg" id="kv"><button data-k="klasik" class="on">NADH = 3, FADH₂ = 2</button><button data-k="modern">NADH ≈ 2,5, FADH₂ ≈ 1,5</button></div>
    <div class="read" id="read"></div>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
let O = 'aerob', K = 'klasik', st = 0;
const seg = (id, key, cb) => $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); cb(b.dataset[key]); draw(); });
seg('o', 'o', v => { O = v; st = 0; }); seg('kv', 'k', v => K = v);
$('next').onclick = () => { st = Math.min(STAGES[O].length - 1, st + 1); draw(); };
$('prev').onclick = () => { st = Math.max(0, st - 1); draw(); };
$('rs').onclick = () => { st = 0; draw(); };
// tiap tahap: [nama, tempat, ATP langsung, NADH (+), FADH2, CO2, hasil karbon, catatan, NADH dipakai]
const STAGES = {
  aerob: [
    ['Glukosa', 'sitoplasma', 0, 0, 0, 0, 'glukosa (C6)', 'Bahan bakar utama respirasi.'],
    ['Glikolisis', 'sitosol (sitoplasma)', 2, 2, 0, 0, '2 asam piruvat (C3)', 'Investasi 2 ATP, menghasilkan 4 ATP: bersih 2 ATP. Tidak memerlukan oksigen.'],
    ['Dekarboksilasi oksidatif', 'matriks mitokondria', 0, 2, 0, 2, '2 asetil KoA (C2)', 'Setiap piruvat melepas 1 CO₂ dan mengikat koenzim A.'],
    ['Siklus Krebs', 'matriks mitokondria', 2, 6, 2, 4, '2 oksaloasetat kembali terbentuk', 'Berputar 2 kali per glukosa. Setiap putaran: 3 NADH, 1 FADH₂, 1 ATP (GTP), 2 CO₂.'],
    ['Transpor elektron', 'membran dalam (krista) mitokondria', 'te', 0, 0, 0, '6 H₂O (O₂ penerima elektron terakhir)', 'NADH dan FADH₂ melepas elektron; pompa H⁺ dan ATP sintase (kemiosmosis) membentuk ATP.'],
  ],
  alkohol: [
    ['Glukosa', 'sitoplasma', 0, 0, 0, 0, 'glukosa (C6)', ''],
    ['Glikolisis', 'sitosol', 2, 2, 0, 0, '2 asam piruvat (C3)', 'Sama dengan respirasi aerob.'],
    ['Dekarboksilasi piruvat', 'sitosol', 0, 0, 0, 2, '2 asetaldehida (C2)', 'Piruvat melepas CO₂ (gas inilah yang mengembangkan adonan roti).'],
    ['Reduksi asetaldehida', 'sitosol', 0, -2, 0, 0, '2 etanol (C2)', 'NADH dipakai mereduksi asetaldehida sehingga NAD⁺ terbentuk kembali dan glikolisis dapat terus berjalan.'],
  ],
  laktat: [
    ['Glukosa', 'sitoplasma', 0, 0, 0, 0, 'glukosa (C6)', ''],
    ['Glikolisis', 'sitosol', 2, 2, 0, 0, '2 asam piruvat (C3)', 'Sama dengan respirasi aerob.'],
    ['Reduksi piruvat', 'sitosol', 0, -2, 0, 0, '2 asam laktat (C3)', 'NADH mereduksi piruvat menjadi asam laktat; NAD⁺ terbentuk kembali. Tidak ada CO₂ yang dilepaskan.'],
  ],
};
function draw(){
  const S = STAGES[O], nN = K === 'klasik' ? 3 : 2.5, nF = K === 'klasik' ? 2 : 1.5;
  let atp = 0, nadh = 0, fadh = 0, co2 = 0, teATP = 0;
  for(let i = 0; i <= st; i++){
    const g = S[i];
    if(g[2] === 'te'){ teATP = nadh * nN + fadh * nF; atp += teATP; }
    else { atp += g[2]; nadh += g[3]; fadh += g[4]; co2 += g[5]; }
  }
  let s = '';
  // diagram sel
  s += `<rect x="10" y="20" width="460" height="180" rx="20" fill="#fff8e1" stroke="#ffcc80"/><text class="s" x="22" y="38" fill="#e65100">sitoplasma</text>`;
  if(O === 'aerob') s += `<ellipse cx="330" cy="115" rx="125" ry="70" fill="#ffccbc" stroke="#d84315" stroke-width="2"/><ellipse cx="330" cy="115" rx="105" ry="52" fill="#ffe0b2" stroke="#bf360c" stroke-dasharray="8 4"/><text class="s" x="330" y="58" text-anchor="middle" fill="#bf360c">mitokondria</text>`;
  const pos = O === 'aerob' ? [[50, 110], [130, 110], [237, 100], [322, 100], [400, 150]] : [[70, 110], [170, 110], [290, 110], [400, 110]];
  S.forEach((g, i) => {
    const [x, y] = pos[i], on = i <= st, cur = i === st;
    if(i) s += `<line x1="${pos[i - 1][0] + 30}" y1="${pos[i - 1][1]}" x2="${x - 32}" y2="${y}" stroke="${on ? '#5d4037' : '#ccc'}" stroke-width="2" marker-end="url(#a)"/>`;
    s += `<rect x="${x - 32}" y="${y - 18}" width="64" height="36" rx="8" fill="${cur ? '#ffd54f' : on ? '#fff' : '#f5f5f5'}" stroke="${on ? '#5d4037' : '#ccc'}"/><text class="s" x="${x}" y="${y - 3}" text-anchor="middle" fill="${on ? '#333' : '#aaa'}" style="font-size:8.5px">${g[0].split(' ')[0]}</text><text class="s" x="${x}" y="${y + 10}" text-anchor="middle" fill="${on ? '#333' : '#aaa'}" style="font-size:8.5px">${g[0].split(' ').slice(1).join(' ')}</text>`;
  });
  s += `<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5d4037"/></marker></defs>`;
  // penghitung
  const box = (x, lab, v, col) => `<rect x="${x}" y="222" width="104" height="56" rx="10" fill="${col}" fill-opacity=".15" stroke="${col}"/><text class="s" x="${x + 52}" y="242" text-anchor="middle" fill="${col}">${lab}</text><text class="c" x="${x + 52}" y="266" text-anchor="middle" style="font-size:18px;fill:${col}">${fmt(v, 1)}</text>`;
  s += box(12, 'ATP', atp, '#2e7d32') + box(128, 'NADH', nadh, '#1565c0') + box(244, 'FADH₂', fadh, '#6a1b9a') + box(360, 'CO₂', co2, '#5d4037');
  const g = S[st];
  s += `<text class="c" x="12" y="302" style="fill:var(--ink)">${g[0]} — ${g[1]}</text><text class="s" x="12" y="320" fill="#555">hasil karbon: ${g[6]}</text>`;
  svg.innerHTML = s;
  $('read').innerHTML = `<div><span>Penjelasan tahap</span><b style="font-weight:600">${g[7] || 'Klik tahap berikutnya.'}</b></div>${O === 'aerob' && st === 4 ? `<div><span>ATP dari transpor elektron</span><b>${nadh} × ${String(nN).replace('.', ',')} + ${fadh} × ${String(nF).replace('.', ',')} = ${fmt(teATP, 1)}</b></div>` : ''}<div><span>ATP total sampai tahap ini</span><b>${fmt(atp, 1)}</b></div>${O !== 'aerob' ? '<div><span>Bandingkan</span><b>fermentasi hanya 2 ATP per glukosa (dari glikolisis)</b></div>' : ''}`;
}
draw();
</script>
</body>
</html>
