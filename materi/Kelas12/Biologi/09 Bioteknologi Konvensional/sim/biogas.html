<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biodigester Biogas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}.s{font-family:var(--display);font-weight:700;font-size:10.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 480 300" role="img" aria-label="Tangki biodigester berisi kotoran ternak yang menghasilkan biogas"></svg></div>
  <div class="panel">
    <div class="lab">Kotoran sapi yang dimasukkan per hari <b id="kv"></b></div><input type="range" id="k" min="10" max="150" step="5" value="45">
    <div class="lab">Suhu tangki <b id="tv"></b></div><input type="range" id="t" min="10" max="60" step="1" value="30">
    <label class="chk"><input type="checkbox" id="tutup" checked> Tangki tertutup rapat (anaerob)</label>
    <div class="read" id="read"></div>
    <p class="note">Penyederhanaan: ± 0,04 m³ biogas per kg kotoran segar pada suhu optimum (± 30–40 °C); satu kompor biogas memakai ± 0,4 m³ per jam. Biogas berisi ± 50–70% metana (CH₄) dan sisanya terutama CO₂.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
let tick = 0;
['k', 't', 'tutup'].forEach(i => $(i).oninput = draw);
const fT = t => t < 15 ? 0.1 : t <= 35 ? 0.1 + 0.9 * (t - 15) / 20 : t <= 42 ? 1 : Math.max(0, 1 - (t - 42) / 12);
function draw(){
  tick++;
  const k = +$('k').value, t = +$('t').value, tutup = $('tutup').checked;
  $('kv').textContent = k + ' kg'; $('tv').textContent = t + ' °C';
  const gas = tutup ? k * 0.04 * fT(t) : 0, jam = gas / 0.4;
  let s = '';
  // tangki
  s += `<rect x="40" y="240" width="400" height="12" fill="#8d6e63"/><path d="M110,240 v-120 q0,-50 80,-50 h40 q80,0 80,50 v120 z" fill="#e0e0e0" stroke="#616161" stroke-width="2"/>`;
  s += `<rect x="112" y="${150}" width="196" height="88" fill="#6d4c41" opacity=".85"/>`;
  if(tutup) s += `<rect x="112" y="85" width="196" height="65" fill="#c8e6c9" opacity="${Math.min(.9, gas / 6)}"/>`;
  else s += `<rect x="180" y="62" width="60" height="14" fill="#fff" stroke="#e53935" stroke-dasharray="4 3"/><text class="s" x="210" y="56" text-anchor="middle" fill="#e53935">terbuka</text>`;
  for(let i = 0; i < 10; i++) if(gas > 0.1 && (i < gas * 2)) s += `<circle cx="${130 + (i * 19) % 170}" cy="${230 - ((tick * 2 + i * 13) % 80)}" r="3" fill="#a5d6a7" stroke="#2e7d32"/>`;
  s += `<text class="s" x="210" y="200" text-anchor="middle" fill="#fff">lumpur kotoran + air + bakteri</text><text class="s" x="210" y="110" text-anchor="middle" fill="#1b5e20">${tutup ? 'ruang gas' : ''}</text>`;
  // pipa masuk, keluar, gas
  s += `<path d="M40,150 h70" stroke="#795548" stroke-width="10"/><text class="s" x="40" y="138" fill="#555">masukan</text><path d="M310,220 h70 v20" stroke="#795548" stroke-width="10" fill="none"/><text class="s" x="330" y="268" fill="#555">ampas (pupuk organik)</text>`;
  if(tutup) s += `<path d="M210,70 v-40 h200 v40" stroke="#43a047" stroke-width="5" fill="none"/><text class="s" x="300" y="22" fill="#2e7d32">saluran biogas</text><path d="M398,110 h24 M402,104 l6,-12 l6,12 M414,104 l6,-12 l6,12" stroke="#1565c0" stroke-width="2" fill="none"/><rect x="390" y="110" width="40" height="8" fill="#424242"/>${gas > 0.1 ? `<path d="M400,104 q5,-14 10,0 q5,-14 10,0" fill="#42a5f5" opacity="${.4 + .3 * Math.sin(tick / 3)}"/>` : ''}`;
  svg.innerHTML = s;
  $('read').innerHTML = `<div><span>Biogas per hari</span><b>${fmt(gas, 2)} m³</b></div><div><span>Kompor dapat menyala</span><b>± ${fmt(jam, 1)} jam per hari</b></div><div><span>Keadaan</span><b style="font-weight:600">${!tutup ? 'Bakteri metanogen bersifat anaerob; dengan oksigen masuk, metana hampir tidak terbentuk dan gas terbuang.' : t < 20 ? 'Suhu terlalu rendah: aktivitas bakteri lambat.' : t > 45 ? 'Suhu terlalu tinggi: banyak bakteri metanogen mati.' : 'Kondisi baik: bakteri anaerob menguraikan bahan organik menjadi metana.'}</b></div>`;
}
setInterval(draw, 90);
draw();
</script>
</body>
</html>
