<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<rect x="30" y="104" width="44" height="66" rx="4" fill="#2447f9" fill-opacity=".14" stroke="#2447f9" stroke-width="2.5"/><circle cx="52" cy="128" r="8" fill="#2447f9" fill-opacity=".35"/><text x="52.0" y="195.0" text-anchor="middle" class="b" style="fill:#2447f9">2 × 3 cm</text><text x="52.0" y="214.0" text-anchor="middle" class="m">2 : 3</text><rect x="124" y="82" width="66" height="88" rx="4" fill="#d98200" fill-opacity=".14" stroke="#d98200" stroke-width="2.5"/><circle cx="157" cy="114" r="12" fill="#d98200" fill-opacity=".35"/><text x="157.0" y="195.0" text-anchor="middle" class="b" style="fill:#d98200">3 × 4 cm</text><text x="157.0" y="214.0" text-anchor="middle" class="m">3 : 4</text><rect x="240" y="38" width="88" height="132" rx="4" fill="#2447f9" fill-opacity=".14" stroke="#2447f9" stroke-width="2.5"/><circle cx="284" cy="86" r="16" fill="#2447f9" fill-opacity=".35"/><text x="284.0" y="195.0" text-anchor="middle" class="b" style="fill:#2447f9">4 × 6 cm</text><text x="284.0" y="214.0" text-anchor="middle" class="m">4 : 6 = 2 : 3</text><text x="470.0" y="90.0" text-anchor="start" class="b" style="fill:#2447f9">2 × 3 dan 4 × 6 sebangun:</text><text x="470.0" y="112.0" text-anchor="start" class="m">sisi dikali 2 semua.</text><text x="470.0" y="146.0" text-anchor="start" class="b" style="fill:#d98200">3 × 4 tidak sebangun</text><text x="470.0" y="168.0" text-anchor="start" class="m">dengan keduanya: 3 : 4 ≠ 2 : 3.</text></svg>
