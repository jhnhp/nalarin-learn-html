<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ubin Aljabar: Sifat Distributif</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>
  .t1{font-family:var(--display);font-weight:800;font-size:13px}
  .big{font-family:var(--display);font-weight:800;font-size:21px;text-align:center;padding:8px;border-radius:12px;background:var(--surface-2)}
  .ctl{display:grid;gap:6px}
  .ctl>div{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 460 360" role="img" aria-label="Persegi panjang tersusun dari ubin aljabar"></svg></div>
  <div class="panel">
    <h3 class="t">Bentuk faktor: <span id="fac"></span></h3>
    <div class="ctl">
      <div><div class="lab"><span>pengali a</span></div><div class="step"><button data-d="a-1">−</button><output id="a"></output><button data-d="a1">+</button></div></div>
      <div><div class="lab"><span>banyak x</span></div><div class="step"><button data-d="b-1">−</button><output id="b"></output><button data-d="b1">+</button></div></div>
      <div><div class="lab"><span>konstanta</span></div><div class="step"><button data-d="c-1">−</button><output id="c"></output><button data-d="c1">+</button></div></div>
    </div>
    <label class="chk"><input type="checkbox" id="c-x2"> Pengali berupa x (contoh: x(2x + 3))</label>
    <div class="big" id="exp"></div>
    <p class="note" id="why"></p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const $ = id => document.getElementById(id);
const svg = $('svg');
const st = {a: 3, b: 2, c: 4};
document.querySelectorAll('[data-d]').forEach(btn => btn.onclick = () => {
  const k = btn.dataset.d[0]; st[k] += +btn.dataset.d.slice(1);
  st.a = Math.max(1, Math.min(4, st.a)); st.b = Math.max(0, Math.min(3, st.b)); st.c = Math.max(0, Math.min(5, st.c));
  if(!st.b && !st.c) st.c = 1; draw(); });
$('c-x2').onchange = draw;
Sim.onTheme(draw);
const term = (k, v) => k === 0 ? '' : (k === 1 && v ? '' : k) + v;
const join = arr => arr.filter(Boolean).join(' + ') || '0';

function draw(){
  const {a, b, c} = st, xm = $('c-x2').checked;
  const U = 26, X = 86;              // ukuran ubin: 1 satuan dan x satuan
  const rowH = xm ? X : U, rows = xm ? 1 : a;
  const W = b * X + c * U, H = rows * rowH, x0 = 60, y0 = 50;
  let s = '';
  // label sisi
  for(let i = 0; i < b; i++) s += `<text class="t1" x="${x0 + i * X + X / 2}" y="${y0 - 10}" text-anchor="middle" style="fill:var(--a)">x</text>`;
  for(let j = 0; j < c; j++) s += `<text class="t1" x="${x0 + b * X + j * U + U / 2}" y="${y0 - 10}" text-anchor="middle" style="fill:var(--comp)">1</text>`;
  for(let r = 0; r < rows; r++) s += `<text class="t1" x="${x0 - 10}" y="${y0 + r * rowH + rowH / 2 + 5}" text-anchor="end" style="fill:var(--r)">${xm ? 'x' : '1'}</text>`;
  for(let r = 0; r < rows; r++){
    for(let i = 0; i < b; i++){
      const col = xm ? 'var(--r)' : 'var(--a)';
      s += `<rect x="${x0 + i * X + 1}" y="${y0 + r * rowH + 1}" width="${X - 2}" height="${rowH - 2}" rx="3" style="fill:${col};stroke:${col}" fill-opacity=".25" stroke-width="1.5"/>`;
      s += `<text class="t1" x="${x0 + i * X + X / 2}" y="${y0 + r * rowH + rowH / 2 + 5}" text-anchor="middle" style="fill:${col}">${xm ? 'x²' : 'x'}</text>`;
    }
    for(let j = 0; j < c; j++){
      const col = xm ? 'var(--a)' : 'var(--comp)';
      s += `<rect x="${x0 + b * X + j * U + 1}" y="${y0 + r * rowH + 1}" width="${U - 2}" height="${rowH - 2}" rx="3" style="fill:${col};stroke:${col}" fill-opacity=".25" stroke-width="1.5"/>`;
      if(xm) s += `<text class="t1" x="${x0 + b * X + j * U + U / 2}" y="${y0 + rowH / 2 + 5}" text-anchor="middle" style="fill:${col}">x</text>`;
    }
  }
  s += `<rect x="${x0}" y="${y0}" width="${W}" height="${H}" fill="none" style="stroke:var(--ink)" stroke-width="2.5"/>`;
  if(!xm) s += `<text x="${x0 + W / 2}" y="${y0 + H + 34}" text-anchor="middle" style="font-family:var(--font);font-size:13px;fill:var(--muted)">${a} baris, setiap baris berisi ${join([term(b, 'x'), c ? String(c) : ''])}</text>`;
  svg.setAttribute('viewBox', `0 0 ${Math.max(460, x0 + W + 20)} ${Math.max(220, y0 + H + 60)}`);
  svg.innerHTML = s;
  ['a', 'b', 'c'].forEach(k => $(k).textContent = st[k]);
  $('a').parentElement.style.opacity = xm ? .4 : 1;
  const inner = join([term(b, 'x'), c ? String(c) : '']);
  if(xm){
    $('fac').innerHTML = `x(${inner})`;
    $('exp').innerHTML = `x(${inner}) = ${join([term(b, 'x²'), term(c, 'x')])}`;
    $('why').innerHTML = `Persegi panjang ini lebarnya x. Setiap ubin besar luasnya x · x = <b>x²</b>, dan setiap ubin sempit luasnya x · 1 = <b>x</b>.`;
  } else {
    $('fac').innerHTML = `${a}(${inner})`;
    $('exp').innerHTML = `${a}(${inner}) = ${join([term(a * b, 'x'), c ? String(a * c) : ''])}`;
    $('why').innerHTML = `Ada ${a} baris yang sama. Hitung ubinnya: ${a} × ${b} = <b>${a * b}</b> ubin x dan ${a} × ${c} = <b>${a * c}</b> ubin satuan. Inilah <b>sifat distributif</b>: setiap suku di dalam kurung dikalikan ${a}.`;
  }
}
draw();
</script>
</body>
</html>
