<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pecahan pada Garis Bilangan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>
  .num{font-family:var(--font);font-size:12px;fill:var(--ink)}
  .tag{font-family:var(--display);font-weight:800;font-size:15px}
  .ctl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
  .frac{display:inline-grid;text-align:center;line-height:1.1;vertical-align:middle;font-weight:800}
  .frac span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
  .cmp{font-family:var(--display);font-weight:800;font-size:22px;text-align:center;padding:8px;border-radius:12px;background:var(--surface-2)}
</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 520 230" role="img" aria-label="Dua pecahan pada garis bilangan"></svg></div>
  <div class="panel">
    <div class="ctl">
      <b style="color:var(--a)">A</b><div class="row"><div class="step"><button data-d="pa-1">−</button><output id="pa"></output><button data-d="pa1">+</button></div>/<div class="step"><button data-d="qa-1">−</button><output id="qa"></output><button data-d="qa1">+</button></div></div>
      <b style="color:var(--b)">B</b><div class="row"><div class="step"><button data-d="pb-1">−</button><output id="pb"></output><button data-d="pb1">+</button></div>/<div class="step"><button data-d="qb-1">−</button><output id="qb"></output><button data-d="qb1">+</button></div></div>
    </div>
    <div class="seg" id="mode"><button data-m="cmp" class="on">Bandingkan</button><button data-m="add">A + B</button><button data-m="sub">A − B</button></div>
    <div class="cmp" id="cmp"></div>
    <div class="read" id="read"></div>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const st = {pa: 2, qa: 3, pb: 3, qb: 4}, LIM = {pa: [-12, 12], pb: [-12, 12], qa: [1, 12], qb: [1, 12]};
let mode = 'cmp';
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a), lcm = (a, b) => a / gcd(a, b) * b;
const fr = (p, q, c = 'inherit') => { const g = gcd(p, q) || 1; p /= g; q /= g; return q === 1 ? `<b style="color:${c}">${fmt(p)}</b>` : `<span class="frac" style="color:${c}"><span>${fmt(p)}</span><span>${q}</span></span>`; };
const raw = (p, q, c) => `<span class="frac" style="color:${c}"><span>${fmt(p)}</span><span>${q}</span></span>`;
document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const k = b.dataset.d.slice(0, 2), v = +b.dataset.d.slice(2); st[k] = Math.max(LIM[k][0], Math.min(LIM[k][1], st[k] + v)); draw(); });
$('mode').onclick = e => { const b = e.target.closest('button'); if(!b) return; mode = b.dataset.m; document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
Sim.onTheme(draw);

function draw(){
  const {pa, qa, pb, qb} = st, A = pa / qa, B = pb / qb, D = lcm(qa, qb);
  const R = mode === 'add' ? A + B : mode === 'sub' ? A - B : null;
  const vals = [A, B, R ?? 0, 0, 1, -1];
  const lo = Math.floor(Math.min(...vals)), hi = Math.ceil(Math.max(...vals)) || 1;
  const x0 = 30, x1 = 490, Y = 150, X = v => x0 + (v - lo) / (hi - lo) * (x1 - x0);
  let s = `<line x1="${x0 - 10}" y1="${Y}" x2="${x1 + 10}" y2="${Y}" style="stroke:var(--ink)" stroke-width="2"/>`;
  if(D * (hi - lo) <= 72) for(let k = lo * D; k <= hi * D; k++) s += `<line x1="${X(k / D)}" y1="${Y - 4}" x2="${X(k / D)}" y2="${Y + 4}" style="stroke:var(--muted)"/>`;
  for(let v = lo; v <= hi; v++) s += `<line x1="${X(v)}" y1="${Y - 9}" x2="${X(v)}" y2="${Y + 9}" style="stroke:var(--ink)" stroke-width="2"/><text class="num" x="${X(v)}" y="${Y + 26}" text-anchor="middle">${fmt(v)}</text>`;
  const mark = (v, c, label, up) => `<circle cx="${X(v)}" cy="${Y}" r="7" style="fill:${c}"/><line x1="${X(v)}" y1="${Y - 10}" x2="${X(v)}" y2="${Y - up}" style="stroke:${c}"/><text class="tag" x="${X(v)}" y="${Y - up - 6}" text-anchor="middle" style="fill:${c}">${label}</text>`;
  if(mode === 'cmp'){ s += mark(A, 'var(--a)', 'A', 40) + mark(B, 'var(--b)', 'B', Math.abs(X(A) - X(B)) < 30 ? 80 : 40); }
  else {
    s += mark(A, 'var(--a)', 'A', 40);
    const y2 = Y - 70, sgn = mode === 'add' ? 1 : -1;
    s += `<line x1="${X(A)}" y1="${y2}" x2="${X(R)}" y2="${y2}" style="stroke:var(--b)" stroke-width="4"/><polygon points="${X(R)},${y2} ${X(R) - 9 * Math.sign(R - A || 1)},${y2 - 6} ${X(R) - 9 * Math.sign(R - A || 1)},${y2 + 6}" style="fill:var(--b)"/>`;
    s += `<text class="tag" x="${(X(A) + X(R)) / 2}" y="${y2 - 10}" text-anchor="middle" style="fill:var(--b)">${mode === 'add' ? '+ B' : '− B'}</text>`;
    s += `<line x1="${X(R)}" y1="${y2}" x2="${X(R)}" y2="${Y}" style="stroke:var(--muted)" class="dash"/>` + mark(R, 'var(--ink)', '', 10);
  }
  svg.innerHTML = s;
  ['pa', 'qa', 'pb', 'qb'].forEach(k => $(k).textContent = fmt(st[k]));
  const a2 = pa * D / qa, b2 = pb * D / qb;
  if(mode === 'cmp'){
    const sign = Math.abs(A - B) < 1e-12 ? '=' : A < B ? '&lt;' : '&gt;';
    $('cmp').innerHTML = `${fr(pa, qa, 'var(--a)')} ${sign} ${fr(pb, qb, 'var(--b)')}`;
  } else {
    const p = mode === 'add' ? a2 + b2 : a2 - b2;
    $('cmp').innerHTML = `${raw(a2, D, 'var(--a)')} ${mode === 'add' ? '+' : '−'} ${raw(b2, D, 'var(--b)')} = ${raw(p, D, 'var(--ink)')}` + (gcd(p, D) > 1 && p ? ` = ${fr(p, D)}` : '');
  }
  $('read').innerHTML = `<div><span>Penyebut sama (KPK ${qa} dan ${qb})</span><b>${D}</b></div>` +
    `<div><span>A = ${fmt(pa)}/${qa}</span><b>${fmt(a2)}/${D} = ${fmt(A, 3)}</b></div><div><span>B = ${fmt(pb)}/${qb}</span><b>${fmt(b2)}/${D} = ${fmt(B, 3)}</b></div>`;
}
draw();
</script>
</body>
</html>
