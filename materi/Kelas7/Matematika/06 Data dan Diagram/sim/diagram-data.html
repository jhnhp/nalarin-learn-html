<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembuat Diagram</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>
  .lbl{font-family:var(--font);font-size:12px;fill:var(--muted)}
  .cat{font-family:var(--font);font-size:12.5px;fill:var(--ink)}
  .val{font-family:var(--display);font-weight:800;font-size:12.5px;fill:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  td{padding:3px 4px;border-bottom:1px solid var(--line)}
  td input{font:inherit;width:100%;padding:5px 6px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
  td input[type=number]{width:70px;text-align:right}
  td.r{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px}
  select{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);width:100%}
</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 460 360" role="img" aria-label="Diagram dari data di tabel"></svg></div>
  <div class="panel">
    <select id="ds" aria-label="Pilih contoh data">
      <option value="0">Olahraga favorit kelas 7C</option>
      <option value="1">Pengunjung taman wisata per bulan</option>
      <option value="2">Pengeluaran bulanan keluarga</option>
    </select>
    <div class="seg" id="kind"><button data-k="bar" class="on">Batang</button><button data-k="pie">Lingkaran</button><button data-k="line">Garis</button></div>
    <table id="tab"></table>
    <p class="note" id="note"></p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const COLORS = ['#2447f9', '#d98200', '#0e8f8a', '#e0344b', '#7c3aed', '#0b9a6a'];
const DATA = [
  {title: 'Olahraga favorit siswa kelas 7C', unit: 'siswa', rows: [['Sepak bola', 10], ['Bulu tangkis', 8], ['Voli', 6], ['Basket', 4], ['Renang', 2]], best: 'bar'},
  {title: 'Pengunjung taman wisata (ratus orang)', unit: 'ratus', rows: [['Jan', 12], ['Feb', 9], ['Mar', 14], ['Apr', 18], ['Mei', 16], ['Jun', 25]], best: 'line'},
  {title: 'Pengeluaran bulanan keluarga (ratus ribu rupiah)', unit: 'ratus ribu', rows: [['Makan', 30], ['Sekolah', 12], ['Listrik', 6], ['Transpor', 8], ['Tabungan', 4]], best: 'pie'},
];
let di = 0, kind = 'bar', rows = [];
$('ds').onchange = e => { di = +e.target.value; load(); };
$('kind').onclick = e => { const b = e.target.closest('button'); if(!b) return; kind = b.dataset.k; document.querySelectorAll('#kind button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
Sim.onTheme(draw);
function load(){
  rows = DATA[di].rows.map(r => r.slice());
  $('tab').innerHTML = rows.map((r, i) => `<tr><td><span class="sw" style="background:${COLORS[i % 6]}"></span></td><td><input data-i="${i}" data-c="0" value="${r[0]}"></td><td><input type="number" min="0" max="99" data-i="${i}" data-c="1" value="${r[1]}"></td><td class="r" id="r${i}"></td></tr>`).join('');
  $('tab').querySelectorAll('input').forEach(inp => inp.oninput = () => { const i = +inp.dataset.i; rows[i][+inp.dataset.c] = inp.dataset.c === '1' ? Math.max(0, +inp.value || 0) : inp.value; draw(); });
  draw();
}
function draw(){
  const D = DATA[di], vals = rows.map(r => r[1]), tot = vals.reduce((a, b) => a + b, 0) || 1, mx = Math.max(...vals, 1);
  let s = `<text x="230" y="22" text-anchor="middle" style="font-family:var(--display);font-weight:800;font-size:14px;fill:var(--ink)">${D.title}</text>`;
  if(kind === 'pie'){
    let a = -90; const cx = 200, cy = 195, R = 125;
    rows.forEach((r, i) => {
      const sw = r[1] / tot * 360; if(sw <= 0) return;
      const p = d => [cx + R * Math.cos(d * Math.PI / 180), cy + R * Math.sin(d * Math.PI / 180)];
      const [x1, y1] = p(a), [x2, y2] = p(a + sw), m = (a + sw / 2) * Math.PI / 180;
      s += sw >= 359.9 ? `<circle cx="${cx}" cy="${cy}" r="${R}" style="fill:${COLORS[i % 6]}"/>` :
        `<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${sw > 180 ? 1 : 0} 1 ${x2},${y2} Z" style="fill:${COLORS[i % 6]};stroke:var(--bg)" stroke-width="2"/>`;
      if(sw > 16) s += `<text x="${cx + R * .62 * Math.cos(m)}" y="${cy + R * .62 * Math.sin(m) + 4}" text-anchor="middle" style="font-family:var(--display);font-weight:800;font-size:12.5px;fill:#fff">${fmt(sw, 0)}°</text>`;
      s += `<text class="cat" x="${cx + (R + 10) * Math.cos(m)}" y="${cy + (R + 10) * Math.sin(m) + 4}" text-anchor="${Math.cos(m) >= 0 ? 'start' : 'end'}">${r[0]}</text>`;
      a += sw;
    });
  } else {
    const gx = 50, gy = 44, gw = 390, gh = 260, step = Math.max(1, Math.ceil(mx / 5 / 5) * 5) || 1, top = Math.ceil(mx / step) * step;
    const Y = v => gy + gh - v / top * gh;
    for(let v = 0; v <= top; v += step) s += `<line x1="${gx}" y1="${Y(v)}" x2="${gx + gw}" y2="${Y(v)}" style="stroke:var(--grid)"/><text class="lbl" x="${gx - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
    s += `<line x1="${gx}" y1="${gy + gh}" x2="${gx + gw}" y2="${gy + gh}" style="stroke:var(--ink)" stroke-width="1.6"/><line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy + gh}" style="stroke:var(--ink)" stroke-width="1.6"/>`;
    const n = rows.length, X = i => gx + (i + .5) * gw / n, bw = gw / n * .58;
    if(kind === 'bar') rows.forEach((r, i) => { s += `<rect x="${X(i) - bw / 2}" y="${Y(r[1])}" width="${bw}" height="${gy + gh - Y(r[1])}" rx="3" style="fill:${COLORS[i % 6]}"/><text class="val" x="${X(i)}" y="${Y(r[1]) - 5}" text-anchor="middle">${r[1]}</text>`; });
    else {
      s += `<polyline points="${rows.map((r, i) => X(i) + ',' + Y(r[1])).join(' ')}" fill="none" style="stroke:var(--a)" stroke-width="3"/>`;
      rows.forEach((r, i) => s += `<circle cx="${X(i)}" cy="${Y(r[1])}" r="5" style="fill:var(--a)"/><text class="val" x="${X(i)}" y="${Y(r[1]) - 9}" text-anchor="middle">${r[1]}</text>`);
    }
    rows.forEach((r, i) => s += `<text class="cat" x="${X(i)}" y="${gy + gh + 18}" text-anchor="middle">${r[0]}</text>`);
  }
  svg.innerHTML = s;
  rows.forEach((r, i) => { const el = $('r' + i); if(el) el.innerHTML = `${fmt(r[1] / tot * 100, 1)}%<br>${fmt(r[1] / tot * 360, 1)}°`; });
  const tip = {bar: 'Diagram batang cocok untuk <b>membandingkan</b> banyaknya setiap kategori.', pie: `Diagram lingkaran menunjukkan <b>bagian dari keseluruhan</b>. Sudut pusat = (nilai : total) × 360°. Total sekarang ${fmt(tot)}.`, line: 'Diagram garis cocok untuk data yang <b>berubah dari waktu ke waktu</b>, sehingga naik turunnya terlihat.'}[kind];
  $('note').innerHTML = tip + (kind === D.best ? ' Untuk data ini, diagram ini adalah pilihan yang tepat.' : ' Apakah diagram ini paling tepat untuk data ini?');
}
load();
</script>
</body>
</html>
