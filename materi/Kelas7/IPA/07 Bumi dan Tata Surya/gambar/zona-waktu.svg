<text x="330.0" y="24.0" text-anchor="middle" class="t">Pembagian waktu di Indonesia</text><rect x="20" y="50" width="200" height="110" rx="12" fill="#2447f9" fill-opacity=".14" stroke="#2447f9" stroke-width="2"/><text x="120.0" y="86.0" text-anchor="middle" class="t" style="fill:#2447f9">WIB</text><text x="120.0" y="108.0" text-anchor="middle" class="b">UTC+7</text><text x="120.0" y="136.0" text-anchor="middle" class="t">10.00</text><text x="120.0" y="182.0" text-anchor="middle" class="m" style="font-size:11px">Sumatra, Jawa, Kalimantan Barat dan Tengah</text><rect x="230" y="50" width="200" height="110" rx="12" fill="#d98200" fill-opacity=".14" stroke="#d98200" stroke-width="2"/><text x="330.0" y="86.0" text-anchor="middle" class="t" style="fill:#d98200">WITA</text><text x="330.0" y="108.0" text-anchor="middle" class="b">UTC+8</text><text x="330.0" y="136.0" text-anchor="middle" class="t">11.00</text><text x="330.0" y="182.0" text-anchor="middle" class="m" style="font-size:11px">Bali, NTB, NTT, Kalimantan lain, Sulawesi</text><rect x="440" y="50" width="200" height="110" rx="12" fill="#0b9a6a" fill-opacity=".14" stroke="#0b9a6a" stroke-width="2"/><text x="540.0" y="86.0" text-anchor="middle" class="t" style="fill:#0b9a6a">WIT</text><text x="540.0" y="108.0" text-anchor="middle" class="b">UTC+9</text><text x="540.0" y="136.0" text-anchor="middle" class="t">12.00</text><text x="540.0" y="182.0" text-anchor="middle" class="m" style="font-size:11px">Maluku, Papua</text><line x1="30.0" y1="210.0" x2="630.0" y2="210.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ae)"/><text x="330.0" y="232.0" text-anchor="middle" class="m">Bumi berotasi dari barat ke timur: wilayah timur lebih dahulu mengalami pagi.</text><text x="330.0" y="252.0" text-anchor="middle" class="b">Setiap 15° bujur = selisih 1 jam (360° : 24 jam).</text></svg>
