<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 295"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2447f9"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="300.0" y="24.0" text-anchor="middle" class="t">Jarak tempuh dan perpindahan</text><circle cx="80" cy="200" r="8" fill="#0a0f2c"/><text x="80.0" y="226.0" text-anchor="middle" class="m">rumah (A)</text><circle cx="480" cy="80" r="8" fill="#0a0f2c"/><text x="480.0" y="62.0" text-anchor="middle" class="m">sekolah (B)</text><polyline points="80,200 480,200 480,80" fill="none" stroke="#d98200" stroke-width="4" stroke-dasharray="8 5"/><text x="280.0" y="220.0" text-anchor="middle" class="b" style="fill:#d98200">400 m</text><text x="492.0" y="145.0" text-anchor="start" class="b" style="fill:#d98200">300 m</text><line x1="88.0" y1="197.0" x2="472.0" y2="83.0" stroke="#2447f9" stroke-width="3.5" marker-end="url(#ab)"/><text x="250.0" y="125.0" text-anchor="middle" class="b" style="fill:#2447f9">perpindahan 500 m</text><text x="40.0" y="262.0" text-anchor="start" class="m">Jarak tempuh (lintasan jingga) = 400 + 300 = 700 m.</text><text x="40.0" y="280.0" text-anchor="start" class="m">Perpindahan (garis lurus A ke B) = √(400² + 300²) = 500 m.</text></svg>
