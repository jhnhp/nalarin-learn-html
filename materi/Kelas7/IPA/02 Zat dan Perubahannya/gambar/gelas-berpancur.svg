<text x="270.0" y="24.0" text-anchor="middle" class="b">Mengukur volume benda tidak beraturan</text><rect x="60" y="80" width="120" height="170" fill="#2447f9" fill-opacity=".18"/><line x1="60.0" y1="50.0" x2="60.0" y2="250.0" stroke="#0a0f2c" stroke-width="2.5"/><line x1="180.0" y1="50.0" x2="180.0" y2="250.0" stroke="#0a0f2c" stroke-width="2.5"/><line x1="55.0" y1="250.0" x2="185.0" y2="250.0" stroke="#0a0f2c" stroke-width="3"/><line x1="180.0" y1="80.0" x2="225.0" y2="100.0" stroke="#0a0f2c" stroke-width="2.5"/><path d="M226 102 q6 20 2 50" fill="none" stroke="#2447f9" stroke-width="3" stroke-dasharray="4 4"/><polygon points="95,170 150,160 160,215 110,228" fill="#5a6283"/><text x="120.0" y="275.0" text-anchor="middle" class="m">gelas berpancur</text><rect x="210" y="200" width="40" height="50" fill="#2447f9" fill-opacity=".25"/><line x1="210.0" y1="150.0" x2="210.0" y2="250.0" stroke="#0a0f2c" stroke-width="2"/><line x1="250.0" y1="150.0" x2="250.0" y2="250.0" stroke="#0a0f2c" stroke-width="2"/><line x1="205.0" y1="250.0" x2="255.0" y2="250.0" stroke="#0a0f2c" stroke-width="2.5"/><text x="230.0" y="275.0" text-anchor="middle" class="m">gelas ukur</text><text x="300.0" y="120.0" text-anchor="start" class="b">Air yang tumpah = volume batu.</text><text x="300.0" y="150.0" text-anchor="start" class="m">Atau: masukkan batu ke gelas ukur;</text><text x="300.0" y="170.0" text-anchor="start" class="m">V batu = V akhir − V awal.</text></svg>
