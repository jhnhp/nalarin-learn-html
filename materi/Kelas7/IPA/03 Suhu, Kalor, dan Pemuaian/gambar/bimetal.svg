<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="300.0" y="22.0" text-anchor="middle" class="t">Keping bimetal</text><rect x="40" y="60" width="200" height="12" fill="#d98200"/><rect x="40" y="72" width="200" height="12" fill="#5a6283"/><text x="140.0" y="110.0" text-anchor="middle" class="m">suhu ruang: lurus</text><path d="M340 60 Q440 66 520 110" fill="none" stroke="#d98200" stroke-width="12"/><path d="M340 72 Q436 78 512 120" fill="none" stroke="#5a6283" stroke-width="12"/><text x="430.0" y="150.0" text-anchor="middle" class="m">dipanaskan: melengkung ke arah logam</text><text x="430.0" y="168.0" text-anchor="middle" class="m">yang koefisien muainya lebih kecil</text><text x="40.0" y="200.0" text-anchor="start" class="b" style="fill:#d98200">tembaga (α besar)</text><text x="260.0" y="200.0" text-anchor="start" class="b" style="fill:#5a6283">besi (α kecil)</text><text x="40.0" y="226.0" text-anchor="start" class="m">Dipakai pada termostat setrika, alarm kebakaran, dan saklar otomatis.</text></svg>
