<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="400.0" y="24.0" text-anchor="middle" class="t">Pengelompokan Kingdom Plantae</text><rect x="250.0" y="40" width="140" height="46" rx="10" fill="#0b9a6a" fill-opacity=".12" stroke="#0b9a6a" stroke-width="2"/><text x="320.0" y="60.0" text-anchor="middle" class="b" style="fill:#0b9a6a;font-size:13px">Plantae</text><text x="320.0" y="77.0" text-anchor="middle" class="m" style="font-size:11px">tumbuhan</text><line x1="320.0" y1="86.0" x2="110.0" y2="120.0" stroke="#5a6283" stroke-width="1.6"/><rect x="35.0" y="120" width="150" height="46" rx="10" fill="#0e8f8a" fill-opacity=".12" stroke="#0e8f8a" stroke-width="2"/><text x="110.0" y="140.0" text-anchor="middle" class="b" style="fill:#0e8f8a;font-size:13px">Bryophyta</text><text x="110.0" y="157.0" text-anchor="middle" class="m" style="font-size:11px">lumut</text><line x1="320.0" y1="86.0" x2="320.0" y2="120.0" stroke="#5a6283" stroke-width="1.6"/><rect x="245.0" y="120" width="150" height="46" rx="10" fill="#0e8f8a" fill-opacity=".12" stroke="#0e8f8a" stroke-width="2"/><text x="320.0" y="140.0" text-anchor="middle" class="b" style="fill:#0e8f8a;font-size:13px">Pteridophyta</text><text x="320.0" y="157.0" text-anchor="middle" class="m" style="font-size:11px">paku</text><line x1="320.0" y1="86.0" x2="530.0" y2="120.0" stroke="#5a6283" stroke-width="1.6"/><rect x="455.0" y="120" width="150" height="46" rx="10" fill="#0e8f8a" fill-opacity=".12" stroke="#0e8f8a" stroke-width="2"/><text x="530.0" y="140.0" text-anchor="middle" class="b" style="fill:#0e8f8a;font-size:13px">Spermatophyta</text><text x="530.0" y="157.0" text-anchor="middle" class="m" style="font-size:11px">berbiji</text><line x1="530.0" y1="166.0" x2="430.0" y2="200.0" stroke="#5a6283" stroke-width="1.6"/><rect x="335.0" y="200" width="190" height="46" rx="10" fill="#d98200" fill-opacity=".12" stroke="#d98200" stroke-width="2"/><text x="430.0" y="220.0" text-anchor="middle" class="b" style="fill:#d98200;font-size:13px">Gymnospermae</text><text x="430.0" y="237.0" text-anchor="middle" class="m" style="font-size:11px">biji terbuka: pinus, melinjo</text><line x1="530.0" y1="166.0" x2="620.0" y2="200.0" stroke="#5a6283" stroke-width="1.6"/><rect x="525.0" y="200" width="190" height="46" rx="10" fill="#d98200" fill-opacity=".12" stroke="#d98200" stroke-width="2"/><text x="620.0" y="220.0" text-anchor="middle" class="b" style="fill:#d98200;font-size:13px">Angiospermae</text><text x="620.0" y="237.0" text-anchor="middle" class="m" style="font-size:11px">biji tertutup, berbunga</text><line x1="620.0" y1="246.0" x2="530.0" y2="280.0" stroke="#5a6283" stroke-width="1.6"/><rect x="445.0" y="280" width="170" height="46" rx="10" fill="#2447f9" fill-opacity=".12" stroke="#2447f9" stroke-width="2"/><text x="530.0" y="300.0" text-anchor="middle" class="b" style="fill:#2447f9;font-size:13px">Monokotil</text><text x="530.0" y="317.0" text-anchor="middle" class="m" style="font-size:11px">biji 1 keping, daun sejajar</text><line x1="620.0" y1="246.0" x2="700.0" y2="280.0" stroke="#5a6283" stroke-width="1.6"/><rect x="615.0" y="280" width="170" height="46" rx="10" fill="#2447f9" fill-opacity=".12" stroke="#2447f9" stroke-width="2"/><text x="700.0" y="300.0" text-anchor="middle" class="b" style="fill:#2447f9;font-size:13px">Dikotil</text><text x="700.0" y="317.0" text-anchor="middle" class="m" style="font-size:11px">biji 2 keping, daun menjari</text><text x="30.0" y="200.0" text-anchor="start" class="m">Lumut: belum punya akar, batang,</text><text x="30.0" y="218.0" text-anchor="start" class="m">daun sejati; berkembang biak dengan spora.</text><text x="30.0" y="250.0" text-anchor="start" class="m">Paku: akar, batang, daun sejati;</text><text x="30.0" y="268.0" text-anchor="start" class="m">spora di bawah daun (sorus).</text></svg>
