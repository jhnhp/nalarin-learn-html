<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram Panah: Relasi atau Fungsi?</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>
  .el{cursor:pointer}
  .el text{font-family:var(--font);font-size:14px;font-weight:700}
  .cap{font-family:var(--display);font-weight:800;font-size:15px}
  select{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);width:100%}
  .pairs{font-size:14px;line-height:1.6;padding:8px 10px;border-radius:10px;background:var(--surface-2);word-break:break-word}
</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 460 340" role="img" aria-label="Diagram panah dari himpunan A ke himpunan B"></svg></div>
  <div class="panel">
    <select id="pick" aria-label="Pilih contoh"></select>
    <p class="note" id="rule"></p>
    <div class="pairs" id="pairs"></div>
    <div class="box" id="fb"></div>
    <div class="read" id="read"></div>
    <div class="row"><button class="btn" id="clear">Hapus semua panah</button></div>
    <p class="note">Klik anggota A lalu anggota B untuk menambah atau menghapus panah.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const $ = id => document.getElementById(id);
const svg = $('svg');
const SETS = [
  {name: 'Mata pelajaran favorit', A: ['Ani', 'Budi', 'Cici', 'Dodi'], B: ['Matematika', 'IPA', 'IPS', 'Seni'], rel: 'menyukai', arrows: [[0, 0], [1, 1], [2, 0], [3, 3]]},
  {name: '"faktor dari"', A: ['2', '3', '4', '5'], B: ['4', '6', '8', '9', '10'], rel: 'faktor dari', arrows: [[0, 0], [0, 1], [0, 2], [0, 4], [1, 1], [1, 3], [2, 0], [2, 2], [3, 4]]},
  {name: '"kuadrat dari" (fungsi)', A: ['−2', '−1', '1', '2'], B: ['1', '2', '4', '8'], rel: 'kuadratnya adalah', arrows: [[0, 2], [1, 0], [2, 0], [3, 2]]},
  {name: 'Kosong (buat sendiri)', A: ['a', 'b', 'c'], B: ['1', '2', '3'], rel: 'dipasangkan dengan', arrows: []},
];
let si = 0, arrows = [], pick = null;
$('pick').innerHTML = SETS.map((s, i) => `<option value="${i}">${s.name}</option>`).join('');
$('pick').onchange = e => { si = +e.target.value; load(); };
$('clear').onclick = () => { arrows = []; pick = null; draw(); };
Sim.onTheme(draw);
function load(){ arrows = SETS[si].arrows.map(a => a.slice()); pick = null; draw(); }
function draw(){
  const S = SETS[si];
  const YA = i => S.A.length === 1 ? 190 : 70 + i * 240 / (S.A.length - 1), YB = j => S.B.length === 1 ? 190 : 60 + j * 260 / (S.B.length - 1);
  let s = `<ellipse cx="110" cy="190" rx="80" ry="160" style="fill:var(--a);stroke:var(--a)" fill-opacity=".08" stroke-width="2"/><ellipse cx="350" cy="190" rx="90" ry="165" style="fill:var(--comp);stroke:var(--comp)" fill-opacity=".08" stroke-width="2"/>`;
  s += `<text class="cap" x="110" y="22" text-anchor="middle" style="fill:var(--a)">A</text><text class="cap" x="350" y="22" text-anchor="middle" style="fill:var(--comp)">B</text>`;
  arrows.forEach(([i, j]) => {
    const x1 = 150, y1 = YA(i), x2 = 300, y2 = YB(j), L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
    s += `<line x1="${x1}" y1="${y1}" x2="${x2 - ux * 10}" y2="${y2 - uy * 10}" style="stroke:var(--ink)" stroke-width="2"/><polygon points="${x2},${y2} ${x2 - ux * 12 - uy * 5},${y2 - uy * 12 + ux * 5} ${x2 - ux * 12 + uy * 5},${y2 - uy * 12 - ux * 5}" style="fill:var(--ink)"/>`;
  });
  const cnt = S.A.map((_, i) => arrows.filter(a => a[0] === i).length);
  S.A.forEach((a, i) => s += `<g class="el" data-a="${i}"><circle cx="140" cy="${YA(i)}" r="7" style="fill:${pick === i ? 'var(--b)' : cnt[i] === 1 ? 'var(--a)' : cnt[i] === 0 ? 'var(--muted)' : 'var(--b)'}"/><text x="128" y="${YA(i) + 5}" text-anchor="end">${a}</text></g>`);
  S.B.forEach((b, j) => s += `<g class="el" data-b="${j}"><circle cx="310" cy="${YB(j)}" r="7" style="fill:var(--comp)"/><text x="322" y="${YB(j) + 5}">${b}</text></g>`);
  svg.innerHTML = s;
  svg.querySelectorAll('[data-a]').forEach(g => g.onclick = () => { pick = +g.dataset.a; draw(); });
  svg.querySelectorAll('[data-b]').forEach(g => g.onclick = () => {
    if(pick === null) return; const j = +g.dataset.b, k = arrows.findIndex(a => a[0] === pick && a[1] === j);
    if(k >= 0) arrows.splice(k, 1); else arrows.push([pick, j]); pick = null; draw(); });
  $('rule').innerHTML = `Relasi: anggota A <b>${S.rel}</b> anggota B.`;
  const sorted = arrows.slice().sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  $('pairs').innerHTML = 'Himpunan pasangan berurutan:<br>{' + sorted.map(([i, j]) => `(${S.A[i]}, ${S.B[j]})`).join(', ') + '}';
  const isF = cnt.every(c => c === 1), none = cnt.filter(c => c === 0).length, many = cnt.filter(c => c > 1).length;
  $('fb').className = 'box ' + (isF ? 'ok' : 'no');
  $('fb').innerHTML = isF ? '<b>Fungsi!</b> Setiap anggota A memiliki tepat satu pasangan di B.'
    : `<b>Bukan fungsi.</b> ` + (none ? `${none} anggota A tidak punya pasangan (titik abu-abu). ` : '') + (many ? `${many} anggota A punya lebih dari satu pasangan (titik merah).` : '');
  const range = [...new Set(sorted.map(a => a[1]))].map(j => S.B[j]);
  $('read').innerHTML = `<div><span>Domain (daerah asal)</span><b>{${S.A.join(', ')}}</b></div><div><span>Kodomain (daerah kawan)</span><b>{${S.B.join(', ')}}</b></div>` +
    (isF ? `<div><span>Range (daerah hasil)</span><b>{${range.join(', ')}}</b></div>` : '');
}
load();
</script>
</body>
</html>
