<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarak Dua Titik</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.ar{font-family:var(--display);font-weight:800;font-size:15px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.calc{font-size:14.5px;line-height:1.8;padding:10px 12px;border-radius:10px;background:var(--surface-2)}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" role="img" aria-label="Dua titik pada bidang koordinat dan segitiga siku-siku di antaranya"></svg></div>
  <div class="panel">
    <h3 class="t">Geser titik P dan Q</h3>
    <div class="calc" id="calc"></div>
    <p class="note">Garis putus-putus membentuk segitiga siku-siku. Sisi mendatarnya |x₂ − x₁| dan sisi tegaknya |y₂ − y₁|. Jarak PQ adalah sisi miringnya.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const Pl = Sim.plane(svg, {xmin: -7, xmax: 7, ymin: -6, ymax: 6, scale: 32});
let P = {x: -3, y: -2}, Q = {x: 3, y: 6 - 4};
Pl.draggable((h, x, y) => { const c = Pl.clamp(Math.round(x), Math.round(y)); if(h === 'P') P = c; else Q = c; draw(); });
Sim.onTheme(draw);
function draw(){
  const dx = Q.x - P.x, dy = Q.y - P.y, d2 = dx * dx + dy * dy, R = {x: Q.x, y: P.y};
  let s = Pl.grid({xname: 'x', yname: 'y'});
  s += `<line x1="${Pl.X(P.x)}" y1="${Pl.Y(P.y)}" x2="${Pl.X(R.x)}" y2="${Pl.Y(R.y)}" style="stroke:var(--a)" stroke-width="3" class="dash"/>`;
  s += `<line x1="${Pl.X(R.x)}" y1="${Pl.Y(R.y)}" x2="${Pl.X(Q.x)}" y2="${Pl.Y(Q.y)}" style="stroke:var(--comp)" stroke-width="3" class="dash"/>`;
  s += `<line x1="${Pl.X(P.x)}" y1="${Pl.Y(P.y)}" x2="${Pl.X(Q.x)}" y2="${Pl.Y(Q.y)}" style="stroke:var(--b)" stroke-width="4"/>`;
  if(dx && dy) s += `<text class="ar" x="${Pl.X((P.x + R.x) / 2)}" y="${Pl.Y(P.y) + (dy > 0 ? 20 : -10)}" text-anchor="middle" style="fill:var(--a)">${Math.abs(dx)}</text><text class="ar" x="${Pl.X(R.x) + (dx > 0 ? 14 : -14)}" y="${Pl.Y((R.y + Q.y) / 2) + 5}" text-anchor="middle" style="fill:var(--comp)">${Math.abs(dy)}</text>`;
  s += Pl.handle('P', P.x, P.y, 'var(--a)') + Pl.handle('Q', Q.x, Q.y, 'var(--r)');
  s += `<text class="ar" x="${Pl.X(P.x) - 10}" y="${Pl.Y(P.y) - 10}" text-anchor="end" style="fill:var(--a)">P(${fmt(P.x)}, ${fmt(P.y)})</text><text class="ar" x="${Pl.X(Q.x) + 10}" y="${Pl.Y(Q.y) - 10}" style="fill:var(--r)">Q(${fmt(Q.x)}, ${fmt(Q.y)})</text>`;
  svg.innerHTML = s;
  const r = Math.sqrt(d2), k = Math.round(r) ** 2 === d2;
  // sederhanakan akar
  let out = 1, inn = d2; for(let f = Math.floor(Math.sqrt(d2)); f > 1; f--) if(inn % (f * f) === 0){ out = f; inn = d2 / (f * f); break; }
  const simp = k ? String(Math.round(r)) : (out > 1 ? `${out}√${inn}` : `√${d2}`);
  $('calc').innerHTML = `Mendatar: |${fmt(Q.x)} − (${fmt(P.x)})| = <b>${Math.abs(dx)}</b><br>Tegak: |${fmt(Q.y)} − (${fmt(P.y)})| = <b>${Math.abs(dy)}</b><br>` +
    `PQ² = ${Math.abs(dx)}² + ${Math.abs(dy)}² = ${d2}<br>PQ = √${d2} = <b>${simp}</b>${k ? '' : ' ≈ ' + fmt(r)}`;
}
draw();
</script>
</body>
</html>
