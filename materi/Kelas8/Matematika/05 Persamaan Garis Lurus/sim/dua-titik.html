<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kemiringan dari Dua Titik</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.ar{font-family:var(--display);font-weight:800;font-size:14px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.calc{font-size:14.5px;line-height:1.8;padding:10px 12px;border-radius:10px;background:var(--surface-2)}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" role="img" aria-label="Garis melalui dua titik yang bisa digeser"></svg></div>
  <div class="panel">
    <h3 class="t">Geser titik A dan B</h3>
    <div class="calc" id="calc"></div>
    <p class="note">Kemiringan = perubahan tegak (Δy) dibagi perubahan mendatar (Δx). Tukar urutan A dan B: apakah hasilnya berubah?</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const P = Sim.plane(svg, {xmin: -6, xmax: 6, ymin: -6, ymax: 6, scale: 34});
let A = {x: -3, y: -1}, B = {x: 3, y: 3};
P.draggable((h, x, y) => { const c = P.clamp(Math.round(x), Math.round(y)); if(h === 'A') A = c; else B = c; draw(); });
Sim.onTheme(draw);
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
function fr(p, q){ if(q < 0){ p = -p; q = -q; } const g = gcd(p, q) || 1; p /= g; q /= g; return q === 1 ? fmt(p) : `${p < 0 ? '−' : ''}${Math.abs(p)}/${q}`; }
function draw(){
  const dx = B.x - A.x, dy = B.y - A.y;
  let s = P.grid({xname: 'x', yname: 'y'});
  if(dx || dy){
    const t = 20, ux = dx, uy = dy;
    s += `<line x1="${P.X(A.x - ux * t)}" y1="${P.Y(A.y - uy * t)}" x2="${P.X(A.x + ux * t)}" y2="${P.Y(A.y + uy * t)}" style="stroke:var(--a)" stroke-width="2.5"/>`;
    s += `<line x1="${P.X(A.x)}" y1="${P.Y(A.y)}" x2="${P.X(B.x)}" y2="${P.Y(A.y)}" style="stroke:var(--comp)" stroke-width="3" class="dash"/><line x1="${P.X(B.x)}" y1="${P.Y(A.y)}" x2="${P.X(B.x)}" y2="${P.Y(B.y)}" style="stroke:var(--b)" stroke-width="3" class="dash"/>`;
    if(dx) s += `<text class="ar" x="${P.X((A.x + B.x) / 2)}" y="${P.Y(A.y) + (dy >= 0 ? 20 : -10)}" text-anchor="middle" style="fill:var(--comp)">Δx = ${fmt(dx)}</text>`;
    if(dy) s += `<text class="ar" x="${P.X(B.x) + (dx >= 0 ? 8 : -8)}" y="${P.Y((A.y + B.y) / 2) + 5}" text-anchor="${dx >= 0 ? 'start' : 'end'}" style="fill:var(--b)">Δy = ${fmt(dy)}</text>`;
  }
  s += P.handle('A', A.x, A.y, 'var(--a)') + P.handle('B', B.x, B.y, 'var(--r)');
  s += `<text class="ar" x="${P.X(A.x) - 10}" y="${P.Y(A.y) - 10}" text-anchor="end" style="fill:var(--a)">A(${fmt(A.x)}, ${fmt(A.y)})</text><text class="ar" x="${P.X(B.x) + 10}" y="${P.Y(B.y) - 10}" style="fill:var(--r)">B(${fmt(B.x)}, ${fmt(B.y)})</text>`;
  svg.innerHTML = s;
  let out;
  if(!dx && !dy) out = 'Kedua titik berimpit. Geser salah satunya.';
  else if(!dx) out = `Δx = 0, sehingga kemiringan <b>tidak terdefinisi</b>. Garisnya tegak: <b>x = ${fmt(A.x)}</b>.`;
  else {
    const m = fr(dy, dx), mv = dy / dx, cn = A.y * dx - dy * A.x, c = cn / dx;
    const cs = cn === 0 ? '' : (c > 0 ? ' + ' : ' − ') + fr(Math.abs(cn), Math.abs(dx));
    out = `m = Δy / Δx = ${fmt(dy)} / ${fmt(dx)} = <b>${m}</b><br>` +
      `y − y₁ = m(x − x₁): y − (${fmt(A.y)}) = ${m}(x − (${fmt(A.x)}))<br>` +
      `Persamaan garis: <b>y = ${mv === 0 ? '' : (m === '1' ? '' : m === '−1' ? '−' : m.includes('/') ? '(' + m + ')' : m) + 'x'}${mv === 0 ? fr(cn, dx) : cs}</b><br>` +
      `${mv > 0 ? 'Garis naik ke kanan (m positif).' : mv < 0 ? 'Garis turun ke kanan (m negatif).' : 'Garis mendatar (m = 0).'}`;
  }
  $('calc').innerHTML = out;
}
draw();
</script>
</body>
</html>
