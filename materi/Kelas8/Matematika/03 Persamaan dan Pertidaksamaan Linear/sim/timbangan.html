<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timbangan Persamaan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>
  .t1{font-family:var(--display);font-weight:800;font-size:14px}
  .eq{font-family:var(--display);font-weight:800;font-size:24px;text-align:center;padding:8px;border-radius:12px;background:var(--surface-2)}
  .ops{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ops .btn{min-height:36px;font-size:13px}
  ol.log{padding-left:20px;font-size:14px}
  select{font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);width:100%}
</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 460 300" role="img" aria-label="Timbangan dengan kotak x dan beban satuan di kedua lengan"></svg></div>
  <div class="panel">
    <select id="pick" aria-label="Pilih persamaan"></select>
    <div class="eq" id="eq"></div>
    <div class="ops">
      <button class="btn" data-o="-1">−1 di kedua sisi</button><button class="btn" data-o="+1">+1 di kedua sisi</button>
      <button class="btn" data-o="-x">−x di kedua sisi</button><button class="btn" data-o="div">Bagi kedua sisi</button>
    </div>
    <div class="box hidden" id="fb"></div>
    <ol class="log" id="log"></ol>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const $ = id => document.getElementById(id);
const svg = $('svg');
// persamaan ax + b = cx + d dengan a, b, c, d ≥ 0
const EQ = [[2, 4, 0, 8], [3, 1, 1, 7], [4, 2, 2, 10], [5, 0, 2, 9], [3, 5, 1, 11], [2, 7, 0, 7]];
let st, log;
$('pick').innerHTML = EQ.map((e, i) => `<option value="${i}">${show(...e)}</option>`).join('');
$('pick').onchange = load;
document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => op(b.dataset.o));
Sim.onTheme(draw);
function side(a, b){ const s = []; if(a) s.push((a === 1 ? '' : a) + 'x'); if(b || !a) s.push(b); return s.join(' + '); }
function show(a, b, c, d){ return side(a, b) + ' = ' + side(c, d); }
function load(){ const e = EQ[+$('pick').value]; st = {a: e[0], b: e[1], c: e[2], d: e[3]}; log = []; $('fb').className = 'box hidden'; draw(); }
function op(o){
  const {a, b, c, d} = st, fb = $('fb');
  let msg = null;
  if(o === '-1'){ if(b < 1 || d < 1) msg = 'Tidak bisa: salah satu sisi tidak punya beban 1 lagi.'; else { st.b--; st.d--; log.push('Kurangi 1 dari kedua sisi'); } }
  if(o === '+1'){ st.b++; st.d++; log.push('Tambah 1 pada kedua sisi'); }
  if(o === '-x'){ if(a < 1 || c < 1) msg = 'Tidak bisa: salah satu sisi tidak punya kotak x.'; else { st.a--; st.c--; log.push('Kurangi x dari kedua sisi'); } }
  if(o === 'div'){
    const L = a, R = d;
    if(c || b) msg = 'Bagi kedua sisi baru berguna jika satu sisi hanya berisi kotak x dan sisi lain hanya beban 1.';
    else if(L > 1 && R % L === 0){ st.a = 1; st.d = R / L; log.push(`Bagi kedua sisi dengan ${L}`); }
    else msg = 'Kotak x sudah tinggal satu.';
  }
  if(msg){ fb.className = 'box no'; fb.innerHTML = msg; } else fb.className = 'box hidden';
  draw();
  if(st.a === 1 && !st.b && !st.c){ fb.className = 'box ok'; fb.innerHTML = `<b>Selesai! x = ${st.d}.</b> Periksa dengan mengganti x pada persamaan awal. Timbangan tetap seimbang karena setiap langkah dilakukan pada <b>kedua sisi</b>.`; }
}
function draw(){
  const {a, b, c, d} = st, tilt = 0;
  let s = `<polygon points="230,250 200,290 260,290" style="fill:var(--muted)"/><line x1="40" y1="250" x2="420" y2="250" style="stroke:var(--ink)" stroke-width="5" stroke-linecap="round"/>`;
  const pan = (x0, n1, nx) => {
    let g = `<line x1="${x0 - 85}" y1="240" x2="${x0 + 85}" y2="240" style="stroke:var(--ink)" stroke-width="3"/>`;
    const items = [...Array(nx).fill('x'), ...Array(n1).fill('1')];
    items.forEach((t, i) => {
      const col = i % 5, row = Math.floor(i / 5), x = x0 - 80 + col * 34, y = 236 - (row + 1) * 34;
      g += t === 'x' ? `<rect x="${x}" y="${y}" width="30" height="30" rx="5" style="fill:var(--a)"/><text class="t1" x="${x + 15}" y="${y + 20}" text-anchor="middle" fill="#fff">x</text>`
        : `<circle cx="${x + 15}" cy="${y + 15}" r="13" style="fill:var(--comp)"/><text class="t1" x="${x + 15}" y="${y + 20}" text-anchor="middle" fill="#fff">1</text>`;
    });
    return g;
  };
  s += pan(130, b, a) + pan(330, d, c);
  svg.innerHTML = s;
  $('eq').textContent = show(a, b, c, d);
  $('log').innerHTML = log.map(l => `<li>${l}</li>`).join('');
}
load();
</script>
</body>
</html>
