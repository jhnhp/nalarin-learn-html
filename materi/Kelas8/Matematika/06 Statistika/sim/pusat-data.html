<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mean, Median, dan Modus</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>
  .lbl{font-family:var(--font);font-size:12.5px;fill:var(--ink)}
  .tag{font-family:var(--display);font-weight:800;font-size:13px}
  .slot{cursor:pointer}
  .data{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--surface-2);word-break:break-word;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 460 300" role="img" aria-label="Diagram titik nilai ulangan dengan mean, median, dan modus"></svg></div>
  <div class="panel">
    <h3 class="t">Nilai ulangan (skala 1–10)</h3>
    <div class="data" id="data"></div>
    <div class="read" id="read"></div>
    <div class="row"><button class="btn" id="out">Tambah pencilan (1)</button><button class="btn" id="reset">Ulangi</button></div>
    <p class="note">Klik di atas angka untuk menambah satu data. Klik sebuah titik untuk menghapusnya. Mean adalah titik seimbang (segitiga), median adalah nilai tengah.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
const BASE = [5, 6, 6, 7, 7, 7, 8, 8, 9, 10];
let data = BASE.slice();
$('reset').onclick = () => { data = BASE.slice(); draw(); };
$('out').onclick = () => { data.push(1); draw(); };
Sim.onTheme(draw);
const X = v => 30 + (v - 1) * 44, Y0 = 220;
function stats(){
  const d = data.slice().sort((a, b) => a - b), n = d.length;
  if(!n) return null;
  const mean = d.reduce((a, b) => a + b, 0) / n;
  const med = n % 2 ? d[(n - 1) / 2] : (d[n / 2 - 1] + d[n / 2]) / 2;
  const cnt = {}; d.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
  const mx = Math.max(...Object.values(cnt)), modes = Object.keys(cnt).filter(k => cnt[k] === mx).map(Number);
  return {d, n, mean, med, modes: mx > 1 ? modes : [], cnt};
}
function draw(){
  const S = stats();
  let s = `<line x1="14" y1="${Y0}" x2="446" y2="${Y0}" style="stroke:var(--ink)" stroke-width="2"/>`;
  for(let v = 1; v <= 10; v++) s += `<rect class="slot" data-v="${v}" x="${X(v) - 20}" y="20" width="40" height="${Y0 - 20}" fill="transparent"/><line x1="${X(v)}" y1="${Y0 - 5}" x2="${X(v)}" y2="${Y0 + 5}" style="stroke:var(--ink)"/><text class="lbl" x="${X(v)}" y="${Y0 + 22}" text-anchor="middle">${v}</text>`;
  const stack = {};
  data.forEach((v, i) => { const k = stack[v] = (stack[v] || 0) + 1; const isMode = S && S.modes.includes(v);
    s += `<circle class="slot" data-i="${i}" cx="${X(v)}" cy="${Y0 - 14 - (k - 1) * 22}" r="9" style="fill:${isMode ? 'var(--comp)' : 'var(--a)'}"/>`; });
  if(S){
    s += `<polygon points="${X(S.mean)},${Y0 + 30} ${X(S.mean) - 10},${Y0 + 46} ${X(S.mean) + 10},${Y0 + 46}" style="fill:var(--b)"/><text class="tag" x="${X(S.mean)}" y="${Y0 + 64}" text-anchor="middle" style="fill:var(--b)">mean ${fmt(S.mean)}</text>`;
    s += `<line x1="${X(S.med)}" y1="24" x2="${X(S.med)}" y2="${Y0}" style="stroke:var(--k)" stroke-width="2.5" class="dash"/><text class="tag" x="${X(S.med)}" y="18" text-anchor="middle" style="fill:var(--k)">median ${fmt(S.med)}</text>`;
  }
  svg.innerHTML = s;
  svg.querySelectorAll('[data-v]').forEach(r => r.onclick = () => { if(data.length < 30){ data.push(+r.dataset.v); draw(); } });
  svg.querySelectorAll('[data-i]').forEach(c => c.onclick = e => { e.stopPropagation(); data.splice(+c.dataset.i, 1); draw(); });
  $('data').innerHTML = S ? 'Data terurut: ' + S.d.join(', ') : 'Belum ada data.';
  $('read').innerHTML = S ? `<div><span>Banyak data (n)</span><b>${S.n}</b></div>` +
    `<div><span style="color:var(--b)">Mean = jumlah : n</span><b>${S.d.reduce((a, b) => a + b, 0)} : ${S.n} = ${fmt(S.mean)}</b></div>` +
    `<div><span style="color:var(--k)">Median (nilai tengah)</span><b>${fmt(S.med)}</b></div>` +
    `<div><span style="color:var(--comp)">Modus (paling sering)</span><b>${S.modes.length ? S.modes.join(' dan ') : 'tidak ada'}</b></div>` : '';
}
draw();
</script>
</body>
</html>
