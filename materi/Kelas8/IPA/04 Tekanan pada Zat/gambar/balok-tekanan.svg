<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="320.0" y="22.0" text-anchor="middle" class="t">Balok 120 N diletakkan dengan tiga cara</text><rect x="40.0" y="180" width="160" height="40" fill="#0e8f8a" fill-opacity=".3" stroke="#0e8f8a" stroke-width="2"/><line x1="30.0" y1="220.0" x2="210.0" y2="220.0" stroke="#0a0f2c" stroke-width="2"/><text x="120.0" y="242.0" text-anchor="middle" class="m" style="font-size:11px">A = 0,4 × 0,2 = 0,08 m²</text><text x="120.0" y="262.0" text-anchor="middle" class="b" style="fill:#0a0f2c;font-size:12px">P = 120/0,08 = 1.500 Pa</text><rect x="285.0" y="140" width="80" height="80" fill="#0e8f8a" fill-opacity=".3" stroke="#0e8f8a" stroke-width="2"/><line x1="235.0" y1="220.0" x2="415.0" y2="220.0" stroke="#0a0f2c" stroke-width="2"/><text x="325.0" y="242.0" text-anchor="middle" class="m" style="font-size:11px">A = 0,2 × 0,2 = 0,04 m²</text><text x="325.0" y="262.0" text-anchor="middle" class="b" style="fill:#0a0f2c;font-size:12px">P = 120/0,04 = 3.000 Pa</text><rect x="510.0" y="60" width="40" height="160" fill="#0e8f8a" fill-opacity=".3" stroke="#0e8f8a" stroke-width="2"/><line x1="440.0" y1="220.0" x2="620.0" y2="220.0" stroke="#0a0f2c" stroke-width="2"/><text x="530.0" y="242.0" text-anchor="middle" class="m" style="font-size:11px">A = 0,1 × 0,2 = 0,02 m²</text><text x="530.0" y="262.0" text-anchor="middle" class="b" style="fill:#e0344b;font-size:12px">P = 120/0,02 = 6.000 Pa</text><text x="320.0" y="290.0" text-anchor="middle" class="m">Gaya sama, luas bidang tekan makin kecil → tekanan makin besar.</text></svg>
