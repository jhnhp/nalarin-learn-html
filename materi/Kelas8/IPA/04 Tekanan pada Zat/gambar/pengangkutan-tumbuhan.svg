<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2447f9"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="300.0" y="22.0" text-anchor="middle" class="t">Pengangkutan air pada tumbuhan</text><rect x="270" y="80" width="20" height="200" fill="#8a5a2b" fill-opacity=".6"/><ellipse cx="280" cy="70" rx="90" ry="40" fill="#0b9a6a" fill-opacity=".35"/><path d="M280 280 q-40 20 -70 50 M280 280 q40 25 70 45 M280 280 v50" stroke="#8a5a2b" stroke-width="5" fill="none"/><line x1="300.0" y1="270.0" x2="300.0" y2="110.0" stroke="#2447f9" stroke-width="2.5" marker-end="url(#ab)"/><text x="310.0" y="200.0" text-anchor="start" class="b" style="fill:#2447f9">air naik melalui xilem</text><text x="380.0" y="55.0" text-anchor="start" class="m">transpirasi: uap air keluar melalui</text><text x="380.0" y="72.0" text-anchor="start" class="m">stomata dan “menarik” air ke atas</text><text x="20.0" y="300.0" text-anchor="start" class="m">tekanan akar: akar menyerap air</text><text x="20.0" y="318.0" text-anchor="start" class="m">dan mendorongnya ke atas</text><text x="330.0" y="140.0" text-anchor="start" class="m">kapilaritas: air merambat</text><text x="330.0" y="157.0" text-anchor="start" class="m">di pembuluh yang sempit</text></svg>
