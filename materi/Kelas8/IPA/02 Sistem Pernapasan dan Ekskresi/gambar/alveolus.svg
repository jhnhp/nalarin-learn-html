<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2447f9"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0344b"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="270.0" y="22.0" text-anchor="middle" class="t">Pertukaran gas di alveolus</text><circle cx="170" cy="150" r="90" fill="#2447f9" fill-opacity=".08" stroke="#2447f9" stroke-width="2.5"/><text x="170.0" y="150.0" text-anchor="middle" class="b" style="fill:#2447f9">alveolus (udara)</text><path d="M290 40 C250 100 250 200 290 260" fill="none" stroke="#e0344b" stroke-width="18" stroke-opacity=".35"/><text x="330.0" y="50.0" text-anchor="start" class="b" style="fill:#e0344b">kapiler darah</text><line x1="215.0" y1="115.0" x2="270.0" y2="115.0" stroke="#2447f9" stroke-width="2.5" marker-end="url(#ab)"/><text x="240.0" y="106.0" text-anchor="middle" class="b" style="fill:#2447f9">O₂</text><line x1="270.0" y1="185.0" x2="215.0" y2="185.0" stroke="#e0344b" stroke-width="2.5" marker-end="url(#ar)"/><text x="240.0" y="205.0" text-anchor="middle" class="b" style="fill:#e0344b">CO₂</text><text x="310.0" y="130.0" text-anchor="start" class="m">Dinding alveolus dan kapiler sangat tipis</text><text x="310.0" y="150.0" text-anchor="start" class="m">sehingga gas mudah berdifusi dari</text><text x="310.0" y="170.0" text-anchor="start" class="m">konsentrasi tinggi ke rendah.</text></svg>
