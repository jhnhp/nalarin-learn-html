<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0a0f2c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="330.0" y="24.0" text-anchor="middle" class="t">Jalan udara pernapasan</text><rect x="20" y="42" width="130" height="34" rx="10" fill="#0e8f8a" fill-opacity=".14" stroke="#0e8f8a" stroke-width="2"/><text x="85.0" y="64.0" text-anchor="middle" class="b" style="fill:#0e8f8a;font-size:13px">Hidung</text><text x="166.0" y="64.0" text-anchor="start" class="m" style="font-size:12px">menyaring, menghangatkan, melembapkan udara</text><line x1="85.0" y1="77.0" x2="85.0" y2="85.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ad)"/><rect x="20" y="86" width="130" height="34" rx="10" fill="#0e8f8a" fill-opacity=".14" stroke="#0e8f8a" stroke-width="2"/><text x="85.0" y="108.0" text-anchor="middle" class="b" style="fill:#0e8f8a;font-size:13px">Faring</text><text x="166.0" y="108.0" text-anchor="start" class="m" style="font-size:12px">persimpangan jalan napas dan jalan makanan</text><line x1="85.0" y1="121.0" x2="85.0" y2="129.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ad)"/><rect x="20" y="130" width="130" height="34" rx="10" fill="#0e8f8a" fill-opacity=".14" stroke="#0e8f8a" stroke-width="2"/><text x="85.0" y="152.0" text-anchor="middle" class="b" style="fill:#0e8f8a;font-size:13px">Laring</text><text x="166.0" y="152.0" text-anchor="start" class="m" style="font-size:12px">kotak suara; epiglotis menutup saat menelan</text><line x1="85.0" y1="165.0" x2="85.0" y2="173.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ad)"/><rect x="20" y="174" width="130" height="34" rx="10" fill="#0e8f8a" fill-opacity=".14" stroke="#0e8f8a" stroke-width="2"/><text x="85.0" y="196.0" text-anchor="middle" class="b" style="fill:#0e8f8a;font-size:13px">Trakea</text><text x="166.0" y="196.0" text-anchor="start" class="m" style="font-size:12px">batang tenggorok bercincin tulang rawan, bersilia</text><line x1="85.0" y1="209.0" x2="85.0" y2="217.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ad)"/><rect x="20" y="218" width="130" height="34" rx="10" fill="#0e8f8a" fill-opacity=".14" stroke="#0e8f8a" stroke-width="2"/><text x="85.0" y="240.0" text-anchor="middle" class="b" style="fill:#0e8f8a;font-size:13px">Bronkus</text><text x="166.0" y="240.0" text-anchor="start" class="m" style="font-size:12px">cabang trakea ke paru-paru kanan dan kiri</text><line x1="85.0" y1="253.0" x2="85.0" y2="261.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ad)"/><rect x="20" y="262" width="130" height="34" rx="10" fill="#0e8f8a" fill-opacity=".14" stroke="#0e8f8a" stroke-width="2"/><text x="85.0" y="284.0" text-anchor="middle" class="b" style="fill:#0e8f8a;font-size:13px">Bronkiolus</text><text x="166.0" y="284.0" text-anchor="start" class="m" style="font-size:12px">cabang-cabang halus bronkus</text><line x1="85.0" y1="297.0" x2="85.0" y2="305.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ad)"/><rect x="20" y="306" width="130" height="34" rx="10" fill="#0e8f8a" fill-opacity=".14" stroke="#0e8f8a" stroke-width="2"/><text x="85.0" y="328.0" text-anchor="middle" class="b" style="fill:#0e8f8a;font-size:13px">Alveolus</text><text x="166.0" y="328.0" text-anchor="start" class="m" style="font-size:12px">gelembung udara; tempat pertukaran O₂ dan CO₂</text></svg>
