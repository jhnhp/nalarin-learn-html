<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keseimbangan Air Tubuh</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12.5px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 440 330" role="img" aria-label="Air masuk dan air keluar tubuh dalam sehari serta warna urine"></svg></div>
  <div class="panel">
    <div><div class="lab"><span>Air minum per hari (mL)</span><b id="wout"></b></div><input type="range" id="w" min="500" max="3500" step="100" value="1500"></div>
    <div class="seg" id="cuaca"><button data-c="0">Sejuk</button><button data-c="1" class="on">Biasa</button><button data-c="2">Panas</button></div>
    <label class="chk"><input type="checkbox" id="c-olr"> Berolahraga 1 jam</label>
    <div class="read" id="read"></div>
    <p class="note">Ginjal menjaga jumlah air tubuh tetap seimbang (homeostasis). Jika banyak air keluar sebagai keringat, ginjal menghemat air sehingga urine sedikit dan pekat. Perkiraan sederhana untuk remaja; minimal urine sekitar 500 mL/hari diperlukan untuk membuang urea.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
let cu = 1;
$('w').oninput = draw; $('c-olr').onchange = draw;
$('cuaca').onclick = e => { const b = e.target.closest('button'); if(!b) return; cu = +b.dataset.c; document.querySelectorAll('#cuaca button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
Sim.onTheme(draw);
function draw(){
  const w = +$('w').value, makan = 700, metab = 300, inn = w + makan + metab;
  const sweat = [200, 450, 900][cu] + ($('c-olr').checked ? 700 : 0), napas = 350 + ($('c-olr').checked ? 150 : 0), feses = 150;
  let urine = inn - sweat - napas - feses, deh = 0;
  if(urine < 500){ deh = 500 - urine; urine = 500; }
  const conc = Math.min(1, Math.max(0, (1800 - urine) / 1300));
  const L = 60, Hs = 0.06;
  const bar = (x, items, title) => { let y = 290, s = `<text class="c" x="${x + 45}" y="20" text-anchor="middle">${title}</text>`; items.forEach(([n, v, c]) => { const h = v * Hs; y -= h; s += `<rect x="${x}" y="${y}" width="90" height="${h}" style="fill:${c};stroke:var(--bg)" fill-opacity=".8"/>` + (h > 14 ? `<text class="c" x="${x + 45}" y="${y + h / 2 + 4}" text-anchor="middle" style="fill:#fff">${n} ${v}</text>` : ''); }); return s; };
  let s = bar(L, [['minum', w, 'var(--a)'], ['makanan', makan, 'var(--k)'], ['metabolisme', metab, 'var(--muted)']], 'Air masuk (mL)');
  s += bar(L + 130, [['urine', Math.round(urine), 'var(--comp)'], ['keringat', sweat, 'var(--b)'], ['napas', napas, 'var(--r)'], ['feses', feses, 'var(--muted)']], 'Air keluar (mL)');
  const col = `hsl(${52 - conc * 22}, ${60 + conc * 30}%, ${85 - conc * 45}%)`;
  s += `<path d="M350 120 h50 l-6 150 h-38z" fill="${col}" stroke="var(--ink)" stroke-width="2"/><text class="c" x="375" y="295" text-anchor="middle">warna urine</text>`;
  s += `<line x1="40" y1="290" x2="320" y2="290" style="stroke:var(--ink)" stroke-width="1.5"/>`;
  svg.innerHTML = s;
  $('wout').textContent = w;
  $('read').innerHTML = `<div><span>Volume urine</span><b>${Math.round(urine)} mL/hari</b></div><div><span>Urine</span><b>${conc > .7 ? 'sedikit dan pekat (kuning tua)' : conc > .35 ? 'normal' : 'banyak dan encer (jernih)'}</b></div>` +
    (deh > 0 ? `<div><span style="color:var(--b)">Kekurangan air</span><b>${Math.round(deh)} mL: tubuh dehidrasi, minumlah lebih banyak</b></div>` : '');
}
draw();
</script>
</body>
</html>
