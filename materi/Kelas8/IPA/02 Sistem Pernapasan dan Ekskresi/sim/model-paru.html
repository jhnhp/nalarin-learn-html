<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Pernapasan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12.5px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.big{font-family:var(--display);font-weight:800;font-size:18px;text-align:center;padding:8px;border-radius:12px;background:var(--surface-2)}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 420 380" role="img" aria-label="Model rongga dada dengan paru-paru dan diafragma"></svg></div>
  <div class="panel">
    <div><div class="lab"><span>Diafragma</span><b id="dout"></b></div><input type="range" id="d" min="0" max="1" step="0.01" value="0"></div>
    <div class="row"><button class="btn primary" id="auto">Bernapas otomatis</button></div>
    <div class="big" id="phase"></div>
    <div class="read" id="read"></div>
    <p class="note">Saat diafragma berkontraksi (mendatar) dan tulang rusuk terangkat, rongga dada membesar sehingga tekanan udara di paru-paru lebih kecil daripada di luar: udara masuk (inspirasi). Saat keduanya relaksasi, rongga dada mengecil dan udara keluar (ekspirasi).</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
let timer = null, prev = 0, t0 = 0;
$('d').oninput = () => draw();
$('auto').onclick = () => { if(timer){ cancelAnimationFrame(timer); timer = null; $('auto').textContent = 'Bernapas otomatis'; return; } $('auto').textContent = 'Berhenti'; t0 = performance.now(); const go = now => { $('d').value = (1 - Math.cos((now - t0) / 4000 * 2 * Math.PI)) / 2; draw(); timer = requestAnimationFrame(go); }; timer = requestAnimationFrame(go); };
Sim.onTheme(() => draw());
function draw(){
  const d = +$('d').value, dir = d - prev; prev = d;
  const ribW = 150 + 22 * d, dy = 300 + 0 * d, curve = 60 - 50 * d; // kubah diafragma turun dan mendatar
  let s = '';
  // rongga dada
  s += `<path d="M${210 - ribW} 90 Q${210 - ribW - 10} 200 ${210 - ribW} ${dy - curve * .2} L${210 + ribW} ${dy - curve * .2} Q${210 + ribW + 10} 200 ${210 + ribW} 90 Z" style="fill:var(--surface-2);stroke:var(--ink)" stroke-width="2.5"/>`;
  for(let k = 0; k < 5; k++){ const y = 110 + k * 36 - d * 6 * (5 - k) / 5; s += `<path d="M${210 - ribW + 4} ${y + 10} Q210 ${y - 14 - d * 6} ${210 + ribW - 4} ${y + 10}" fill="none" style="stroke:var(--line-2)" stroke-width="3"/>`; }
  // trakea dan bronkus
  s += `<rect x="202" y="20" width="16" height="80" rx="6" style="fill:var(--surface);stroke:var(--ink)" stroke-width="2"/><path d="M210 100 L160 140 M210 100 L260 140" style="stroke:var(--ink)" stroke-width="5" fill="none"/>`;
  // paru-paru
  const lw = 70 + 30 * d, lh = 105 + 40 * d;
  s += `<ellipse cx="${210 - 22 - lw / 2}" cy="${150 + lh / 2}" rx="${lw / 2}" ry="${lh / 2}" style="fill:var(--b)" fill-opacity=".35" stroke="var(--b)"/><ellipse cx="${210 + 22 + lw / 2}" cy="${150 + lh / 2}" rx="${lw / 2}" ry="${lh / 2}" style="fill:var(--b)" fill-opacity=".35" stroke="var(--b)"/>`;
  // diafragma
  s += `<path d="M${210 - ribW} ${dy - curve * .2} Q210 ${dy - curve * 1.8} ${210 + ribW} ${dy - curve * .2}" fill="none" style="stroke:var(--comp)" stroke-width="7"/><text class="c" x="${210 + ribW - 6}" y="${dy + 16}" text-anchor="end" style="fill:var(--comp)">diafragma</text>`;
  // panah udara
  if(Math.abs(dir) > 0.0005){ const inn = dir > 0; s += `<path d="M232 ${inn ? 20 : 70} L232 ${inn ? 70 : 20}" style="stroke:var(--a)" stroke-width="4" marker-end="url(#m)"/><text class="c" x="242" y="44" style="fill:var(--a)">udara ${inn ? 'masuk' : 'keluar'}</text>`; }
  svg.innerHTML = `<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--a)"/></marker></defs>` + s;
  $('dout').textContent = d > .5 ? 'berkontraksi (mendatar)' : 'relaksasi (melengkung)';
  $('phase').textContent = Math.abs(dir) < 0.0005 ? (d > .5 ? 'menahan napas (paru-paru mengembang)' : 'istirahat') : dir > 0 ? 'Inspirasi (menarik napas)' : 'Ekspirasi (mengembuskan napas)';
  $('read').innerHTML = `<div><span>Volume rongga dada</span><b>${d > .5 ? 'besar' : 'kecil'} (${fmt(2.4 + 0.5 * d, 2)} L udara di paru-paru)</b></div><div><span>Tekanan di paru-paru dibanding udara luar</span><b>${Math.abs(dir) < 0.0005 ? 'sama' : dir > 0 ? 'lebih rendah' : 'lebih tinggi'}</b></div><div><span>Tulang rusuk</span><b>${d > .5 ? 'terangkat' : 'turun'}</b></div>`;
}
draw();
</script>
</body>
</html>
