<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0a0f2c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="320.0" y="24.0" text-anchor="middle" class="t">Urutan saluran pencernaan</text><rect x="20" y="44" width="150" height="40" rx="10" fill="#2447f9" fill-opacity=".15" stroke="#2447f9" stroke-width="2"/><text x="95.0" y="69.0" text-anchor="middle" class="b" style="fill:#2447f9;font-size:13px">Mulut</text><text x="186.0" y="69.0" text-anchor="start" class="m" style="font-size:12px">gigi mengunyah; ludah berisi amilase: amilum → maltosa</text><line x1="95.0" y1="85.0" x2="95.0" y2="95.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ad)"/><rect x="20" y="96" width="150" height="40" rx="10" fill="#0e8f8a" fill-opacity=".15" stroke="#0e8f8a" stroke-width="2"/><text x="95.0" y="121.0" text-anchor="middle" class="b" style="fill:#0e8f8a;font-size:13px">Kerongkongan</text><text x="186.0" y="121.0" text-anchor="start" class="m" style="font-size:12px">gerak peristaltik mendorong makanan</text><line x1="95.0" y1="137.0" x2="95.0" y2="147.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ad)"/><rect x="20" y="148" width="150" height="40" rx="10" fill="#d98200" fill-opacity=".15" stroke="#d98200" stroke-width="2"/><text x="95.0" y="173.0" text-anchor="middle" class="b" style="fill:#d98200;font-size:13px">Lambung</text><text x="186.0" y="173.0" text-anchor="start" class="m" style="font-size:12px">otot meremas; HCl membunuh kuman; pepsin: protein → pepton</text><line x1="95.0" y1="189.0" x2="95.0" y2="199.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ad)"/><rect x="20" y="200" width="150" height="40" rx="10" fill="#e0344b" fill-opacity=".15" stroke="#e0344b" stroke-width="2"/><text x="95.0" y="225.0" text-anchor="middle" class="b" style="fill:#e0344b;font-size:13px">Usus halus</text><text x="186.0" y="225.0" text-anchor="start" class="m" style="font-size:12px">empedu mengemulsi lemak; enzim pankreas (amilase, tripsin, lipase); penyerapan sari makanan oleh vili</text><line x1="95.0" y1="241.0" x2="95.0" y2="251.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ad)"/><rect x="20" y="252" width="150" height="40" rx="10" fill="#7c3aed" fill-opacity=".15" stroke="#7c3aed" stroke-width="2"/><text x="95.0" y="277.0" text-anchor="middle" class="b" style="fill:#7c3aed;font-size:13px">Usus besar</text><text x="186.0" y="277.0" text-anchor="start" class="m" style="font-size:12px">penyerapan air; bakteri baik membentuk vitamin K</text><line x1="95.0" y1="293.0" x2="95.0" y2="303.0" stroke="#0a0f2c" stroke-width="2" marker-end="url(#ad)"/><rect x="20" y="304" width="150" height="40" rx="10" fill="#5a6283" fill-opacity=".15" stroke="#5a6283" stroke-width="2"/><text x="95.0" y="329.0" text-anchor="middle" class="b" style="fill:#5a6283;font-size:13px">Rektum dan anus</text><text x="186.0" y="329.0" text-anchor="start" class="m" style="font-size:12px">penampungan dan pengeluaran feses</text><text x="20.0" y="368.0" text-anchor="start" class="b">Kelenjar pencernaan di luar saluran: kelenjar ludah, hati (empedu), dan pankreas.</text></svg>
