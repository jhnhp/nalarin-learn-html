<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="320.0" y="22.0" text-anchor="middle" class="t">Profil (horizon) tanah</text><rect x="40" y="40" width="160" height="30" fill="#3b2a1a"/><text x="120.0" y="61.0" text-anchor="middle" class="b" style="fill:#fff">Horizon O</text><text x="220.0" y="60.0" text-anchor="start" class="m" style="font-size:12px">lapisan organik: serasah dan humus</text><rect x="40" y="70" width="160" height="60" fill="#5c4029"/><text x="120.0" y="106.0" text-anchor="middle" class="b" style="fill:#fff">Horizon A</text><text x="220.0" y="105.0" text-anchor="start" class="m" style="font-size:12px">tanah atas (topsoil): gelap, banyak humus, akar, mikroba</text><rect x="40" y="130" width="160" height="70" fill="#9b6b3d"/><text x="120.0" y="171.0" text-anchor="middle" class="b" style="fill:#fff">Horizon B</text><text x="220.0" y="170.0" text-anchor="start" class="m" style="font-size:12px">tanah bawah (subsoil): lebih terang, sedikit humus, endapan mineral</text><rect x="40" y="200" width="160" height="60" fill="#b8946a"/><text x="120.0" y="236.0" text-anchor="middle" class="b" style="fill:#fff">Horizon C</text><text x="220.0" y="235.0" text-anchor="start" class="m" style="font-size:12px">bahan induk: batuan yang sedang melapuk</text><rect x="40" y="260" width="160" height="50" fill="#7d7d7d"/><text x="120.0" y="291.0" text-anchor="middle" class="b" style="fill:#fff">Horizon R</text><text x="220.0" y="290.0" text-anchor="start" class="m" style="font-size:12px">batuan induk (bedrock): belum melapuk</text><path d="M70 70 q-6 40 -2 80" stroke="#c9a37a" stroke-width="2" fill="none"/><path d="M95 70 q-3 40 -1 80" stroke="#c9a37a" stroke-width="2" fill="none"/><path d="M120 70 q0 40 0 80" stroke="#c9a37a" stroke-width="2" fill="none"/><path d="M145 70 q3 40 1 80" stroke="#c9a37a" stroke-width="2" fill="none"/><path d="M170 70 q6 40 2 80" stroke="#c9a37a" stroke-width="2" fill="none"/></svg>
