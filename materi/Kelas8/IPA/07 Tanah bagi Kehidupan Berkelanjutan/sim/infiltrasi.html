<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uji Daya Serap Tanah</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../css/sim.css">
<style>.c{font-family:var(--display);font-weight:800;font-size:12px}</style>
</head>
<body>
<div class="sim">
  <div class="stage"><svg id="svg" viewBox="0 0 460 360" role="img" aria-label="Tiga corong berisi tanah pasir, lempung, dan liat dengan gelas penampung air"></svg></div>
  <div class="panel">
    <div class="row"><button class="btn primary" id="pour">Tuang 200 mL air ▶</button><button class="btn" id="reset">Ulang</button></div>
    <div><div class="lab"><span>Waktu</span><b id="tout"></b></div><input type="range" id="t" min="0" max="10" step="0.1" value="0"></div>
    <div class="read" id="read"></div>
    <p class="note">Pasir berbutir besar dengan pori besar: air cepat lolos, sedikit tertahan. Liat berbutir sangat halus: air lambat meresap, banyak tertahan, mudah tergenang. Lempung (campuran) paling baik untuk pertanian: cukup menyimpan air dan udara.</p>
  </div>
</div>
<script src="../../../../../js/sim.js"></script>
<script>
const {fmt} = Sim;
const $ = id => document.getElementById(id);
const svg = $('svg');
// [nama, laju (mL/menit awal), kapasitas tahan air (mL), warna, ukuran butir]
const S = [['pasir', 80, 30, '#e3c48a', 6], ['lempung', 25, 70, '#9b6b3d', 3.5], ['liat', 6, 110, '#7a5a48', 1.6]];
let timer = null, poured = false;
$('pour').onclick = () => { poured = true; $('t').value = 0; if(timer) clearInterval(timer); timer = setInterval(() => { const v = Math.min(10, +$('t').value + .1); $('t').value = v; draw(); if(v >= 10){ clearInterval(timer); timer = null; } }, 50); };
$('reset').onclick = () => { poured = false; if(timer){ clearInterval(timer); timer = null; } $('t').value = 0; draw(); };
$('t').oninput = () => { poured = true; draw(); };
Sim.onTheme(draw);
function out(i, t){ const [, r, keep] = S[i], avail = 200 - keep; return poured ? avail * (1 - Math.exp(-r * t / avail)) : 0; }
function draw(){
  const t = +$('t').value; let s = '';
  S.forEach(([n, r, keep, col, g], i) => { const x = 40 + i * 145, o = out(i, t), top = poured ? Math.max(0, 200 - keep - o) : 0;
    s += `<polygon points="${x},40 ${x + 110},40 ${x + 70},150 ${x + 40},150" style="fill:var(--surface);stroke:var(--ink)" stroke-width="2"/>`;
    // tanah
    s += `<polygon points="${x + 14},78 ${x + 96},78 ${x + 74},140 ${x + 36},140" fill="${col}"/>`;
    for(let k = 0; k < 40; k++){ const px = x + 30 + ((k * 37) % 50), py = 84 + ((k * 23) % 52); s += `<circle cx="${px}" cy="${py}" r="${g / 2}" fill="#fff" fill-opacity=".25"/>`; }
    // genangan di atas tanah
    if(top > 1) s += `<polygon points="${x + 14},78 ${x + 96},78 ${x + 96 + 0},${78 - Math.min(30, top / 4)} ${x + 14},${78 - Math.min(30, top / 4)}" style="fill:var(--a)" fill-opacity=".35"/>`;
    // tetesan
    if(poured && t < 10 && o < 200 - keep - 1) s += `<line x1="${x + 55}" y1="152" x2="${x + 55}" y2="${160 + (t * 40) % 30}" style="stroke:var(--a)" stroke-width="3" stroke-dasharray="3 5"/>`;
    // gelas
    s += `<rect x="${x + 20}" y="200" width="70" height="120" rx="4" style="fill:var(--surface);stroke:var(--ink)" stroke-width="2"/><rect x="${x + 22}" y="${318 - o / 200 * 116}" width="66" height="${o / 200 * 116}" style="fill:var(--a)" fill-opacity=".35"/>`;
    s += `<text class="c" x="${x + 55}" y="340" text-anchor="middle">${n}</text><text class="c" x="${x + 55}" y="194" text-anchor="middle" style="fill:var(--a)">${fmt(o, 0)} mL</text>`; });
  svg.innerHTML = s;
  $('tout').textContent = fmt(t, 1) + ' menit';
  $('read').innerHTML = S.map(([n, , keep], i) => `<div><span>${n}: air lolos / tertahan</span><b>${fmt(out(i, t), 0)} mL / ${poured ? fmt(200 - out(i, t), 0) : 0} mL</b></div>`).join('') + `<div><span>Paling cepat meresap</span><b>pasir</b></div><div><span>Paling banyak menahan air</span><b>liat</b></div>`;
}
draw();
</script>
</body>
</html>
