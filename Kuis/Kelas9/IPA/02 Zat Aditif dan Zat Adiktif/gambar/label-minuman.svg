<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<rect x="20" y="20" width="420" height="250" rx="12" fill="#fff" stroke="#0a0f2c" stroke-width="2"/><text x="230.0" y="50.0" text-anchor="middle" class="t">MINUMAN RASA JERUK</text><text x="40.0" y="84.0" text-anchor="start" class="m">Komposisi: air, gula, sari jeruk 10%, pengatur keasaman (asam sitrat),</text><text x="40.0" y="104.0" text-anchor="start" class="m">pengawet natrium benzoat, pemanis buatan aspartam,</text><text x="40.0" y="124.0" text-anchor="start" class="m">pewarna tartrazin CI 19140, perisa jeruk.</text><line x1="40.0" y1="140.0" x2="420.0" y2="140.0" stroke="#e3e6f1" stroke-width="1.5"/><text x="40.0" y="162.0" text-anchor="start" class="b" style="font-size:12px">Mengandung pemanis buatan aspartam.</text><text x="40.0" y="178.0" text-anchor="start" class="b" style="font-size:12px">Tidak untuk penderita fenilketonuria.</text><text x="40.0" y="202.0" text-anchor="start" class="m">BPOM RI MD 123456789012</text><text x="40.0" y="226.0" text-anchor="start" class="m">Isi bersih 250 mL</text><text x="40.0" y="250.0" text-anchor="start" class="m">Baik digunakan sebelum: 12 2027</text></svg>
