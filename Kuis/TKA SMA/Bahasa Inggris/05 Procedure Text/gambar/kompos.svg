<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 564"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<rect x="0" y="0" width="760" height="96" fill="#0e8f8a"/><text x="380.0" y="46.0" text-anchor="middle" class="t" style="fill:#fff;font-size:26px">Make Your Own Compost</text><text x="380.0" y="76.0" text-anchor="middle" style="fill:#fff;font-size:14px">Turn kitchen and garden waste into rich soil in about two months</text><rect x="30" y="120" width="340" height="102" rx="14" fill="#f7f8fd" stroke="#e3e6f1"/><circle cx="62" cy="152" r="18" fill="#0e8f8a"/><text x="62.0" y="158.0" text-anchor="middle" class="b" style="fill:#fff;font-size:17px">1</text><text x="90.0" y="158.0" text-anchor="start" class="b" style="font-size:15.5px">Choose a container</text><text x="50.0" y="184.0" text-anchor="start" style="font-size:13px">Use a bin or bucket with holes</text><text x="50.0" y="202.0" text-anchor="start" style="font-size:13px">in the sides for air. Put it in a shady place.</text><rect x="390" y="120" width="340" height="102" rx="14" fill="#f7f8fd" stroke="#e3e6f1"/><circle cx="422" cy="152" r="18" fill="#0e8f8a"/><text x="422.0" y="158.0" text-anchor="middle" class="b" style="fill:#fff;font-size:17px">2</text><text x="450.0" y="158.0" text-anchor="start" class="b" style="font-size:15.5px">Add a brown layer</text><text x="410.0" y="184.0" text-anchor="start" style="font-size:13px">Start with 10 cm of dry leaves,</text><text x="410.0" y="202.0" text-anchor="start" style="font-size:13px">straw, or torn cardboard.</text><rect x="30" y="238" width="340" height="102" rx="14" fill="#f7f8fd" stroke="#e3e6f1"/><circle cx="62" cy="270" r="18" fill="#0e8f8a"/><text x="62.0" y="276.0" text-anchor="middle" class="b" style="fill:#fff;font-size:17px">3</text><text x="90.0" y="276.0" text-anchor="start" class="b" style="font-size:15.5px">Add a green layer</text><text x="50.0" y="302.0" text-anchor="start" style="font-size:13px">Add fruit and vegetable peels,</text><text x="50.0" y="320.0" text-anchor="start" style="font-size:13px">coffee grounds, or fresh grass.</text><rect x="390" y="238" width="340" height="102" rx="14" fill="#f7f8fd" stroke="#e3e6f1"/><circle cx="422" cy="270" r="18" fill="#0e8f8a"/><text x="422.0" y="276.0" text-anchor="middle" class="b" style="fill:#fff;font-size:17px">4</text><text x="450.0" y="276.0" text-anchor="start" class="b" style="font-size:15.5px">Repeat the layers</text><text x="410.0" y="302.0" text-anchor="start" style="font-size:13px">Cover each green layer with a</text><text x="410.0" y="320.0" text-anchor="start" style="font-size:13px">brown layer to stop bad smells.</text><rect x="30" y="356" width="340" height="102" rx="14" fill="#f7f8fd" stroke="#e3e6f1"/><circle cx="62" cy="388" r="18" fill="#0e8f8a"/><text x="62.0" y="394.0" text-anchor="middle" class="b" style="fill:#fff;font-size:17px">5</text><text x="90.0" y="394.0" text-anchor="start" class="b" style="font-size:15.5px">Keep it damp</text><text x="50.0" y="420.0" text-anchor="start" style="font-size:13px">Sprinkle water if it is dry. It should</text><text x="50.0" y="438.0" text-anchor="start" style="font-size:13px">feel like a squeezed-out sponge.</text><rect x="390" y="356" width="340" height="102" rx="14" fill="#f7f8fd" stroke="#e3e6f1"/><circle cx="422" cy="388" r="18" fill="#0e8f8a"/><text x="422.0" y="394.0" text-anchor="middle" class="b" style="fill:#fff;font-size:17px">6</text><text x="450.0" y="394.0" text-anchor="start" class="b" style="font-size:15.5px">Turn it every week</text><text x="410.0" y="420.0" text-anchor="start" style="font-size:13px">Mix the pile with a stick or spade.</text><text x="410.0" y="438.0" text-anchor="start" style="font-size:13px">Ready when it is dark and crumbly.</text><text x="380.0" y="534.0" text-anchor="middle" class="b" style="fill:#e0344b;font-size:14.5px">Do NOT add meat, bones, oil, or dairy products. They attract rats and flies.</text></svg>
