<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320">
<defs>
<style>
text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:13px}
.m{fill:#5a6283;font-size:12px}
.b{font-weight:700}
.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}
.num{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:700;font-size:14px;fill:#fff;text-anchor:middle}
</style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="320" y="28" text-anchor="middle" class="t">Skala Derajat Keasaman (pH) dan Karakteristik Larutan</text>

<!-- Pita Spektrum pH 0 - 14 -->
<g id="bars" transform="translate(25, 60)">
  <!-- pH 0 to 14 blocks: width 39px each, height 44px -->
  <rect x="0" y="0" width="39" height="44" rx="4" fill="#b91c1c"/><text x="19.5" y="27" class="num">0</text>
  <rect x="40" y="0" width="39" height="44" rx="4" fill="#dc2626"/><text x="59.5" y="27" class="num">1</text>
  <rect x="80" y="0" width="39" height="44" rx="4" fill="#ea580c"/><text x="99.5" y="27" class="num">2</text>
  <rect x="120" y="0" width="39" height="44" rx="4" fill="#f97316"/><text x="139.5" y="27" class="num">3</text>
  <rect x="160" y="0" width="39" height="44" rx="4" fill="#f59e0b"/><text x="179.5" y="27" class="num">4</text>
  <rect x="200" y="0" width="39" height="44" rx="4" fill="#eab308"/><text x="219.5" y="27" class="num">5</text>
  <rect x="240" y="0" width="39" height="44" rx="4" fill="#84cc16"/><text x="259.5" y="27" class="num">6</text>
  <rect x="280" y="0" width="39" height="44" rx="4" fill="#10b981"/><text x="299.5" y="27" class="num">7</text>
  <rect x="320" y="0" width="39" height="44" rx="4" fill="#06b6d4"/><text x="339.5" y="27" class="num">8</text>
  <rect x="360" y="0" width="39" height="44" rx="4" fill="#0ea5e9"/><text x="379.5" y="27" class="num">9</text>
  <rect x="400" y="0" width="39" height="44" rx="4" fill="#3b82f6"/><text x="419.5" y="27" class="num">10</text>
  <rect x="440" y="0" width="39" height="44" rx="4" fill="#2563eb"/><text x="459.5" y="27" class="num">11</text>
  <rect x="480" y="0" width="39" height="44" rx="4" fill="#6366f1"/><text x="499.5" y="27" class="num">12</text>
  <rect x="520" y="0" width="39" height="44" rx="4" fill="#7c3aed"/><text x="539.5" y="27" class="num">13</text>
  <rect x="560" y="0" width="39" height="44" rx="4" fill="#581c87"/><text x="579.5" y="27" class="num">14</text>
</g>

<!-- Panah & Label Wilayah Sifat -->
<!-- Wilayah Asam: 0 - 6 -->
<line x1="25" y1="120" x2="285" y2="120" stroke="#e0344b" stroke-width="3"/>
<polygon points="25,120 35,115 35,125" fill="#e0344b"/>
<text x="155" y="138" text-anchor="middle" class="b" fill="#e0344b">ASAM (pH &lt; 7)</text>
<text x="155" y="154" text-anchor="middle" class="m">Makin ke kiri, asam makin kuat</text>

<!-- Titik Netral: 7 -->
<circle cx="325" cy="120" r="5" fill="#10b981"/>
<text x="325" y="138" text-anchor="middle" class="b" fill="#0b9a6a">NETRAL (pH = 7)</text>
<text x="325" y="154" text-anchor="middle" class="m">Air murni / garam</text>

<!-- Wilayah Basa: 8 - 14 -->
<line x1="365" y1="120" x2="625" y2="120" stroke="#2447f9" stroke-width="3"/>
<polygon points="625,120 615,115 615,125" fill="#2447f9"/>
<text x="495" y="138" text-anchor="middle" class="b" fill="#2447f9">BASA (pH &gt; 7)</text>
<text x="495" y="154" text-anchor="middle" class="m">Makin ke kanan, basa makin kuat</text>

<!-- Contoh Zat Sehari-hari (3 Kolom Kartu) -->
<g transform="translate(25, 175)">
  <!-- Kartu Asam -->
  <rect x="0" y="0" width="180" height="125" rx="10" fill="#f7f8fd" stroke="#e3e6f1" stroke-width="1.5"/>
  <rect x="0" y="0" width="180" height="6" rx="3" fill="#e0344b"/>
  <text x="12" y="26" class="b" fill="#e0344b">Contoh Asam:</text>
  <text x="12" y="48" class="m">• Asam lambung/HCl (pH 1-2)</text>
  <text x="12" y="68" class="m">• Air perasan jeruk (pH 2-3)</text>
  <text x="12" y="88" class="m">• Cuka dapur (pH 3)</text>
  <text x="12" y="108" class="m">• Hujan asam (pH 4-5)</text>

  <!-- Kartu Netral -->
  <rect x="205" y="0" width="180" height="125" rx="10" fill="#f7f8fd" stroke="#e3e6f1" stroke-width="1.5"/>
  <rect x="205" y="0" width="180" height="6" rx="3" fill="#10b981"/>
  <text x="217" y="26" class="b" fill="#0b9a6a">Contoh Netral:</text>
  <text x="217" y="48" class="m">• Air suling/murni (pH 7,0)</text>
  <text x="217" y="68" class="m">• Larutan garam dapur (pH 7,0)</text>
  <text x="217" y="88" class="m">• Air minum mineral (pH ~7)</text>
  <text x="217" y="108" class="m">• Air mata normal (pH ~7,4)</text>

  <!-- Kartu Basa -->
  <rect x="410" y="0" width="180" height="125" rx="10" fill="#f7f8fd" stroke="#e3e6f1" stroke-width="1.5"/>
  <rect x="410" y="0" width="180" height="6" rx="3" fill="#2447f9"/>
  <text x="422" y="26" class="b" fill="#2447f9">Contoh Basa:</text>
  <text x="422" y="48" class="m">• Darah manusia (pH 7,4)</text>
  <text x="422" y="68" class="m">• Soda kue/baking soda (pH 8,5)</text>
  <text x="422" y="88" class="m">• Obat sakit maag/antasida (pH 10)</text>
  <text x="422" y="108" class="m">• Sabun mandi &amp; pemutih (pH 11-13)</text>
</g>
</svg>