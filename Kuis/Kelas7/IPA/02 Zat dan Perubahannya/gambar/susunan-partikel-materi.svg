<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320">
<defs>
<style>
text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:13px}
.m{fill:#5a6283;font-size:12px}
.b{font-weight:700}
.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}
</style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="310" y="26" text-anchor="middle" class="t">Model Partikel Mikroskopis Susunan Materi</text>

<!-- Kotak I: Atom Tunggal / Unsur Monoatomik (misal Gas Mulia Argon / Helium) -->
<g transform="translate(30, 48)">
  <rect x="0" y="0" width="125" height="155" rx="10" fill="#f7f8fd" stroke="#0a0f2c" stroke-width="1.8"/>
  <!-- Bola-bola atom tunggal hijau identik -->
  <circle cx="35" cy="35" r="12" fill="#0b9a6a" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="90" cy="45" r="12" fill="#0b9a6a" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="45" cy="85" r="12" fill="#0b9a6a" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="95" cy="105" r="12" fill="#0b9a6a" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="35" cy="135" r="12" fill="#0b9a6a" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="75" cy="135" r="12" fill="#0b9a6a" stroke="#0a0f2c" stroke-width="1.5"/>
  
  <rect x="0" y="165" width="125" height="65" rx="8" fill="#f7f8fd" stroke="#e3e6f1" stroke-width="1"/>
  <text x="62" y="185" text-anchor="middle" class="b">Kotak I</text>
  <text x="62" y="203" text-anchor="middle" class="m">Atom Tunggal</text>
  <text x="62" y="220" text-anchor="middle" class="b" fill="#0b9a6a">Unsur</text>
</g>

<!-- Kotak II: Molekul Unsur (atom sejenis berpasangan, misal O2, N2, H2) -->
<g transform="translate(175, 48)">
  <rect x="0" y="0" width="125" height="155" rx="10" fill="#f7f8fd" stroke="#0a0f2c" stroke-width="1.8"/>
  <!-- Pasangan molekul unsur biru -->
  <!-- Pasangan 1 -->
  <circle cx="35" cy="35" r="11" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>
  <circle cx="52" cy="42" r="11" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>
  <!-- Pasangan 2 -->
  <circle cx="85" cy="80" r="11" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>
  <circle cx="100" cy="92" r="11" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>
  <!-- Pasangan 3 -->
  <circle cx="30" cy="105" r="11" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>
  <circle cx="42" cy="118" r="11" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>
  <!-- Pasangan 4 -->
  <circle cx="80" cy="135" r="11" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>
  <circle cx="96" cy="142" r="11" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>

  <rect x="0" y="165" width="125" height="65" rx="8" fill="#f7f8fd" stroke="#e3e6f1" stroke-width="1"/>
  <text x="62" y="185" text-anchor="middle" class="b">Kotak II</text>
  <text x="62" y="203" text-anchor="middle" class="m">Molekul Unsur</text>
  <text x="62" y="220" text-anchor="middle" class="b" fill="#2447f9">(cth: O₂)</text>
</g>

<!-- Kotak III: Molekul Senyawa (atom berbeda jenis berikatan, misal H2O / CO2) -->
<g transform="translate(320, 48)">
  <rect x="0" y="0" width="125" height="155" rx="10" fill="#f7f8fd" stroke="#0a0f2c" stroke-width="1.8"/>
  <!-- Molekul triatomik (1 atom merah pusat + 2 atom putih/abu) -->
  <!-- Molekul 1 -->
  <circle cx="50" cy="42" r="12" fill="#e0344b" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="37" cy="30" r="8" fill="#fff" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="63" cy="30" r="8" fill="#fff" stroke="#0a0f2c" stroke-width="1.5"/>
  <!-- Molekul 2 -->
  <circle cx="90" cy="95" r="12" fill="#e0344b" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="77" cy="83" r="8" fill="#fff" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="103" cy="83" r="8" fill="#fff" stroke="#0a0f2c" stroke-width="1.5"/>
  <!-- Molekul 3 -->
  <circle cx="45" cy="120" r="12" fill="#e0344b" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="32" cy="108" r="8" fill="#fff" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="58" cy="108" r="8" fill="#fff" stroke="#0a0f2c" stroke-width="1.5"/>

  <rect x="0" y="165" width="125" height="65" rx="8" fill="#f7f8fd" stroke="#e3e6f1" stroke-width="1"/>
  <text x="62" y="185" text-anchor="middle" class="b">Kotak III</text>
  <text x="62" y="203" text-anchor="middle" class="m">Molekul Senyawa</text>
  <text x="62" y="220" text-anchor="middle" class="b" fill="#e0344b">(cth: H₂O)</text>
</g>

<!-- Kotak IV: Campuran (gabungan molekul unsur dan molekul senyawa) -->
<g transform="translate(465, 48)">
  <rect x="0" y="0" width="125" height="155" rx="10" fill="#f7f8fd" stroke="#0a0f2c" stroke-width="1.8"/>
  <!-- Molekul senyawa -->
  <circle cx="42" cy="40" r="11" fill="#e0344b" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="31" cy="30" r="7" fill="#fff" stroke="#0a0f2c" stroke-width="1.5"/>
  <circle cx="53" cy="30" r="7" fill="#fff" stroke="#0a0f2c" stroke-width="1.5"/>
  <!-- Pasangan molekul unsur biru -->
  <circle cx="88" cy="42" r="10" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>
  <circle cx="102" cy="52" r="10" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>
  <!-- Atom tunggal hijau -->
  <circle cx="88" cy="115" r="11" fill="#0b9a6a" stroke="#0a0f2c" stroke-width="1.5"/>
  <!-- Pasangan molekul unsur biru -->
  <circle cx="35" cy="115" r="10" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>
  <circle cx="48" cy="124" r="10" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.2"/>

  <rect x="0" y="165" width="125" height="65" rx="8" fill="#f7f8fd" stroke="#e3e6f1" stroke-width="1"/>
  <text x="62" y="185" text-anchor="middle" class="b">Kotak IV</text>
  <text x="62" y="203" text-anchor="middle" class="m">Campuran</text>
  <text x="62" y="220" text-anchor="middle" class="b" fill="#d98200">Homogen/Heterogen</text>
</g>

<!-- Footer info -->
<text x="310" y="305" text-anchor="middle" class="m">Model partikel menunjukkan perbedaan atom tunggal, molekul sejenis, senyawa kimia, dan campuran.</text>
</svg>