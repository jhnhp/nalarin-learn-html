<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330">
<defs>
<style>
text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:13px}
.m{fill:#5a6283;font-size:12px}
.b{font-weight:700}
.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}
</style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="310" y="24" text-anchor="middle" class="t">Kromatogram Analisis Sampel Pewarna Kue X</text>

<!-- Lembar Kertas Kromatografi (Kromatogram) -->
<g transform="translate(50, 45)">
  <rect x="0" y="0" width="320" height="245" rx="6" fill="#f7f8fd" stroke="#0a0f2c" stroke-width="1.8"/>

  <!-- Garis Batas Pelarut (Solvent Front) = 10 cm (y = 35) -->
  <line x1="20" y1="35" x2="300" y2="35" stroke="#0a0f2c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="305" y="39" class="m">10 cm (pelarut)</text>

  <!-- Garis Awal Totolan (Baseline) = 0 cm (y = 215) -->
  <line x1="20" y1="215" x2="300" y2="215" stroke="#0a0f2c" stroke-width="1.5"/>
  <text x="305" y="219" class="m">0 cm (awal)</text>

  <!-- Lintasan 1: Standar Pewarna Kuning (Tartrazin) - jarak 4 cm (y = 143) -->
  <line x1="60" y1="35" x2="60" y2="215" stroke="#e3e6f1" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="60" cy="215" r="3" fill="#d98200"/>
  <circle cx="60" cy="143" r="8" fill="#d98200"/>
  <text x="60" y="238" text-anchor="middle" class="b">Kuning</text>
  <text x="60" y="253" text-anchor="middle" class="m">(Tartrazin)</text>

  <!-- Lintasan 2: Standar Pewarna Merah (Allura) - jarak 7 cm (y = 89) -->
  <line x1="130" y1="35" x2="130" y2="215" stroke="#e3e6f1" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="130" cy="215" r="3" fill="#e0344b"/>
  <circle cx="130" cy="89" r="8" fill="#e0344b"/>
  <text x="130" y="238" text-anchor="middle" class="b">Merah</text>
  <text x="130" y="253" text-anchor="middle" class="m">(Allura)</text>

  <!-- Lintasan 3: Standar Pewarna Biru (Berlian) - jarak 9 cm (y = 53) -->
  <line x1="200" y1="35" x2="200" y2="215" stroke="#e3e6f1" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="200" cy="215" r="3" fill="#2447f9"/>
  <circle cx="200" cy="53" r="8" fill="#2447f9"/>
  <text x="200" y="238" text-anchor="middle" class="b">Biru</text>
  <text x="200" y="253" text-anchor="middle" class="m">(Berlian)</text>

  <!-- Lintasan 4: Sampel Makanan X (Oranye) -> terurai jadi Kuning (4 cm) & Merah (7 cm) -->
  <line x1="270" y1="35" x2="270" y2="215" stroke="#e3e6f1" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="270" cy="215" r="4" fill="#ea580c"/>
  <circle cx="270" cy="143" r="8" fill="#d98200"/>
  <circle cx="270" cy="89" r="8" fill="#e0344b"/>
  <text x="270" y="238" text-anchor="middle" class="b" fill="#ea580c">Sampel X</text>
  <text x="270" y="253" text-anchor="middle" class="m">(Oranye)</text>
</g>

<!-- Panel Analisis Data di Kanan -->
<g transform="translate(415, 45)">
  <rect x="0" y="0" width="185" height="265" rx="10" fill="#f7f8fd" stroke="#e3e6f1" stroke-width="1.5"/>
  <text x="14" y="26" class="b">Data Nilai Rf Zat:</text>
  
  <text x="14" y="54" class="b" fill="#d98200">Pewarna Kuning:</text>
  <text x="14" y="72" class="m">Jarak noda = 4,0 cm</text>
  <text x="14" y="90" class="b">Rf = 4,0 / 10 = 0,40</text>
  
  <line x1="14" y1="104" x2="170" y2="104" stroke="#e3e6f1" stroke-width="1"/>

  <text x="14" y="126" class="b" fill="#e0344b">Pewarna Merah:</text>
  <text x="14" y="144" class="m">Jarak noda = 7,0 cm</text>
  <text x="14" y="162" class="b">Rf = 7,0 / 10 = 0,70</text>
  
  <line x1="14" y1="176" x2="170" y2="176" stroke="#e3e6f1" stroke-width="1"/>

  <text x="14" y="198" class="b" fill="#2447f9">Pewarna Biru:</text>
  <text x="14" y="216" class="m">Jarak noda = 9,0 cm</text>
  <text x="14" y="234" class="b">Rf = 9,0 / 10 = 0,90</text>
  
  <rect x="10" y="242" width="165" height="18" rx="4" fill="#ea580c" fill-opacity="0.1"/>
  <text x="92" y="255" text-anchor="middle" class="b" style="font-size:10.5px" fill="#ea580c">Sampel X = Kuning + Merah</text>
</g>
</svg>