<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330">
<defs>
<style>
text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:13px}
.m{fill:#5a6283;font-size:11.5px}
.b{font-weight:700}
.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:15px}
</style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="310" y="26" text-anchor="middle" class="t">Bagan Klasifikasi Sifat-Sifat Materi</text>

<!-- Kotak Utama: Sifat Materi -->
<rect x="230" y="45" width="160" height="36" rx="8" fill="#0a0f2c"/>
<text x="310" y="68" text-anchor="middle" class="t" fill="#fff">SIFAT MATERI</text>

<!-- Cabang 1: Sifat Fisika (Kiri) & Cabang 2: Sifat Kimia (Kanan) -->
<path d="M280 81 L280 105 L150 105 L150 120" fill="none" stroke="#0a0f2c" stroke-width="1.8"/>
<path d="M340 81 L340 105 L470 105 L470 120" fill="none" stroke="#0a0f2c" stroke-width="1.8"/>

<!-- Kotak Sifat Fisika -->
<rect x="70" y="120" width="160" height="34" rx="6" fill="#2447f9"/>
<text x="150" y="142" text-anchor="middle" class="b" fill="#fff">Sifat Fisika</text>

<!-- Kotak Sifat Kimia -->
<rect x="390" y="120" width="160" height="34" rx="6" fill="#e0344b"/>
<text x="470" y="142" text-anchor="middle" class="b" fill="#fff">Sifat Kimia</text>

<!-- Garis Pemecah Sifat Fisika menjadi Ekstensif & Intensif -->
<path d="M120 154 L120 175 L65 175 L65 190" fill="none" stroke="#2447f9" stroke-width="1.5"/>
<path d="M180 154 L180 175 L235 175 L235 190" fill="none" stroke="#2447f9" stroke-width="1.5"/>

<!-- Kartu Sifat Ekstensif -->
<g transform="translate(5, 190)">
  <rect x="0" y="0" width="130" height="125" rx="8" fill="#f7f8fd" stroke="#d98200" stroke-width="1.5"/>
  <rect x="0" y="0" width="130" height="22" rx="4" fill="#d98200"/>
  <text x="65" y="15" text-anchor="middle" class="b" fill="#fff" style="font-size:11px">SIFAT EKSTENSIF</text>
  <text x="8" y="36" class="b" style="font-size:10px" fill="#d98200">Tergantung Jumlah</text>
  <text x="8" y="55" class="m">• Massa zat</text>
  <text x="8" y="72" class="m">• Volume zat</text>
  <text x="8" y="89" class="m">• Panjang / Ukuran</text>
  <text x="8" y="106" class="m">• Berat benda</text>
</g>

<!-- Kartu Sifat Intensif -->
<g transform="translate(150, 190)">
  <rect x="0" y="0" width="160" height="125" rx="8" fill="#f7f8fd" stroke="#0e8f8a" stroke-width="1.5"/>
  <rect x="0" y="0" width="160" height="22" rx="4" fill="#0e8f8a"/>
  <text x="80" y="15" text-anchor="middle" class="b" fill="#fff" style="font-size:11px">SIFAT INTENSIF</text>
  <text x="8" y="36" class="b" style="font-size:10px" fill="#0e8f8a">Tidak Tergantung Jumlah</text>
  <text x="8" y="55" class="m">• Massa jenis (kerapatan)</text>
  <text x="8" y="72" class="m">• Titik didih &amp; titik leleh</text>
  <text x="8" y="89" class="m">• Warna, bau, &amp; rasa</text>
  <text x="8" y="106" class="m">• Daya hantar kalor/listrik</text>
</g>

<!-- Kartu Sifat Kimia Detail -->
<g transform="translate(390, 165)">
  <rect x="0" y="0" width="210" height="150" rx="8" fill="#f7f8fd" stroke="#e0344b" stroke-width="1.5"/>
  <text x="12" y="24" class="b" fill="#e0344b">Ciri &amp; Karakteristik Kimia:</text>
  <text x="12" y="44" class="m">Melibatkan perubahan struktur dan pembentukan zat baru:</text>
  <text x="12" y="66" class="m">• <b>Mudah terbakar</b> (bensin, alkohol)</text>
  <text x="12" y="86" class="m">• <b>Mudah berkarat/korosi</b> (besi)</text>
  <text x="12" y="106" class="m">• <b>Reaktivitas / Kereaktifan</b></text>
  <text x="12" y="126" class="m">• <b>Derajat keasaman / kebasaan (pH)</b></text>
  <text x="12" y="142" class="m">• <b>Mudah membusuk</b> (makanan)</text>
</g>
</svg>