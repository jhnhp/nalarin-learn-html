<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320">
<defs>
<style>
text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}
.m{fill:#5a6283;font-size:12px}
.b{font-weight:700}
.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}
.pill{font-size:12px;font-weight:700;text-anchor:middle}
</style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="310" y="28" text-anchor="middle" class="t">Hasil Uji Lakmus pada Tiga Sampel Larutan</text>

<!-- Larutan P (Basa) -->
<g transform="translate(40, 50)">
  <rect x="0" y="0" width="160" height="240" rx="12" fill="#f7f8fd" stroke="#e3e6f1" stroke-width="1.5"/>
  <text x="80" y="32" text-anchor="middle" class="t">Larutan P</text>
  
  <!-- Gelas kimia -->
  <path d="M40 70 L40 145 Q40 155 50 155 L110 155 Q120 155 120 145 L120 70" fill="none" stroke="#0a0f2c" stroke-width="2.5"/>
  <path d="M42 105 L42 145 Q42 153 50 153 L110 153 Q118 153 118 105 Z" fill="#2447f9" fill-opacity="0.15"/>
  
  <!-- Kertas Lakmus Merah jadi Biru -->
  <rect x="52" y="80" width="20" height="55" rx="2" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.5"/>
  <rect x="52" y="60" width="20" height="20" rx="2" fill="#e0344b" stroke="#0a0f2c" stroke-width="1.5"/>
  
  <!-- Kertas Lakmus Biru tetap Biru -->
  <rect x="88" y="60" width="20" height="75" rx="2" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.5"/>
  
  <text x="80" y="182" text-anchor="middle" class="b">Lakmus Merah → <tspan fill="#2447f9">Biru</tspan></text>
  <text x="80" y="204" text-anchor="middle" class="b">Lakmus Biru → <tspan fill="#2447f9">Biru</tspan></text>
  <rect x="35" y="214" width="90" height="20" rx="6" fill="#2447f9" fill-opacity="0.12"/>
  <text x="80" y="228" class="pill" fill="#2447f9">Sifat: BASA</text>
</g>

<!-- Larutan Q (Asam) -->
<g transform="translate(230, 50)">
  <rect x="0" y="0" width="160" height="240" rx="12" fill="#f7f8fd" stroke="#e3e6f1" stroke-width="1.5"/>
  <text x="80" y="32" text-anchor="middle" class="t">Larutan Q</text>
  
  <!-- Gelas kimia -->
  <path d="M40 70 L40 145 Q40 155 50 155 L110 155 Q120 155 120 70" fill="none" stroke="#0a0f2c" stroke-width="2.5"/>
  <path d="M42 105 L42 145 Q42 153 50 153 L110 153 Q118 153 118 105 Z" fill="#e0344b" fill-opacity="0.15"/>
  
  <!-- Kertas Lakmus Merah tetap Merah -->
  <rect x="52" y="60" width="20" height="75" rx="2" fill="#e0344b" stroke="#0a0f2c" stroke-width="1.5"/>
  
  <!-- Kertas Lakmus Biru jadi Merah -->
  <rect x="88" y="80" width="20" height="55" rx="2" fill="#e0344b" stroke="#0a0f2c" stroke-width="1.5"/>
  <rect x="88" y="60" width="20" height="20" rx="2" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.5"/>
  
  <text x="80" y="182" text-anchor="middle" class="b">Lakmus Merah → <tspan fill="#e0344b">Merah</tspan></text>
  <text x="80" y="204" text-anchor="middle" class="b">Lakmus Biru → <tspan fill="#e0344b">Merah</tspan></text>
  <rect x="35" y="214" width="90" height="20" rx="6" fill="#e0344b" fill-opacity="0.12"/>
  <text x="80" y="228" class="pill" fill="#e0344b">Sifat: ASAM</text>
</g>

<!-- Larutan R (Netral) -->
<g transform="translate(420, 50)">
  <rect x="0" y="0" width="160" height="240" rx="12" fill="#f7f8fd" stroke="#e3e6f1" stroke-width="1.5"/>
  <text x="80" y="32" text-anchor="middle" class="t">Larutan R</text>
  
  <!-- Gelas kimia -->
  <path d="M40 70 L40 145 Q40 155 50 155 L110 155 Q120 155 120 70" fill="none" stroke="#0a0f2c" stroke-width="2.5"/>
  <path d="M42 105 L42 145 Q42 153 50 153 L110 153 Q118 153 118 105 Z" fill="#0b9a6a" fill-opacity="0.15"/>
  
  <!-- Kertas Lakmus Merah tetap Merah -->
  <rect x="52" y="60" width="20" height="75" rx="2" fill="#e0344b" stroke="#0a0f2c" stroke-width="1.5"/>
  
  <!-- Kertas Lakmus Biru tetap Biru -->
  <rect x="88" y="60" width="20" height="75" rx="2" fill="#2447f9" stroke="#0a0f2c" stroke-width="1.5"/>
  
  <text x="80" y="182" text-anchor="middle" class="b">Lakmus Merah → <tspan fill="#e0344b">Merah</tspan></text>
  <text x="80" y="204" text-anchor="middle" class="b">Lakmus Biru → <tspan fill="#2447f9">Biru</tspan></text>
  <rect x="35" y="214" width="90" height="20" rx="6" fill="#0b9a6a" fill-opacity="0.12"/>
  <text x="80" y="228" class="pill" fill="#0b9a6a">Sifat: NETRAL</text>
</g>
</svg>