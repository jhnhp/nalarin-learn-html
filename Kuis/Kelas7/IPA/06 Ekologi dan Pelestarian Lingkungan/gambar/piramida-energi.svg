<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330"><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#0a0f2c;font-size:14px}.m{fill:#5a6283;font-size:12.5px}.b{font-weight:700}.t{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:16px}.l{font-family:"Inter Tight",Inter,Arial,sans-serif;font-weight:800;font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="300.0" y="24.0" text-anchor="middle" class="t">Piramida energi</text><rect x="80.0" y="230" width="440" height="44" rx="6" fill="#0b9a6a" fill-opacity=".22" stroke="#0b9a6a" stroke-width="2"/><text x="300.0" y="250.0" text-anchor="middle" class="b" style="font-size:13px">Produsen (padi)</text><text x="300.0" y="267.0" text-anchor="middle" class="m">10.000 kJ</text><rect x="130.0" y="180" width="340" height="44" rx="6" fill="#0e8f8a" fill-opacity=".22" stroke="#0e8f8a" stroke-width="2"/><text x="300.0" y="200.0" text-anchor="middle" class="b" style="font-size:13px">Konsumen I (tikus)</text><text x="300.0" y="217.0" text-anchor="middle" class="m">1.000 kJ</text><rect x="180.0" y="130" width="240" height="44" rx="6" fill="#d98200" fill-opacity=".22" stroke="#d98200" stroke-width="2"/><text x="300.0" y="150.0" text-anchor="middle" class="b" style="font-size:13px">Konsumen II (ular)</text><text x="300.0" y="167.0" text-anchor="middle" class="m">100 kJ</text><rect x="230.0" y="80" width="140" height="44" rx="6" fill="#e0344b" fill-opacity=".22" stroke="#e0344b" stroke-width="2"/><text x="300.0" y="100.0" text-anchor="middle" class="b" style="font-size:13px">Konsumen III (elang)</text><text x="300.0" y="117.0" text-anchor="middle" class="m">10 kJ</text><text x="300.0" y="300.0" text-anchor="middle" class="m">Hanya sekitar 10% energi berpindah ke tingkat trofik berikutnya;</text><text x="300.0" y="318.0" text-anchor="middle" class="m">sisanya dipakai untuk hidup dan hilang sebagai panas.</text></svg>
