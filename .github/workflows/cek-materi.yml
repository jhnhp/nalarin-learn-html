name: Cek materi

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validasi struktur
        run: python3 scripts/validate_content.py
      - name: Pemeriksaan kualitas
        run: python3 scripts/cek_kualitas.py --wajib-katex
